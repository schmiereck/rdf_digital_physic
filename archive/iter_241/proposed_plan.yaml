falsification_criterion: 'The hypothesis will be refuted if any of the following occur:

  1. A systematic search over seeds of Hamming weight W <= 12 within a 3x3x3 bounding
  box under the LUT-08 rule finds no stable propagating gliders other than LUT-08
  and its O_h-symmetric equivalent orbits.

  2. Any newly discovered glider candidate is shown to be O_h-equivalent to LUT-08
  under one of the 48 coordinate transformations and a temporal phase shift.

  3. Any newly discovered glider is unstable when the simulation is run to 1000 steps
  (e.g., it degrades to vacuum, expands, or halts).

  4. The newly discovered glider''s velocity is equal to the speed-of-light limit
  (||v|| = sqrt(2)), violating the "sub-light" requirement.

  5. The newly discovered glider''s behavior is not O_h-covariant (i.e., rotating
  the initial seed by an O_h operation does not yield a glider propagating in the
  rotated direction).

  '
hypothesis: 'The 3D Face-Centered Cubic (FCC) lattice cellular automaton, under the
  reversible, O_h-symmetric rule that supports the known ''LUT-08'' sub-light glider,
  admits at least one other distinct species of stable, propagating sub-light glider.
  This new species is defined as a localized, periodic bit pattern propagating with
  a constant coordinate velocity 0 < ||v|| < sqrt(2), is stable for at least 1000
  steps, and belongs to a completely different O_h symmetry orbit (equivalence class
  under the 48 octahedral rotations and reflections, translations, and temporal phase-shifts)
  than the LUT-08 glider.

  '
pre_registration_file: src/pre_registration.md
proposed_method: '1. Create a pre-registration file `src/pre_registration.md` outlining
  the hypothesis, parameters, and falsification criteria.

  2. Implement an O_h symmetry group checker (`src/fcc_symmetry.py`) that generates
  the 48 coordinate transformations (permutations and signs) and maps both position
  vectors and the 12 FCC channel indices under each transformation.

  3. Locate the LUT-08 rule and glider structure (e.g., from `archive/iter_224/` or
  existing CA code in `src/`).

  4. Build a high-throughput 3D FCC simulation and search engine (`src/fcc_glider_search.py`)
  that generates localized initial states (W <= 12) and simulates them for 200 steps,
  filtering for stable, non-zero constant velocity propagation.

  5. For any surviving candidate, run an extended stability verification up to 1000
  steps.

  6. Apply the O_h symmetry checker to group all surviving stable gliders into unique
  equivalence classes (orbits), and compare them against the LUT-08 orbit.

  7. Verify O_h covariance by rotating the seed of any new glider species and checking
  if its propagation matches the rotated velocity.

  '
