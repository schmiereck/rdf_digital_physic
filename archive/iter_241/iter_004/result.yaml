experimenter_view: 'The Phase 7.1 search ran the full A+B+C pipeline on the LUT-08
  conservative

  rule across 3151 unique seeds (W in {4..8}). Although 2909 seeds satisfied a

  loose 80-step displacement threshold (>= 4.0), every one of them failed the

  combined 1000-step stability gate (perfect bit-conservation AND max_extent <= 6

  on every single step) before being eligible for sub-light or O_h covariance

  checks. None of the seeds happened to coincide with a LUT-08 phase shape

  (the systematic 1- and 2-cell enumeration does not include LUT-08''s native

  3-cell phase-0 geometry), so the orbit-membership filter discarded zero of

  them - the discrimination work was done entirely by the stability gate.

  A post-hoc sanity check confirms the orbit set correctly contains the LUT-08

  reference seed''s canonical form, so the discriminator itself is sound.

  The robust null result is consistent with the unique isolation of the LUT-08

  glider within the scanned configuration space under its own conservative LUT.

  '
