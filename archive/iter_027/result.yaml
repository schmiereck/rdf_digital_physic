artifacts:
- archive/iter_027/result.yaml
experimenter_view: 'The two-bit seed (50,50)+(51,50) — center + East neighbor — is
  NOT a

  stationary target. In the first step the bits spread to (50,50)+(52,50),

  then at step 2 the pattern collapses to a single bit at (53,50) and from

  that point on the lone ''1'' travels East at exactly 1 cell/step (a trivial

  single-bit glider). The net centroid displacement is only 0.5 because the

  final single bit wraps back near the starting x-coordinate after 100 steps

  on the 100-wide grid. This arrangement is therefore a DECAY event: the CA

  rule cannot preserve both bits when they are placed as an East-adjacent pair.

  The arrowhead-glider rule annihilates one bit when the East neighbor is ''1''

  and no NW bit is present to absorb the interaction.

  '
log_excerpt: "Initial positions: [(50, 50), (51, 50)]\nInitial centroid: (50.5, 50.0)\n\
  \  t=  1  bits=2  pos=[(50, 50), (52, 50)]\n  t=  2  bits=1  pos=[(53, 50)]\n  t=\
  \  3  bits=1  pos=[(54, 50)]\n  ...\n  t= 20  bits=1  pos=[(71, 50)]\n  t= 40  bits=1\
  \  pos=[(91, 50)]\n  t= 60  bits=1  pos=[(11, 50)]\n  t= 80  bits=1  pos=[(31, 50)]\n\
  \  t=100  bits=1  pos=[(51, 50)]\nis_bit_conserving:    False\nbehavior_class: \
  \      DECAY\nnet_displacement:     0.500000\nfinal_positions:      [(51, 50)]\n"
metrics:
  final_bit_count: 1
  initial_bit_count: 2
  net_displacement: 0.5
  step_at_decay: 2
notes: 'The East-adjacent two-bit seed is dynamically unstable under this rule; it
  loses one bit at step 2. A stationary two-bit fixed point (if one exists) must use
  a different relative orientation.

  '
status: experiment_failed
