experimenter_view: 'The local fitness metric revealed a stark landscape. All 99 of
  the 100 Gen-4

  rules stabilize the target region to exactly 22 bits (bit_ratio=2.2) with zero

  COM displacement between steps 100–200 — the same behaviour as the global

  champion rule_011 (which has baseline local fitness = 0.0). This is a meaningful

  null result: the entire Gen-4 cohort, like its parent, converts the 10-cell

  target pair into a static 22-cell configuration that then sits frozen. The

  local metric correctly scores this as zero since "sustained motion" requires

  a shifting COM.


  The sole exception, rule_090, achieves a small non-zero score (0.00593) but

  for the wrong reason: its tracking box explodes to 551 cells by step 200

  (bit_ratio=55.1), indicating chaotic growth across the entire local region.

  The tiny displacement (0.33 cells) is swamped by the huge growth penalty in

  the denominator, yielding the low score. So "beats baseline" is technically

  true (0.006 > 0.000) but not biologically meaningful — this rule is just

  chaotic, not coherently translating.


  Key observations: (1) The baseline value of 0.0 is a consequence of rule_011

  being a stable oscillator; its COM is constant, not translating. The local

  metric is working as designed — it penalizes stasis and rewards translation.

  (2) The evolutionary pressure from the global metric (rewarding COM of the

  entire 78-cell field) has not created useful variation for local translation

  of a 10-cell sub-region. (3) A second evolution pass seeded from rule_090

  (the only locally-moving rule), or a larger population, may find rules that

  combine coherent motion with bit stability.

  '
