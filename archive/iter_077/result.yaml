experimenter_view: 'The asymmetric "stepped" configuration places the two 3-bit L-shape
  still lifes sharing

  a corner cell neighbourhood at (51,51). Under the non-conserving rule (A=3↔B=14)
  this

  arrangement is immediately unstable: within 1 step the 6-bit composite collapses
  into

  an 8-bit static still life (bit count increases, then freezes). The close corner-contact

  causes the two objects to merge rather than propagate together. Unlike the iter_076
  gap

  configuration (which produced a moving composite), the corner-sharing asymmetric
  layout

  destroys the glider dynamics — the interaction is too tight and fuses the objects
  into

  a non-moving clump. No glider was produced; the success criterion was not met.

  '
