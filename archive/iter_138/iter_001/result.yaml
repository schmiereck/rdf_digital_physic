experimenter_view: 'The parity-conservation constraint (HammingWeight(A) % 2 == HammingWeight(B)
  % 2)

  yields 3 viable founders in 100 rules — a 3% hit rate with the quadratic penalty

  (fitness > 0.01 AND bit_ratio < 3.0). This is notably higher than the typical

  chaotic-explosion trap: all three viable rules have bit_ratios well below 1.0 or

  very close to 1.0 (0.575, 0.877, 1.003), consistent with the parity constraint

  suppressing runaway bit growth. The top rule (rule_002) achieves fitness=0.361

  with bit_ratio=1.003 — near-perfect bit conservation combined with real

  displacement. The constraint appears effective at biasing the search toward

  dynamically stable, motile rules rather than chaotic exploders.

  '
