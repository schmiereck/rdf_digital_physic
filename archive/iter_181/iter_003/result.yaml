experimenter_view: "The single stationary target bit at (64,64) is dynamically unstable\
  \ under\nrule g10_rule_001: at step 1 it spawns a second bit (at (65,64)) before\
  \ the\nglider has even reached it. This is because LUT[4]=1, meaning a cell with\n\
  only its W-neighbor set spontaneously generates a new bit.\n\nBy the time the glider\
  \ (starting at rows 32-33, moving East at ~1 row/step)\nreaches the expanded 2-bit\
  \ target region (~step 32), the collision produces\na stable 5-bit complex. This\
  \ complex propagates continuously for all 500\nsteps with com_col fixed at 64.20,\
  \ indicating coherent eastward motion.\n\nKey answers:\n- Glider survival: Yes —\
  \ a combined 5-bit structure continues moving East.\n- Target bit: Not simply destroyed;\
  \ it first expanded to 2 bits, then\n  merged with the incoming glider into the\
  \ 5-bit complex.\n- Bit conservation: NOT conserved. Initial=4, final=5 (net +1\
  \ bit created).\n- Explosive growth: None. Max bits ever = 5. Qualitatively different\
  \ from\n  the head-on collision; this is a gentle inelastic merger rather than an\n\
  \  explosion.\n\nThe glider-vs-single-bit collision is \"soft\": the rule's birth\
  \ condition\nLUT[4]=1 makes isolated bits inherently unstable, so any isolated target\n\
  will immediately expand. The end result is a slightly heavier composite\nglider\
  \ (+1 bit) that survives and travels on — a clear inelastic fusion event.\n"
