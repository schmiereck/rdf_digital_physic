task: 'Conduct a new evolutionary search to find a rule that produces elastic collisions.


  **Configuration:**

  -   **Fitness Function:** Use the `CollisionFitness` function from `src/fitness_functions.py`.

  -   **Population:** Start with a fresh, random population of 100 C2-symmetric rules.

  -   **Generations:** Run the evolution for a total of 10 generations.

  -   **Goal:** The primary objective is to find at least one rule that achieves a
  fitness score of 1.0, indicating perfect bit conservation during a collision.


  **Execution:**

  1.  Create a new script to orchestrate the evolutionary run.

  2.  In each generation, evaluate all rules in the population using `CollisionFitness`.

  3.  Select the top 10% of rules as the elite for the next generation.

  4.  Breed the next generation through crossover and mutation of the elite rules.

  5.  Log the maximum and average fitness for each generation.

  6.  If a rule with fitness 1.0 is found, the search can be considered a success
  and can stop early.


  **Output:**

  -   Save the complete truth table of the best rule found during the search to `archive/iter_186/results/champion_rule.json`.

  -   Save a log of the fitness scores per generation to `archive/iter_186/results/fitness_log.csv`.

  -   Report the final champion rule''s ID and its fitness score in the final result.'
