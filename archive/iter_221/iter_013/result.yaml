experimenter_view: 'The DisplacementConsistencyFitness class is a well-designed fitness
  function

  for cellular automaton glider discovery. Its core innovation is defeating

  "drifter" exploits by analyzing velocity consistency across time windows.

  True gliders show low standard deviation of per-window velocity magnitudes,

  while drifters (oscillating or random-walk objects) show high std dev.

  The formula base_fitness = mean_velocity_magnitude / (1 + std_dev) naturally

  penalizes inconsistent motion. Combined with the leaky conservation score,

  it rewards objects that are both directionally coherent AND mass-conserving.

  The COM unwrapping logic handles toroidal grid boundaries correctly at

  grid size 128.

  '
