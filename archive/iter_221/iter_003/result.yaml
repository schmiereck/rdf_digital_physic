experimenter_view: 'The evolutionary search uses a mutation-only strategy (ES) rather
  than a full GA with crossover.

  It starts with a population of 100, evolves for 20 generations with a population
  size of 100.

  The top 10 individuals (elite size) are preserved unchanged. The remaining 90 are
  generated

  by mutating elite parents (swap mutation). The fitness function searches for directional

  motion consistency in a hexagonal CA.

  '
log_excerpt: 'File read successfully.

  Summary of the Genetic Algorithm:

  - Chromosome: 128-bit binary array representing C2 hexagonal CA rules.

  - Selection: Deterministic elitism (top-k).

  - Mutation: Swap mutation (1 swap per child).

  - Crossover: None (Evolutionary Strategy).

  - Fitness: DisplacementConsistencyFitness.

  - Outputs: champion_rule.json, evolution_summary.csv, champion_vc_glider.gif.

  '
