experimenter_view: "Initial population strategies fall into 4 main categories:\n\n\
  1. RANDOM C2-SYMMETRIC (most common, ~18 scripts):\n   Scripts generate random C2-symmetric\
  \ rules by creating k∈[2,4] random\n   kernel pairs (a,b) where states rotate to\
  \ each other under C2 symmetry.\n   Examples: evolution.py, probe_evolution.py,\
  \ run_evolution_exp_220.py,\n   run_ash_evolution_gen1.py, run_c2_motion_evolution_gen1.py.\n\
  \   Fallback: If C2 rule building fails after max_attempts, fills with\n   random\
  \ 128-bit chromosomes.\n\n2. FILE-LOADED WARM-START (6 scripts):\n   run_evolution.py\
  \ supports optional --initial_population_path argument\n   that loads JSON files\
  \ containing chromosome arrays or rule dicts.\n   run_iter_217_sublight_search.py\
  \ explicitly warm-starts from iter_215\n   population (mix of iter_213/176/153 champions).\n\
  \n3. PREVIOUS ITERATION CHAMPION BREEDING (8 scripts):\n   run_iter_171_evo.py,\
  \ run_iter_173_evo.py, run_iter_174_evo.py,\n   run_iter_179_evolution.py, run_iter_189_evolution.py,\n\
  \   run_iter_190_2_evolution.py, run_iter_192_leaky_evolution.py,\n   run_iter_214_3_evolution.py.\
  \ These typically import from evolution.py\n   and breed new generations from elite\
  \ parents selected from previous\n   run's champion or top-ranked rules.\n\n4. SOUP/CONSTRAINED\
  \ (3 scripts):\n   run_cooling_soup_search_v2.py: generates random \"soup\" configurations.\n\
  \   run_parity_constrained_search.py: uses medium-density config (8 kernel\n   pairs)\
  \ from iter_129.\n   run_targeted_soup_search.py: draws pairs from HIGH_DENSITY_POOL.\n"
log_excerpt: 'Grep search found ~94 matching files across 3 pattern groups.

  Key patterns identified:

  - evolution.py: generate_random_c2_rule() using kernel pairs

  - run_evolution.py: supports both --initial_population_path (JSON) and random

  - run_iter_217_sublight_search.py: warm-starts from iter_215 population

  - run_parity_constrained_search.py: uses medium-density from iter_129

  '
