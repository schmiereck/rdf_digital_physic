experimenter_view: "The champion rule from iter_221 was evaluated using DisplacementConsistencyFitness\n\
  with the specified thresholds (num_windows=5, max_bit_threshold=12, max_velocity_threshold=0.9).\n\
  \nKey findings:\n1. The particle achieves PERFECT bit conservation (all 501 steps\
  \ have bit_count=3), yielding\n   a leaky conservation score of 1.0.\n2. Window\
  \ 2 reveals anomalous behavior: the COM jumps from (120.33, 63.33) to (20.33, 63.33),\n\
  \   a dx of -1.0 cells/step. This is a toroidal wrap-around, indicating the particle\
  \ moves\n   rapidly and hits the grid boundary, then reappears on the opposite side.\n\
  3. The mean velocity magnitude is very low (0.025) because the large reversal in\
  \ Window 2\n   cancels out the forward motion in the other four windows.\n4. The\
  \ std dev of velocity magnitudes (0.287) is dominated by the spike in Window 2.\n\
  5. Final fitness = 0.01968, matching the champion's reported fitness value.\n\n\
  This object is NOT a true glider — it is a fast-moving particle that wraps around\
  \ the\ntoroidal grid, with inconsistent velocity profiles across windows.\n"
