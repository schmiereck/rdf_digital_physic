experimenter_view: 'The code checks the magnitude of the **mean velocity vector**
  (displacement per window averaged vectorially), not the mean of the velocity magnitudes.

  A "drifter" with speed ~1.0 in every window but varying direction will have a small
  net displacement vector (low magnitude), allowing it to pass the `max_velocity_threshold`
  check. The logic correctly suppresses such drifters via the `std_dev` penalty later
  in the formula, but the threshold check itself targets coherent motion (directed
  drift), not total energy or mean speed.

  '
log_excerpt: 'The code calculates `window_velocity_vectors` for each window.

  The check uses `mean_velocity_magnitude` = `sqrt(mean_dx^2 + mean_dy^2)`.

  The discrepancy is due to vector vs scalar averaging:

  - Mean of magnitudes (scalar average): ~1.0

  - Magnitude of mean vector (directional drift): < 0.9

  '
metrics: {}
notes: Threshold checks vector magnitude, not mean speed.
