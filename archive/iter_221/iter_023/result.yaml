  more than 64 cells

  between consecutive steps, so the minimum-image correction in DisplacementConsistencyFitness

  never triggers. The raw COM values show the pattern oscillates within the grid

  (r values: 14→92→120→20→48→76→...), but each individual step delta is always <64,

  so no wrap correction is applied. The velocity of ~0.025 cels/step is genuine:

  the particle barely moves directionally — window 2 shows a 1-cell backward shift,

  while other windows show only ~0.28 cells/step forward. The fitness of 0.019679
  is

  simply mean_velocity / (1 + std_dev) = 0.025333 / (1 + 0.2873) = 0.019679.

  This is NOT an artifact of unwrapping — it reflects genuinely slow, inconsistent
  motion.

  '
