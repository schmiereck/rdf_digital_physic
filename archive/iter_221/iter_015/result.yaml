experimenter_view: 'The fitness function effectively addresses the "drifter" exploit
  in CA glider discovery by penalizing inconsistent motion. By using windowed velocity
  standard deviation, it distinguishes coherent v<c gliders from stationary or random-walk
  drifters. The integration of a continuous (leaky) bit-conservation metric ensures
  mass conservation is rewarded gradually rather than rejected outright.

  '
log_excerpt: 'Successfully extracted __init__ and __call__ methods from DisplacementConsistencyFitness
  class in src/new_fitness.py.

  The implementation divides simulation history into windows, calculates per-window
  velocity vectors, computes mean magnitude and standard deviation, and applies the
  core formula: mean_velocity_magnitude / (1 + std_dev_velocity_magnitudes). It multiplies
  the result by a leaky bit-conservation score.

