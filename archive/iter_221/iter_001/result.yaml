experimenter_view: 'The project is a cellular automaton glider discovery codebase
  focused on

  finding hexagonal CA rules that produce stable, directional-moving sub-light

  objects. The architecture separates cleanly into: (1) evolution.py for rule

  generation and stepping, (2) new_fitness.py for the core Drifter-defeating

  DisplacementConsistencyFitness metric (windowed velocity std-dev), and

  (3) 20+ simulation scripts for specific rule iterations. The evolution

  run_220_fixed.py uses a 3-bit L-tromino seed with 5-window velocity

  consistency scoring (num_windows=5, max_bit_threshold=12,

  max_velocity_threshold=0.9) over 20 generations with elite selection.

  '
