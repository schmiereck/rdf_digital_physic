experimenter_view: "PROJECT STRUCTURE SUMMARY:\n\n1. CORE INFRASTRUCTURE:\n   - engine.py:\
  \ Multi-bit hexagonal CA engine. Handles 1-bit (legacy) through N-bit cells\n  \
  \   with proper LUT construction (2^(7N) length) and step functions.\n   - rule.py:\
  \ Thin wrapper around rule dicts. Exposes LUT used by engine. Supports\n     variable\
  \ bits_per_cell (defaults to 1 for backward compatibility).\n   - evolution.py:\
  \ C2-symmetric rule generation and basic fitness evaluation.\n     Contains L-tromino\
  \ seed (63,63), (64,63), (64,64) on 128x128 grid, 200-step sim.\n   - fitness.py:\
  \ Robust fitness metrics including CheckpointFitness (bit-count stable\n     at\
  \ checkpoints) and velocity stability metrics. Prevents breeder/annihilator exploits.\n\
  \   - simulator.py: Particle and Simulator classes for running hexagonal CA simulations.\n\
  \n2. EVOLUTIONARY SEARCH SCRIPTS:\n   - run_iter_*.py: Iteration-specific evolution\
  \ runs (iter_170 through iter_220+)\n   - evolve*.py: General evolution scripts\
  \ (evolve.py, evolve_rules.py, etc.)\n   - run_vc_search*.py: Sub-light (v<c) glider\
  \ search scripts\n   - run_iter_220*.py: Current iteration scripts with max_bit_threshold=12\
  \ filter\n\n3. ANALYSIS/EXTRACTION TOOLS:\n   - analyze_*.py: Analysis scripts for\
  \ champions and elite rules\n   - characterize_*.py: Characterization of discovered\
  \ objects (gliders, oscillators)\n   - find_*.py: Kernel/object discovery scripts\
  \ (various constraints)\n   - extract_*.py: Pattern extraction from simulation state\n\
  \n4. CURRENT RESEARCH FOCUS (iter_220):\n   - Breeder exploit closed via max_bit_threshold=12\
  \ in DisplacementConsistencyFitness\n   - Preparing warm-start from iter_215 final\
  \ population\n   - Key open question: C2-preserving crossover operator design\n\
  \   - L-tromino seed confirmed as asymmetric seed (avoiding C2 symmetry bug)\n\n\
  5. KNOWN EXPLOITS AVOIDED:\n   - Settler (zero std_dev) -> Displacement term required\n\
  \   - Annihilator (all bits deleted) -> final_bits/initial_bits ratio\n   - Transient\
  \ buffer -> Late-window or checkpoint measurement\n   - Explosive bloom -> max_bit_count\
  \ penalty\n   - C2 symmetry bug -> Asymmetric seed (L-tromino)\n"
