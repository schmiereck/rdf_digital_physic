experimenter_view: 'The windowed velocity computation in DisplacementConsistencyFitness
  divides the simulation history into

  equal temporal windows. Within each window, velocity is computed as the displacement
  between the

  first and last center-of-mass (COM) positions found within that window, divided
  by the actual time span

  (step difference) between those two entries. This means velocity normalization uses
  the actual elapsed

  steps within the window, not the nominal window size. If all entries in a window
  occur at the same

  step, velocity is zero. No data points in a window also yields zero velocity. The
  per-window velocity

  vectors (dx, dy) and magnitudes are collected for later aggregation (mean vector
  and mean magnitude).

  This approach captures directional drift and speed consistency across the simulation
  trajectory.

  '
log_excerpt: 'Lines 280-350 of src/new_fitness.py show the windowed velocity computation:

  - Steps are divided into self.num_windows equal segments (line 286)

  - For each window, first and last history entries within bounds are found (lines
  298-322)

  - Displacement dx, dy is computed from center-of-mass positions (lines 332-333)

  - Velocity magnitude is normalized by window_steps (last_entry.step - first_entry.step),
  not by steps_per_window (lines 336-343)

  - If window_steps == 0, velocity is set to zero (lines 341-343)

  - Results stored in window_velocity_mags and window_velocity_vectors lists (lines
  345-346)

