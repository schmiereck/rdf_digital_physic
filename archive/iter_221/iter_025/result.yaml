experimenter_view: 'The goal was to replace the incorrect COM unwrapping logic in
  src/new_fitness.py.

  The bug: in the unwrapping loop, prev_com was set to unwrapped_coms[-1] (the accumulated
  unwrapped position)

  while cur_com was sorted_history[i]["com"] (the raw position). This mixed wrapped
  and unwrapped coordinates,

  producing incorrect delta calculations.


  The correct approach: prev_com should be sorted_history[i-1]["com"] (the raw previous
  COM), then compute

  dx/dy as the raw delta between consecutive raw COMs, unwrap those deltas, and add
  them to the accumulated

  unwrapped position.


  The file modification commands failed silently, likely due to Windows console encoding
  (cp1252) issues

  preventing proper string matching/replacement.

  '
