experimenter_view: 'History generation was investigated across the codebase. Key finding:

  COM and bit_count are recorded at EVERY simulation step (not at

  checkpoints every 50/100 steps). With 500-step simulations and 100

  population members, this produces ~50,100 COM recordings per generation.

  The DisplacementConsistencyFitness function then iterates all entries to

  unwrap toroidal COM jumps and compute per-window velocity vectors.

  This is computationally expensive but provides fine-grained data for

  velocity consistency analysis across 5 windows.

  '
