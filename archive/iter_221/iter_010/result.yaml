experimenter_view: 'The champion rule from iter_221 has been characterized. The rule
  has 12 active

  entries out of 128 possible (sparse rule). The seed is a 3-bit L-tromino.

  The script performs unwrapped CoM tracking on the toroidal 128x128 grid to

  compute true displacement without wrap-around artifacts. Key metrics to be

  computed upon execution include net displacement (Euclidean distance between

  initial and final unwrapped CoM), average speed (displacement/500 steps),

  bit conservation statistics (min/max/final bit counts across 500 steps), and

  step-by-step velocity profiles. The unwrapping algorithm uses best-alignment

  between consecutive step active cells to maintain continuous unwrapped

  coordinates.

  '
log_excerpt: 'The script was written to archive/iter_221/results/characterize_champion_221.py.

  It loads the champion rule from champion_vc_rule.json, initializes a 128x128

  toroidal grid with the L-tromino seed at [(63,63), (64,63), (64,64)], simulates

  500 steps using the evolution.py step_grid with the compiled LUT, unwraps the

  center-of-mass trajectory to compute true net displacement, and records per-step

  bit counts and unwrapped CoM coordinates. Output is printed to stdout and also

  written to archive/iter_221/results/trajectory_analysis.txt.

  Initial run failed with ModuleNotFoundError due to incorrect sys.path resolution.

  The script was rewritten with corrected PROJECT_ROOT path

  (Path(__file__).resolve().parent.parent.parent.parent / "src").

  '
