experimenter_view: 'The spatially-unwrapped CoM version of run_evolution_exp_221.py
  was created and

  executed successfully. The key change replaces the raw toroidal CoM in com_and_bits

  with a step-wise unwrapped position tracker that adjusts for grid boundary crossings

  using the _unwrap_com() helper. This ensures the DisplacementConsistencyFitness

  function receives continuous position data, correctly filtering v=1c gliders via

  max_velocity_threshold=0.9. The search warmed-started from iter_215 and converged

  on a champion with fitness 0.019679 from 12 non-default LUT entries. Mean fitness

  improved from 0.0004 to 0.0171 across 30 generations — a significant improvement.

  The champion rule was not a new v<c glider discovery but represents the best

  consistent-motion rule found under the stricter unwrapped CoM evaluation.

  '
