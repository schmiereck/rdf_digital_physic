experimenter_view: 'Successfully extracted the swap_mutate and generate_population
  functions from

  run_evolution_exp_220_fixed.py. The swap_mutate function performs element-wise

  swaps on a chromosome using a random number generator, while generate_population

  creates an initial population of random C2 rule chromosomes. Both functions are

  core components of the evolutionary search algorithm for discovering cellular

  automaton rules that produce stable gliders.

  '
log_excerpt: "--- swap_mutate ---\n============================================================\n\
  def swap_mutate(chrom: np.ndarray, num_swaps: int, rng: random.Random) -> np.ndarray:\n\
  \    out = chrom.copy()\n    n   = len(out)\n    for _ in range(num_swaps):\n  \
  \      i, j     = rng.sample(range(n), 2)\n        out[i], out[j] = out[j], out[i]\n\
  \    return out\n============================================================\n\n\
  --- generate_population ---\n============================================================\n\
  def generate_population(size: int, rng: random.Random) -> list[np.ndarray]:\n  \
  \  pop: list[np.ndarray] = []\n    while len(pop) < size:\n        rule = generate_random_c2_rule(rng)\n\
  \        pop.append(rule_dict_to_chromosome(rule))\n    return pop[:size]\n============================================================\n"
