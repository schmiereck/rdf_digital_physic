experimenter_view: "The simulate_with_history function applies spatial unwrapping\
  \ at every step:\n1. At step 0, the raw (toroidal) CoM is computed and stored as\
  \ the initial anchor.\n2. For each subsequent step, _raw_com_and_bits() computes\
  \ the raw toroidal CoM.\n3. _unwrap_com() compares the current raw CoM against the\
  \ previous raw CoM.\n   If the displacement exceeds half the grid size (64 pixels),\
  \ a toroidal\n   boundary crossing is detected and the coordinate is shifted by\
  \ ±128.\n4. The unwrapped CoM is stored in history[\"com\"] — this is the absolute,\n\
  \   non-wrapping coordinate that grows continuously across boundary crossings.\n\
  5. The prev_unwrapped variable tracks the previous RAW (not unwrapped) CoM,\n  \
  \ serving as the anchor for the next step's unwrapping calculation.\nThe key finding\
  \ is that the unwrapped CoM allows DisplacementConsistencyFitness\nto correctly\
  \ measure sustained directional motion without artificial jumps at\ntoroidal boundaries,\
  \ enabling proper filtering of v=1c gliders.\n"
