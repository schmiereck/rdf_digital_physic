experimenter_view: 'The perfect unwrapped evolution run completed 30 generations with
  warm-start

  from iter_215''s final_population.json (100 chromosomes loaded). The key

  implementation difference from prior runs is the continuous per-step CoM

  unwrapping in simulate_with_history — at each simulation step the raw

  toroidal CoM is unwrapped relative to the previous raw CoM before being

  stored in the history. This ensures DisplacementConsistencyFitness receives

  correctly unwrapped coordinates even when gliders cross grid boundaries

  many times over 500 steps.


  The population started with all-zero fitness (Gen 0–22), suggesting the

  iter_215 population lacked rules capable of producing v<c gliders under the

  strict constraints (max_bit_threshold=12, max_velocity_threshold=0.9,

  min_velocity=0.05). The first viable candidate emerged at Gen 23 with

  fitness 0.000615, after which the mean fitness gradually increased to

  ~0.000535 by Gen 30. The low absolute fitness values suggest no high-quality

  sub-light gliders were discovered in this run — the search space under these

  constraints appears very sparse. The min_velocity=0.05 threshold combined

  with max_velocity_threshold=0.9 creates a narrow velocity band that many

  evolved rules fail to satisfy.

  '
