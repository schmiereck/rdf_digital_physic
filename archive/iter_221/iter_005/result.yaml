  if the loaded population size differs from --population_size.

  2. Fitness Functions: Supports any class exported from src/fitness.py or src/fitness_v_lessthan_c.py,
  resolved dynamically by the --fitness_class argument. The default is StagedCollisionFitness,
  which enforces bit conservation across initial/midpoint/final snapshots with discrete
  0/1/2 scores. The framework uses constructor introspection to adapt to fitness classes
  that accept varying signatures (with/without horizon/midpoint args).

  3. Evolutionary Loop: Uses elitist selection (top k), swap-based mutation, and persists
  champions and logs in JSON/CSV formats.

