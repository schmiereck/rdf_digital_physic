experimenter_view: 'Velocity is calculated by tracking the Centre of Mass (COM) displacement
  over time windows.

  Specifically, velocity_mag = sqrt(dx^2 + dy^2) / window_steps, where dx and dy are
  the

  differences in COM coordinates between the first and last sample in the window.


  The v=1c glider was not rejected because the ''max_velocity_threshold'' check filters
  based

  on COM velocity (approx 0.9c threshold), not pattern propagation velocity. A glider
  moving

  at light speed (1 cell/step) will have a much slower COM velocity because the COM
  is the

  average position of all live cells; as the pattern translates, the COM only shifts
  fractionally.

  Therefore, the COM velocity of a v=1c glider typically falls below the 0.9c threshold,

  allowing it to pass this specific consistency check.

  '
log_excerpt: 'Line 324: if self.max_velocity_threshold is not None and mean_velocity_magnitude
  >= self.max_velocity_threshold:

  Line 325:     return 0.0

  Configuration (run scripts): max_velocity_threshold=0.9

  '
