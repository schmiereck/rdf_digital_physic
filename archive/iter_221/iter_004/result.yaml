experimenter_view: "The run_evolution_exp_220_fixed.py script implements a generational\
  \ GA with:\n\n1. CHROMOSOME: 128-element numpy uint8 array where each element is\
  \ the \"actual_center\" \n   bit (bit 6) of the LUT value. Index s maps to neighbourhood\
  \ state s.\n\n2. GA LOOP: \n   - Gen 0: evaluate random population\n   - For each\
  \ gen: select top ELITE_SIZE elites → fill rest by swap-mutating elites\n   - Evaluate\
  \ new population → update champion\n   - swap_mutate: random bit swaps (num_swaps\
  \ = round(0.01 * 128) = 1 swap/child)\n\n3. FITNESS (DisplacementConsistencyFitness):\n\
  \   - Simulates L-tromino seed for 500 steps\n   - Divides into 5 windows, computes\
  \ per-window velocity vectors\n   - base_fitness = mean_velocity_mag / (1 + std_dev_velocity_mags)\n\
  \   - Final = base_fitness * leaky_bit_conservation_score\n   - max_bit_threshold=12,\
  \ max_velocity_threshold=0.9\n\n4. WARM START APPROACH:\n   The iter_215 final_population.json\
  \ can directly warm-start iter_220 by:\n   - Loading the 100 chromosomes from iter_215/final_population.json\n\
  \   - Converting each chromosome list to np.array([...], dtype=np.uint8)\n   - The\
  \ chromosome format (128 bits) is identical between both experiments\n   - Replace\
  \ generate_population() with a load_from_json() function\n   - Evaluate the loaded\
  \ population first to establish Gen 0 fitness scores\n   - Optionally subsample\
  \ top-k from iter_215 if desired\n   - The only difference is GENERATIONS=20 for\
  \ iter_220 vs whatever iter_215 used\n"
