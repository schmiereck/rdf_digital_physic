experimenter_view: 'The late-displacement metric correctly reveals that all Gen-3
  elite rules have

  settled into static or near-static attractors by step 100 — zero late displacement

  for 99/100 offspring. The single exception (rule_073) achieves displacement via
  a

  catastrophic bit-count explosion (6331 vs. target 325), yielding fitness 0.00020401.

  This confirms iter_125''s hypothesis: the Gen-3 plateau fitness was driven by early

  transient motion, not sustained locomotion. The Gen-3 gene pool is not a viable

  foundation for breeding sustained-motion rules; a different elite selection strategy

  or a fresh random search targeting late-displacement directly is needed for Gen-5.

  '
