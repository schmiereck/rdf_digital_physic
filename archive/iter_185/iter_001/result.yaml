experimenter_view: 'Two identical East-bound L-tromino gliders placed side-by-side
  with a 2-cell

  North/South (column) offset near grid center immediately fused upon contact at

  step 1. Rather than passing through each other or scattering into independent

  gliders, the interaction triggered a runaway bit-growth cascade: bits grew

  linearly (~2.6 bits/step) for ~100 steps, then abruptly saturated at 321 cells

  forming a large period-2 oscillator. The center-of-mass moved only ~0.9 cells

  East in 500 steps (effectively stationary). The N/S CoM displacement of ~128

  (wrapping) indicates the pattern spread to fill a broad column band. This result

  shows g10_rule_001 is highly sensitive to multi-glider proximity: the rule that

  cleanly sustains isolated gliders produces catastrophic growth when two gliders

  interact edge-to-edge. The final state is NOT two independent gliders — it is a

  fused macroscopic oscillator. Annihilation and pass-through were both absent.

  '
