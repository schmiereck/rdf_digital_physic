experimenter_view: "The 192-bit ash from iter_181 is NOT inert. Introducing a 3-bit\
  \ L-tromino\nglider adjacent to the ash stripe (at col 61, 2 columns from the ash\
  \ at col 63)\nimmediately triggered a cascade growth reaction starting at step 1.\n\
  \nThe ash structure is a full-torus stripe: it occupies ALL 128 rows of the grid\n\
  but only columns 63-64 (a thin 2-column stripe with ~75% cell density).\nNo clean\
  \ gap existed inside the stripe for direct glider insertion, so the\nglider was\
  \ placed at col 61-62 (adjacent), where its SE neighborhood overlapped\nwith ash\
  \ cells at col 63 from the first step.\n\nThe interaction was catalytic and inelastic:\
  \ the 3-bit glider caused the ash to\ngrow by +130 bits (192 -> 322), reaching a\
  \ new stable fixed point by step ~150.\nThe new 322-bit structure was perfectly\
  \ stable from step 150 through step 574\n(the final observation point, 500+ steps\
  \ post-collision).\n\nKey conclusions:\n1. The 192-bit ash is NOT inert — a single\
  \ 3-bit glider perturbs it strongly.\n2. The perturbation is catalytic: the glider\
  \ triggers growth to a larger stable\n   structure (322 bits) without destroying\
  \ the ash — a second-order fixed point.\n3. No gliders or moving structures were\
  \ created: the final state is another\n   static ash, 68% larger than the original.\n\
  4. The ash acts as a reactive medium: small perturbations cause it to jump to a\n\
  \   higher-energy (higher bit count) stable attractor.\n5. The system's stable attractors\
  \ have at least two sizes: 192-bit and 322-bit,\n   both reachable from the same\
  \ initial 6-bit glider pair + optional perturbation.\n"
