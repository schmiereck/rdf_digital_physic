experimenter_view: 'The LateWindowDisplacementFitness search ran cleanly for 10 generations
  with

  100 individuals (8 parallel workers, ~64 s total). Every individual across

  all generations scored exactly 0.0 — no C2-symmetric rule applied to the

  3-bit L-tromino produced any measurable centre-of-mass displacement between

  steps 500 and 1000.


  The bit-conservation gate passed for the champion (initial_bits=3,

  final_bits=3, bb_area=4), meaning the seed survives but simply stalls into

  a still-life or period-1 oscillator.


  Interpretation: the late-window filter is working correctly as a stricter

  criterion, but the search space covered by C2-symmetric random rules (random

  2–4 pair mappings) is too sparse to stumble upon sustained glider motion in

  only 10 generations. The fitness landscape appears flat at 0 for this

  parameter configuration. Possible next steps: (a) increase generations /

  population significantly, (b) seed the initial population with rules known

  to produce early-window motion, or (c) relax the bit-conservation gate

  to allow ±1 variation to widen the explored neighbourhood.

  '
