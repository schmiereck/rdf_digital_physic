rationale: 'The previous experiment showed that a strict inequality on distance is
  not enough to guarantee movement. An absolute margin will force the gliders to move
  a meaningful distance, filtering out the near-static solutions that exploit floating-point
  noise. This is the most direct way to fix the observed failure mode.

  '
state_update: 'Phase: Focused Exploration


  **Goal:** Find a cellular automaton rule that produces a dynamic, conserving collision
  between two 3-bit gliders.


  **Confirmed:**

  - The `CollisionFitness` from `iter_187` is flawed; it can be satisfied by static
  "still-life" patterns (iter_188.1).

  - The `DynamicCollisionFitness` function (using strict inequality for distance checks)
  correctly rejects the static still-life rule from `iter_187` (iter_188.2).


  **Refuted:**

  - The hypothesis that `DynamicCollisionFitness` with strict inequality is sufficient
  to find dynamic collisions is refuted. It can be exploited by near-static rules
  that cause glider centers-of-mass to change by amounts on the order of floating-point
  precision noise (iter_188.2).


  **Current Best Result:**

  - `archive/iter_188/results/dynamic_champion_rule.json`. While technically having
  a fitness of 1.0 under the `DynamicCollisionFitness` metric, it is known to be a
  flawed, near-static solution, not a true collision.


  **Open Questions:**

  - Can a fitness function with an absolute distance margin (e.g., `distance < initial_distance
  - 1.0`) prevent the "floating-point noise" exploit?

  - What is the minimum margin required to enforce genuine movement?

  - Should a cell-displacement metric be added to the fitness function to explicitly
  reward movement?

  '
