experimenter_view: 'Gen-3 evolution using composite metric total_displacement / (1
  + std_dev).

  Gen-2 rule dicts were reconstructed deterministically by replaying the iter_152

  breeding (seed=152) from iter_150 Gen-1 elites (seed=150). Top 10 Gen-2 elites

  selected; top-2 (rule_025, rule_073) carried unchanged into Gen-3. The remaining

  98 rules bred via crossover + mutation of C2-symmetric kernel pairs (breed seed=153).

  Evaluated on 150x150 soup (25% density, seed=42), 4 windows x 400 steps = 1600

  total steps.


  Gen-3 mean=0.767 vs Gen-2 mean=0.609 (+25.84%) — below the 30% target but a

  substantial gain. The standout result is rule_021 (composite=3.465,

  total_disp=6.253, std=0.805), which is 2.6x the Gen-2 maximum (1.320) and 5.7x

  the Gen-2 mean, suggesting a breakthrough mover emerged from the breeding pool.

  Two other strong offspring: rule_093 (1.311) and rule_065 (1.297), both bred

  from the elite pool. The population distribution shifted markedly upward, with

  median fitness rising from 0.584 to 0.728 (+24.7%).

  '
