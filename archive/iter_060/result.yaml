experimenter_view: 'The exhaustive search found no 4-bit glider under the second W=3
  rule (A=11, B=14).

  Phase 1 tested all 10 one-sided tetrahex (contiguous) seeds; Phase 2 extended to
  all

  3,237 unique 4-cell configurations within hex-radius 3, including non-contiguous
  seeds.

  The dominant outcome is still lifes (3,144), with 88 period-2 oscillators (zero-

  displacement) and 5 unstable patterns. No pattern with non-zero displacement was
  found.

  Key insight: cells separated by distance > 1 cannot directly interact in this rule

  (it only reads the 6 immediate neighbors), so 4-bit seeds split across distance
  > 1

  evolve as independent sub-groups — a fundamental barrier to composite-style gliders
  at

  this bit count. The hypothesis is not supported: the second W=3 rule (A=11, B=14)
  does

  not appear to support stable, bit-conserving 4-bit gliders.

  '
