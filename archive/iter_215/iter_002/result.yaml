experimenter_view: 'The warm-start strategy was decisive. Where the iter_214.3 random-init
  search

  produced an entirely flat fitness landscape (best=0.0 across all 100×11=1100

  evaluations), this run found a non-trivial v<c glider already in generation 0

  — embedded in the warm-start population as rule_053, a 0.05-rate per-bit

  mutant of the iter_177 "transient bloomer" champion. The champion is a clean

  bit-conserving translator: COM moves from (76.33, 64.67) at step 500 to

  (88.33, 64.67) at step 1000 — exactly 12 cells of pure row-axis displacement

  over a 500-step late window, with bb_area=4 holding throughout. That gives a

  speed of ~0.024 cells/step, sub-c by any reasonable definition for this

  hex CA, and persistence well past the transient-drift window that iter_213

  was exploiting. By gen 2 the swap-mutation operator had propagated this

  variant to 87/100 of the population, and the elite plateau at fitness=2.4

  held cleanly for the remaining 18 generations — no further improvement

  emerged, suggesting this is a local optimum that the 1-swap-per-child

  operator cannot escape, but the warm-start sufficed to clear the v<c bar.

  This confirms the iter_214 post-mortem: the LateWindow filter is not the

  problem — the random-init search space is too sparse for blind discovery,

  and seeding with rules from prior transient-motion champions bridges the

  gap. Minor: three small surgical edits were made to src/run_evolution.py to

  support (a) dict-wrapped warm-start JSONs, (b) fitness-class lookup in

  fitness_v_lessthan_c.py, and (c) fitness constructors that take neither

  horizon nor midpoint.

  '
