experimenter_view: 'The second valid W=3 kernel is (A=11, B=14) in LSB encoding.

  A=11 (''0001011'') encodes {center, E, SW} — a non-contiguous-arc pattern where
  two

  neighbors span the center. B=14 (''0001110'') encodes {E, SE, SW} — the same B-orbit

  as the first kernel (A=7, B=14). The two kernels share the B-orbit but differ in
  A.

  The rule is a bit-conserving involution with 12 non-identity state mappings.

  The very first 3-bit seed tested — a straight NE-line [(0,0),(0,1),(0,2)] — is

  immediately a STILL_LIFE (period=1, no displacement). This confirms the hypothesis:

  the second W=3 kernel supports a stable, bit-conserving, non-trivial 3-bit still
  life.

  '
