experimenter_view: 'The sweep claims a "best" configuration at alpha=2.5, gamma=0.05,

  kappa=0.08, eta=2.0 with mutual deflection of +0.5 cells over 80 steps

  (5/1080 configs, all only differing in the inert threshold axis).

  However, the 120-step long run with those very parameters returns

  mutual_attraction=0.0 — the +0.5 deflection is a single quarter-cell

  lattice fluctuation, not a persistent attractive force. None of the

  1080 stable configurations produced a sustained mutual attraction.

  The optimum sits on the parameter-grid boundary for gamma (low),

  kappa (high), and eta (high), and is a sharp interior peak for alpha,

  so a re-sweep extending those axes and increasing integration time is

  warranted. Reducing the initial inter-glider separation (currently 6

  cells) would also lift the signal above the quarter-cell discretisation

  noise floor.

  '
log_excerpt: "Q4. SHOULD WE SWEEP MORE PARAMETERS?\n  - alpha: optimum is a SHARP\
  \ interior peak at 2.5; refine the grid between 2.0 and 3.0.\n  - threshold: completely\
  \ flat at the optimum -> no information; widening this axis would be wasteful.\n\
  \  - gamma: optimum sits on the LOW boundary (0.05); extend the sweep DOWN below\
  \ 0.05.\n  - kappa: optimum sits on the HIGH boundary (0.08); extend the sweep UP\
  \ above 0.08.\n  - eta: optimum sits on the HIGH boundary (2.0); extend the sweep\
  \ UP above 2.0.\n  - The 80-step 'attraction' (mutual=+0.5) collapses to 0 at 120\
  \ steps -> sweep LONGER integration times.\nSaved text report to archive/iter_233/results/two_body_sweep_analysis.txt\n"
