experimenter_view: 'The 78-bit remnant of rule_011 (captured at step 200 on a 200×200
  grid)

  consists of 37 connected objects of 8 distinct types. The vast majority (33

  of 37) are still-lifes (period 1), dominated by 29 isolated single-cell

  survivors. The remaining 4 objects are oscillators: two copies of a p3

  6-cell type and single instances of a p4 4-cell and a p4 11-cell type.

  No objects decayed when simulated in isolation. The hypothesis is confirmed:

  the remnant is composed of a small, discrete catalog of reusable oscillator

  types. The phases for p3_6bit and p4_4bit exhibit transient cell-count

  variation between phases (e.g. the p3_6bit expands from 6 to 8 cells in one

  phase before contracting), consistent with a rule that allows oscillators

  where live-cell count is not invariant across phases.

  '
