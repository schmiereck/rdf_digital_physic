analysis: 'The goal was to develop a new fitness metric, `CheckpointFitness`, that
  is not susceptible to the ''transient bloomer'' exploit seen in previous iterations.
  The prior metric failed because it only considered final displacement and a weak
  bit-count penalty, allowing unstable, expanding patterns to achieve high scores.
  The new metric enforces a hard constraint: the particle''s bit count must match
  its initial count at several checkpoints throughout the simulation, otherwise fitness
  is immediately set to 0.0.


  The sub-agent successfully implemented `CheckpointFitness` in `src/fitness.py` and
  created a validation script, `src/validate_fitness.py`. This script tested the new
  metric against the known pathological rule from `iter_176.3`.

  '
chosen_direction: Validate the new `CheckpointFitness` metric against the known pathological
  rule.
experimenter_view: 'Created three new supporting modules: rule.py (Rule wrapper),
  simulator.py

  (Particle + Simulator classes), and validate_fitness.py. Added CheckpointFitness

  to the existing fitness.py.


  The CheckpointFitness metric evaluates a rule by running the simulation and

  checking bit-count stability at each specified checkpoint. If the count ever

  differs from the initial seed count, it returns 0.0 immediately.


  For the pathological iter_176 gen-5 rule_019 ("transient bloomer"), the

  particle blooms from 3 bits to 17 bits by step 50 and keeps growing. The

  metric correctly detects this at the first checkpoint (step 50) and returns

  0.0, despite the old fitness metric having awarded it a score of 0.08879282

  based on displacement and a partial bit-count ratio.


  The new metric behaved exactly as expected: it successfully assigns 0.0 to

  the unstable rule and would only reward rules where the particle maintains

  a constant bit count at all four checkpoints (50, 100, 150, 200).

  '
hypothesis: The `CheckpointFitness` metric will assign a fitness score of 0.0 to the
  'transient bloomer' rule from iter_176.3 by detecting its bit-count instability
  at the first checkpoint.
