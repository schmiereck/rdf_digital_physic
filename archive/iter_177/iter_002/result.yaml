experimenter_view: 'The ''bloom-and-oscillate'' failure mode is clearly visible in
  the GIF. The

  L-tromino seed (3 cells, shown with red markers) begins expanding around step 21

  and grows to a peak of 88 live cells. Thereafter the population oscillates

  chaotically — contracting back to ~10 cells, then re-expanding — with no

  convergent motion or stable glider-like structure. The bit count never stabilizes:

  it swings between 10 and 88 across the full 500 steps, confirming the analysis

  from iter_177.1. The GIF window tracks the center of mass with a smoothed anchor

  so the spreading structure stays centred throughout. Frames are rendered at

  60 ms each in the seed/early-bloom phase and 40 ms thereafter, making both the

  initial growth event and the sustained chaotic oscillation readable.

  '
