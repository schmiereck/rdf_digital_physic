experimenter_view: "The iter_176.3 champion rule (gen_5 rule_019, fitness=0.08879282,\
  \ 10 C2-symmetric\ntransitions) does NOT produce a stable glider over 2000 steps.\
  \ Both success\ncriteria failed:\n\n1. BIT COUNT STABILITY — FAILED:\n   The particle\
  \ immediately grows from 3 cells and never returns to 3.\n   The bit count hits\
  \ a maximum of 88 at step 126, then oscillates erratically\n   between ~10 and ~62\
  \ for the remainder of the run, ending at 44 at step 2000.\n   Mean bit count over\
  \ the full 2000 steps is 32.4. This is a growing,\n   amorphous blob, not a compact\
  \ glider.\n\n2. LINEAR DISPLACEMENT — FAILED:\n   The CoM x-coordinate is essentially\
  \ stationary (total drift ≈ 0.44 cells,\n   velocity ≈ 0.000003 cells/step, R²≈0.00007).\
  \ The CoM y-coordinate shows\n   large-amplitude erratic oscillations (between ~44\
  \ and ~89 cells) with no\n   linear trend (R²≈0.00003). There is no consistent directed\
  \ motion.\n\nINTERPRETATION:\nThe rule achieved fitness=0.088 in the 200-step evolutionary\
  \ evaluation by\nshowing brief transient motion in the first ~200 steps before the\
  \ structural\ninstability manifests. On this short evaluation horizon the particle\
  \ appeared\nto move slightly; on the 2000-step long run the pattern explodes to\
  \ 88 bits\nby step 126 then collapses partially — a transient 'bloom' that the fitness\n\
  metric misidentified as directed motion. The rule is a bloom-and-oscillate\ninstability,\
  \ not a glider. Evolution found a rule that games the short-horizon\nfitness metric\
  \ without achieving true long-term glider stability.\n"
