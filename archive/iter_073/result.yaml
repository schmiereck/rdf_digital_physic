experimenter_view: 'The C2-symmetric rule (only 4 non-identity mappings: A↔B and rot(A,3)↔rot(B,3)
  in MSB

  encoding, i.e., states 96↔56 and 68↔7) produces a highly stabilizing dynamic. All
  10

  one-sided tetrahex seeds immediately converge to period-1 still lifes within the
  400-step

  simulation window. No seed decayed or grew unboundedly. The rule''s limited action
  — only

  swapping two state pairs and leaving all other neighborhoods unchanged — appears
  to create

  a landscape dominated by fixed points. Notably, several seeds grew in bit count
  (e.g.,

  T-shape: 4→5 bits, S-shape: 4→5 bits, zigzag: 4→6 bits), suggesting the rule can
  recruit

  nearby cells into stable configurations. The absence of gliders likely reflects
  the rule''s

  C2 (not C6) symmetry: with only two orbit pairs instead of six, the rule cannot
  sustain

  the traveling asymmetry a glider requires. Contrast with the full nonconserving
  C6 rule

  (12 non-identity mappings) from iter_069, which did produce a stable 4-bit glider.

  '
