experimenter_view: 'Part 1 succeeded: the second valid kernel is A2=3 (LSB), B2=10
  (LSB), equivalent to

  A2_MSB=96, B2_MSB=40. Both orbit conditions and the center-bit-flip condition are
  satisfied;

  closure size is 12.


  Part 2 failed to meet the success criterion. The 2-bit B2 seed (1s at E and SW of
  center)

  creates neighborhood 40 at the center cell (correct), but simultaneously creates
  neighborhood

  state 5 at the SE cell (which lies between the two placed bits, seeing them as its
  W and NE

  neighbors). The rule maps 5→68, activating the SE cell. At t=1 the pattern is a
  4-cell

  rhombus {(50,49),(50,50),(51,49),(51,50)} — a still-life. No cell in this cluster
  ever sees a

  non-identity neighborhood, so it never evolves. This is a geometric consequence
  of B2''s

  non-adjacent pair (E+SW): any such placement always traps a third cell between the
  two bits.

  The A65/B6 kernel uses adjacent pairs (E+SE), which do not create the same trap.

  '
