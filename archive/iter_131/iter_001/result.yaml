experimenter_view: 'Gen-3 massively outperforms Gen-2, though the comparison requires
  a caveat:

  the fitness formula changed between generations. Gen-2 used

  `displacement / (1 + |Δbits| + |Δobjects|)` which penalized deviation from

  initial population. Gen-3 uses `displacement / (1 + bits/initial_bits)`,

  which rewards rules that reduce their bit count while still moving.


  The standout rule is rule_011 (fitness=1.33): it shrank from 325 to 78 bits

  while displacing its center of mass 1.65 units in steps 100–200 — a rule

  that appears to "evaporate" into a small, mobile remnant.


  57 of 100 Gen-3 rules beat the Gen-2 champion (0.038), suggesting the

  5-elite breeding pool with 4+4 crossover produces highly capable offspring.

  Only 2 rules turned chaotic; 0 went fully dead. The new formula also

  explains why zero-displacement rules score 0 regardless of bit count.


  The high mean fitness (0.245 over viable rules) versus Gen-2''s effectively

  near-zero mean indicates the changed formula is the dominant driver; a

  direct head-to-head re-evaluation with Gen-2''s formula would be needed to

  isolate breeding improvement from metric change.

  '
