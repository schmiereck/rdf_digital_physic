experimenter_view: 'The hypothesis was confirmed: breaking the C2-symmetry of the
  seed particle

  enables measurable motion under C2-symmetric rules. In iter_167, the symmetric

  2x2 block produced zero fitness across the population. Here, with the asymmetric

  L-tromino, multiple rules achieve fitness > 0.1: rule_014 and rule_060 both

  scored 0.2833, and several others (rule_009, rule_033, rule_034, etc.) scored

  ~0.124. The top rule reduces the particle from 3 bits to 2 bits while displacing

  the CoM by ~0.85 cells. Two clusters of behavior are visible: (1) rules that

  produce large displacement (~15-19 cells) but grow the bit count to 192-5369,

  resulting in low fitness; (2) rules that keep or reduce the bit count while

  achieving small but real displacement, achieving higher fitness. The population

  shows ~40% of rules produce zero motion (particle is frozen), but 60% produce

  some nonzero displacement — a striking contrast to iter_167''s near-total failure.

  '
