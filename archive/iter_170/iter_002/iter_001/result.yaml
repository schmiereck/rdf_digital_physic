experimenter_view: 'Gen-1 was produced by 3-way tournament selection + uniform crossover
  (p=0.5/bit)

  + bit-flip mutation (p=0.01/bit) applied to the Gen-0 LUT chromosomes (128-bit

  binary arrays). Fitness = displacement / (1 + final_bit_count), 200 steps.


  The headline max_fitness of 89.8 is an annihilation artifact: two rules caused

  the L-tromino to completely decay (0 bits at step 200). The _center_of_mass helper

  returns (0,0) for an empty grid, so the displacement from the initial CoM at

  (~63.67, ~63.33) to origin is ~89.8, giving fitness ≈ 89.8/1 = 89.8. This is

  technically correct by the formula but represents a degenerate case.


  Excluding annihilation, the best non-trivial result is gen1_rule_062 with

  fitness = 0.687 (displacement = 1.374, 1 bit remaining), exceeding Gen-0''s

  best of 0.283 by ~2.4×. Several rules tied near the Gen-0 champion level

  (fitness ≈ 0.372–0.283) showing fitness is being preserved. The mean fitness

  is inflated by the annihilation outliers; the true central tendency of

  non-degenerate rules is much lower (~0.07).


  Key finding: L-tromino motion fitness IS evolvable — the GA discovered novel

  high-fitness non-annihilation rules not present in Gen-0, confirming the trait

  is evolvable. The annihilation discovery also reveals the fitness landscape has

  a "death attractor" that the GA found within 1 generation.

  '
