analysis: 'The goal was to determine if the L-tromino particle motion discovered in
  170.1 is an evolvable trait. A second generation (Gen-1) of 100 rules was created
  from the Gen-0 founders using tournament selection, uniform crossover, and bit-flip
  mutation. This new population was then evaluated using the same simulation environment.


  The primary hypothesis was that the mean fitness of Gen-1 would be at least 50%
  higher than the Gen-0 mean of 0.034. The resulting mean fitness of Gen-1 was 1.866,
  which formally confirms the hypothesis. However, this high value is misleading.
  As detailed in the experimenter_view, the genetic algorithm discovered a degenerate
  strategy: rules that annihilate the particle. The fitness function, `displacement
  / (1 + final_bit_count)`, heavily rewards this outcome, as the final bit count becomes
  0, resulting in a fitness score based on the displacement from the starting position
  to the grid''s origin (~89.8).


  More importantly, even when these annihilation artifacts are excluded, the underlying
  trait of motion proved to be evolvable. The best non-degenerate rule in Gen-1 achieved
  a fitness of 0.687, a 2.4x improvement over the Gen-0 champion (0.283). The mean
  fitness of the non-degenerate rules was approximately 0.07, which still satisfies
  the original hypothesis (> 0.051). This confirms that the genetic algorithm is successfully
  selecting for and improving upon the desired trait.

  '
chosen_direction: Execute the plan to create and evaluate a Gen-1 population to test
  for evolvability.
experimenter_view: 'Gen-1 was produced by 3-way tournament selection + uniform crossover
  (p=0.5/bit)

  + bit-flip mutation (p=0.01/bit) applied to the Gen-0 LUT chromosomes (128-bit

  binary arrays). Fitness = displacement / (1 + final_bit_count), 200 steps.


  The headline max_fitness of 89.8 is an annihilation artifact: two rules caused

  the L-tromino to completely decay (0 bits at step 200). The _center_of_mass helper

  returns (0,0) for an empty grid, so the displacement from the initial CoM at

  (~63.67, ~63.33) to origin is ~89.8, giving fitness ≈ 89.8/1 = 89.8. This is

  technically correct by the formula but represents a degenerate case.


  Excluding annihilation, the best non-trivial result is gen1_rule_062 with

  fitness = 0.687 (displacement = 1.374, 1 bit remaining), exceeding Gen-0''s

  best of 0.283 by ~2.4×. Several rules tied near the Gen-0 champion level

  (fitness ≈ 0.372–0.283) showing fitness is being preserved. The mean fitness

  is inflated by the annihilation outliers; the true central tendency of

  non-degenerate rules is much lower (~0.07).


  Key finding: L-tromino motion fitness IS evolvable — the GA discovered novel

  high-fitness non-annihilation rules not present in Gen-0, confirming the trait

  is evolvable. The annihilation discovery also reveals the fitness landscape has

  a "death attractor" that the GA found within 1 generation.

  '
hypothesis: 'gen-1: mean fitness will increase by >=50% vs gen-0, indicating an evolvable
  trait'
metrics:
