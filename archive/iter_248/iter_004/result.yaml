experimenter_view: 'The single-bit spectrum reveals that LUT-08 and sym_999 have identical

  period-2 cycle structures (6 pairs), while sym_42 and sym_123 behave as

  identity-like mappings (12 period-1 cycles). Weight-2 coherent structures

  exist only for LUT-08 and sym_999, and they correspond exactly to the

  period-2 cycle pairs. Weight-3 structures are entirely absent. This pattern

  strongly suggests the weight-2 "structures" are kinematic composites of

  independent single-bit particles (verified: lut[a|b] = lut[a]|lut[b] for

  these pairs), not genuinely interacting multi-bit species. Despite the task

  criterion flagging F1 as not triggered, the deeper physics points toward a

  monospecific taxonomy where all dynamics are non-interacting composites.

  '
