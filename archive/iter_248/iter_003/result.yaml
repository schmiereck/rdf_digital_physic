experimenter_view: "All 10 claimed \"novel species\" from iter_248 fail all three\
  \ coherence tests:\ntheir individual bits move identically in isolation (Test 1=PASS),\
  \ bits never\noccupy the same cell (Test 2=0 collisions), and removing any single\
  \ bit leaves\nthe remainder undisturbed (Test 3=FAIL to destabilize).\n\nCRITICALLY,\
  \ the LUT-08 reference particle also fails all three tests under the\nsame implementation.\
  \ Single-bit decomposition shows each of the 4 bits\nindividually achieves the same\
  \ velocity [0.5, 0, 1] as the composite. Over 32\nsimulation steps, the reference\
  \ bits never enter the same cell (multi-bit cell\ncount = 0). Removing any one of\
  \ its bits still leaves a stable 3-bit pattern\nmoving at the same velocity.\n\n\
  This implies either:\n(a) Both the novel species AND the previously accepted LUT-08\
  \ reference are\n    non-interacting composites of independently streaming particles,\
  \ or\n(b) The test criteria are too stringent and misclassify genuine gliders that\n\
  \    interact via single-bit-to-single-bit LUT mappings (e.g. ch5↔ch6 swapping)\n\
  \    rather than multi-bit cell collisions.\nGiven that the reference particle collides\
  \ only by channel permutation in\nsingle-occupancy cells, the collision-interaction\
  \ definition of Test 2 may\nneed refinement to capture non-multi-bit coherence mechanisms.\n"
