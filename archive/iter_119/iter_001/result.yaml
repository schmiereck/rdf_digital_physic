  connected component, a space-filling fixed-point attractor of the chaotic

  rule. The iter_084 rule does not animate sparse objects; it fills empty

  space aggressively until equilibrium. All 72 ash objects were consumed.

  No gliders, oscillators, or still-life objects survived.

  '
