experimenter_view: 'Critical negative finding: The planned inter-orbit swap (EXCHANGE
  variant)

  between weight-2 orbits 6 and 8 is IMPOSSIBLE. These two orbits share the

  same size (24) but have completely disjoint stabilizer sets (intersection=0),

  which violates the equivariant bijection construction requirement that source

  and target representatives must have identical stabilizers. The standard

  generate_symmetric_lut() algorithm places each weight-2 orbit in its own

  singleton signature group, so inter-orbit pairing is never attempted.


  However, a viable alternative exists: INTRA-orbit remapping. Each weight-2

  orbit has multiple valid targets with matching stabilizers (e.g., orbit 6

  has targets [17,34,68,136]; orbit 8 has [20,40,65,130]). Remapping the

  representative to a different valid target within the same orbit preserves

  O_h symmetry, bijectivity, and bit conservation while altering cross-cycle

  collision outcomes. LUT-08 is already 73% non-additive (48/66 weight-2

  states), but its specific intra-orbit mappings happen to preserve

  independent-particle dynamics. Future work should systematically explore

  the 4×2×4×4 = 128 intra-orbit remapping combinations for the four

  weight-2 orbits to find variants that create bound states.

  '
