experimenter_view: 'The LUT-08 weight-1 permutation consists of 6 transposition cycles,
  each mapping a channel to its antipodal partner. Consequently, the set of 6 same-cycle
  pairs coincides exactly with the 6 antipodal pairs. Under the 48-element O_h group,
  the 66 weight-2 states partition into 4 orbits: (1) a size-6 orbit of antipodal/same-cycle
  pairs with dot=-2 (collinear opposite NN vectors); (2) a size-12 orbit of orthogonal
  cross-cycle pairs (dot=0, 90°); (3) two size-24 orbits of cross-cycle pairs with
  dot=+1 (60°) and dot=-1 (120°). For designing non-additive LUT variants, the three
  cross-cycle orbits are the degrees of freedom: they involve channels from different
  weight-1 cycles and thus cannot be generated by single-bit streaming alone. Modifying
  their LUT entries would create true multi-bit coherent interactions that are absent
  in the original LUT-08.

  '
