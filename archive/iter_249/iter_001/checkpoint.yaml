task: "# Phase 249 Sub-Goal A: Construct Non-Additive LUT Variants for 3D FCC LGCA\n\
  \n## Context\nIn iter_248, we discovered that ALL \"gliders\" on the 3D FCC lattice\
  \ are non-interacting composites of single-bit particles. The root cause is that\
  \ the O_h-symmetric LUT (e.g. LUT-08) is **additive at weight-2**: when two bits\
  \ occupy the same cell, the LUT output is the independent superposition of the two\
  \ weight-1 transpositions. Bits from different velocity cycles never interact. We\
  \ need to construct LUTs where weight-2 entries are deliberately **non-additive**\
  \ — redirecting output bits across velocity cycles — to test whether genuine multi-bit\
  \ coherent gliders can emerge.\n\n## CRITICAL: Pre-Registration Update\nBefore any\
  \ code runs, update `src/pre_registration.md` to fix the falsification logic from\
  \ AND-gate to OR-gate as mandated by the Research Manager:\n\n**Current (WRONG):**\
  \ \"The hypothesis is refuted if ALL of the following hold simultaneously: F1, F2,\
  \ F3\"\n\n**Required (CORRECT):** \"The hypothesis is refuted if ANY of the following\
  \ hold: F1 OR F2 OR F3 OR F4\"\n- F1: Across all non-additive LUT variants tested\
  \ (≥3 distinct interaction types) and all O_h-distinct two-bit collision geometries\
  \ (≥6 initial configurations per variant), no two-bit bound state survives ≥200\
  \ steps post-collision.\n- F2: Any two-bit candidate that survives 200 steps passes\
  \ the single-bit decomposition test (i.e., running each bit independently reproduces\
  \ the multi-bit trajectory), proving it is still a non-interacting composite.\n\
  - F3: Any bound state exists only along one lattice axis and disappears when initial\
  \ conditions are rotated through O_h symmetry elements.\n- F4: The constructed non-additive\
  \ LUTs violate reversibility (not a bijection) or bit conservation.\n\nAlso update\
  \ the confirmation criterion: If ANY genuine multi-bit glider is found that: (a)\
  \ survives ≥200 steps, (b) fails the decomposition test, (c) is destabilized by\
  \ single-bit removal, and (d) transforms covariantly under O_h rotations, then the\
  \ hypothesis is confirmed.\n\n## Main Task: Construct Non-Additive LUT Variants\n\
  \n### Step 1: Analyze the weight-1 structure of LUT-08\nRead `src/experiment_248_fundamental_spectrum.py`\
  \ and `archive/iter_248/results/fundamental_spectrum.json` to understand the LUT-08\
  \ weight-1 cycles. The 6 period-2 transposition pairs are:\n- ch0↔ch3, ch1↔ch2,\
  \ ch4↔ch7, ch5↔ch6, ch8↔ch11, ch9↔ch10\n\n### Step 2: Enumerate weight-2 channel\
  \ pairs and group into O_h orbits\nThere are C(12,2)=66 possible weight-2 pairs\
  \ {(ch_i, ch_j)}. Group them by their geometric relationship on the FCC cuboctahedron:\n\
  - **Same-cycle pairs** (within a transposition): e.g., (0,3), (1,2), (5,6), etc.\
  \ — these are \"adjacent\" in the transposition cycle.\n- **Cross-cycle pairs**\
  \ (from different transposition cycles): e.g., (0,5), (3,6), etc.\n- **Antipodal\
  \ pairs** (opposite on the cuboctahedron)\n\nGroup all 66 pairs into O_h orbits.\
  \ Use the O_h permutation machinery from `src/search_3d_gliders.py`.\n\n### Step\
  \ 3: Determine the additive (default) LUT-08 output for each weight-2 input\nFor\
  \ each weight-2 input state s = (1<<ch_i) | (1<<ch_j), the additive LUT-08 output\
  \ is:\n  lut[s] = lut[(1<<ch_i)] | lut[(1<<ch_j)]\nThis is the independent superposition\
  \ of the two weight-1 transpositions.\n\n### Step 4: Design three non-additive interaction\
  \ types\n\n**LUT-INT-EXCHANGE:** For cross-cycle weight-2 pairs, swap one output\
  \ bit with a bit from another transposition pair. Example: if input has bits in\
  \ ch0 and ch5, the additive output would place bits in ch3 and ch6 (since 0→3, 5→6).\
  \ Instead, redirect ch0's output to ch1 (belongs to cycle {1,2}) and ch5's output\
  \ stays at ch6. This creates cross-cycle leakage.\n\n**LUT-INT-BINDING:** For cross-cycle\
  \ weight-2 pairs, redirect both output bits into the SAME velocity cycle. Example:\
  \ if input has ch0 and ch5, redirect outputs so both bits go into the {0,3} cycle\
  \ (both go to ch0 or ch3). This creates co-propagation tendency.\n\n**LUT-INT-SCATTERING:**\
  \ For cross-cycle weight-2 pairs, redirect both output bits into the stationary\
  \ cycle {8,11}. This creates energy-like dissipation at collision sites, potentially\
  \ trapping bits.\n\n### Step 5: Close modifications under full O_h group\nFor each\
  \ non-additive modification, apply all 48 O_h permutations to propagate it equivariantly\
  \ across all weight-2 states in the same orbit. Use the machinery from `src/search_3d_gliders.py`\
  \ (precompute_perm_action, compute_orbits, etc.).\n\n### Step 6: Verify each variant\n\
  For each non-additive LUT variant, programmatically verify:\n1. **Bijection:** len(np.unique(lut))\
  \ == 4096\n2. **Bit conservation:** hamming(s) == hamming(lut[s]) for all s\n3.\
  \ **O_h symmetry:** lut[sigma_g(s)] == sigma_g(lut[s]) for all g in O_h\n4. If any\
  \ variant fails verification, document the failure and iterate.\n\n### Step 7: Save\
  \ verified LUTs\nSave each verified LUT variant to `src/nonadditive_lut_*.npy` files.\
  \ Also save a JSON metadata file describing exactly which weight-2 pairs were modified\
  \ and what the original vs modified outputs were.\n\n### Step 8: Build coherence\
  \ testing module\nCreate `src/coherence_testing.py` that implements the three-test\
  \ protocol from iter_248:\n- Test A (decomposition): Run each bit independently;\
  \ check if combined trajectory matches multi-bit trajectory.\n- Test B (bit-removal):\
  \ Remove one bit from initial conditions; check if remaining pattern is destabilized.\n\
  - Test C (collision interaction): Collide candidate with a test particle; check\
  \ for non-trivial outcome.\n\n## Key Files to Read\n- `src/engine_3d.py` — 3D FCC\
  \ LGCA engine (stream, collide, pack/unpack)\n- `src/search_3d_gliders.py` — generate_symmetric_lut(),\
  \ O_h permutations, orbit decomposition, verify_lut()\n- `src/experiment_248_fundamental_spectrum.py`\
  \ — weight-1 cycle analysis, sparse simulation\n- `src/experiment_248_verification.py`\
  \ — three-test coherence protocol from iter_248\n- `archive/iter_248/results/fundamental_spectrum.json`\
  \ — fundamental spectrum data\n\n## Key Files to Write\n- `src/pre_registration.md`\
  \ — update with OR-gate falsification logic\n- `src/lut_construction_nonadditive.py`\
  \ — non-additive LUT construction code\n- `src/coherence_testing.py` — three-test\
  \ coherence protocol module\n- `src/nonadditive_lut_exchange.npy` — LUT-INT-EXCHANGE\
  \ variant\n- `src/nonadditive_lut_binding.npy` — LUT-INT-BINDING variant\n- `src/nonadditive_lut_scattering.npy`\
  \ — LUT-INT-SCATTERING variant\n- `src/nonadditive_lut_metadata.json` — metadata\
  \ describing modifications\n\n## Success Criteria\n1. Pre-registration updated with\
  \ OR-gate falsification logic\n2. At least 3 non-additive LUT variants constructed,\
  \ all passing bijection + bit conservation + O_h symmetry verification\n3. Metadata\
  \ documenting exactly what was modified and why, declared BEFORE running dynamics\n\
  4. Coherence testing module ready for use in collision experiments\n\n## IMPORTANT\
  \ NOTES\n- Do NOT run any collision/dynamics experiments yet. Only construct and\
  \ verify the LUTs.\n- The non-additive modifications must be closed under O_h symmetry.\
  \ If you modify one weight-2 pair, you must propagate the modification to all pairs\
  \ in the same orbit.\n- If a particular modification type (e.g., binding) cannot\
  \ be made consistent with O_h symmetry and bit conservation, document this as a\
  \ negative finding — do not force it.\n- All modifications must be documented BEFORE\
  \ any dynamics are run, per the pre-registration protocol.\n"
