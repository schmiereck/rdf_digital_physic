experimenter_view: 'The analysis of LUT-08 weight-2 orbits reveals 4 distinct orbits
  under O_h symmetry:


  - O_0 (ch0,ch1, dot=0): cross-cycle, ADDITIVE, D2 stabilizer. Bits scatter independently
  — no two-body interaction.

  - O_1 (ch1,ch2, dot=-2): same-cycle, ADDITIVE, D4 stabilizer. Period-2 transposition
  (1,2) — these bits never collide.

  - O_2 (ch0,ch4, dot=+1): cross-cycle, NON-ADDITIVE (interacting), Z2 stabilizer.
  Genuine two-body interaction.

  - O_3 (ch2,ch4, dot=-1): cross-cycle, NON-ADDITIVE (interacting), Z2 stabilizer.
  Genuine two-body interaction.


  Key finding: Only cross-cycle weight-2 states can produce genuine two-body interactions.
  Same-cycle pairs can never co-occupy a cell (they swap). The LUT-08 glider uses
  only channels in cycle (5,6), confirming it''s a non-interacting composite of 4
  independent bits.


  The script had one bug: an empty `L()` call on line 340 (now fixed to `L("")`).

  '
