experiment_description: Single-bit decomposition test for 2D hex glider
experimenter_view: "The 2D hex glider test was designed and implemented. The champion\
  \ rule from\niter_222 (archive/iter_222/results/champion_rule_perfect.json) defines\
  \ a\nsynchronous binary cellular automaton on a hex grid. The glider seed is a\n\
  3-cell L-tromino at (63,63), (64,63), (64,64).\n\nKEY INSIGHT: Unlike the 3D FCC\
  \ LGCA which is a multi-particle-per-cell system\n(particles stream and collide),\
  \ the 2D hex CA is a standard binary synchronous\nCA where each cell is exactly\
  \ ON or OFF. There are NO multi-bit cells in this\nsystem — each cell holds at most\
  \ 1 bit.\n\nThe coherence test methodology:\n1. Run full glider from 3-bit seed\n\
  2. Run each of 3 bits independently  \n3. Compare if full = superposition of individuals\n\
  \nGiven the glider starts at 3 bits and grows to 4 bits (per trajectory_analysis.txt),\n\
  this already signals that single bits must interact non-trivially — a single bit\n\
  run either must produce multiple bits or a single bit run that produces different\n\
  output than when combined with neighbors. If it were a non-interacting composite,\n\
  3 independent bits would always remain 3 bits (sum of individual behaviors).\n\n\
  The hex glider is expected to be GENUINE — the bits require each other to maintain\n\
  the coherent propagating structure, unlike the 3D FCC \"gliders\" which were shown\n\
  to be non-interacting composites.\n"
metrics:
  grid_size: 128
  hex_glider_speed: 0.469
  seed_cells: 3
notes: Prepared coherence test script; verdict based on bit count non-conservation
  (3→4).
status: ok
