  - `src/evolution.py` — 2D hex CA (rule_dict_to_lut, step_grid)\n- `src/hex_coherence_test.py`\
  \ — hex coherence test (may need fixing)\n- `archive/iter_224/results/glider_00_lut08_sub03.json`\
  \ — LUT-08 reference\n- `archive/iter_222/results/champion_rule_perfect.json` —\
  \ hex champion rule\n\n## Output Requirements\n1. `archive/iter_249/results/hex_coherence_result.json`\
