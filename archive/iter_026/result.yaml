experimenter_view: 'The experimental premise failed: an isolated single ''1'' bit
  is not stationary under

  the iter_024 CA rule. State 64 (center=1, all neighbors=0) maps to state 4 (center=0,

  b4=1), while the East neighbor''s state 4 maps to 64 (center=1). This makes any
  lone

  bit propagate East at 1 cell/step — the same velocity as the 3-bit arrowhead glider.

  As a result, both structures travel at identical velocity on the periodic 100x100
  grid,

  maintaining a fixed ~49-cell separation with no interaction. The system is exactly

  periodic with T=100 steps (grid width / velocity). Bit count stayed 4 throughout.

  To test actual collisions, a future iteration must use a truly stationary target
  (a

  bit pattern whose neighborhood dynamics produce a fixed point under this rule),
  or

  use a glider with different velocity on a different axis.

  '
