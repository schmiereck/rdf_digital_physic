experimenter_view: 'All 11 unique contiguous 3-bit hex patterns were tested on an
  infinite sparse grid for

  up to 200 steps. Three of the seeds (all collinear arrangements — in the E, NE,
  and SE

  directions) are period-1 still lifes that are stable and bit-conserving. The remaining

  8 seeds (all bent/L-shaped and triangular arrangements) immediately lose the 3-bit
  count

  and are unstable. No seed produced an oscillator or glider. The hypothesis that
  the W=3

  rule (A=7, B=14) supports a 3-bit glider is falsified by exhaustive search. The

  stability is highly selective: only perfectly aligned triplets survive, and they
  do not

  move. To find gliders in this rule, one would need to search higher bit counts (4+)
  or

  consider composite objects formed by interactions of still lifes.

  '
