notes: 'Collision_step=49 (not 50) because the stripe at q=70 prevents the would-be
  tip at q=69 from turning on via state-4 rule; glider advance rule requires b1:E=0
  but finds b1:E=1 (stripe neighbor). One bit is permanently annihilated. Rule is
  locally popcount-preserving per neighborhood but does not guarantee global bit conservation
  when glider and stripe neighborhoods overlap.

  '
