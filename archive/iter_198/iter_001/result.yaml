experimenter_view: 'Neither failure hypothesis is supported. The 800-step 60-degree
  collision

  simulation under the iter_193 champion rule is trivial: it runs in 0.67 s

  wall, bit_count never exceeds the initial 6, ncomp settles to 4 after the

  first step, and per-step time is rock-flat at ~0.84 ms (max single-step 1.63 ms).


  Mechanistic interpretation: under this rule the L-tromino seed does NOT

  propagate as a glider. Within one CA step each L-tromino fragments into two

  static (or low-period) micro-components — going from 2 blobs (6 bits) to 4

  blobs (6 bits) at step 1 and remaining there forever. The two seeds are

  ~109 cells apart and never approach, so there is in fact no "collision".

  This is consistent with iter_193''s fitness=2.0 reflecting some stability /

  bit-conservation metric rather than coherent motion.


  Therefore iter_197.1''s "3x timeout" was NOT caused by a chaotic explosion

  (bit_count would have grown — it didn''t) and NOT by a computationally

  expensive pattern (sim_time_ms would have grown — it didn''t). The runaway

  must lie outside the CA loop in iter_197.1. The prime suspect is its

  post-processing: it accumulates 601 frames of a 256x256 array

  (~40 MB resident), then PIL-encodes ~370 of them upscaled to 512x512 as a

  palettized GIF. PIL''s GIF encoder is the well-known bottleneck for that

  shape of data and easily blows past the planner''s runtime budget while

  reporting nothing to stderr. The simulation itself is healthy on this grid

  size and this rule.

  '
