experimenter_view: 'The density scan confirms a clear non-linear relationship between
  rule density

  and viability. Medium density (8 pairs, 32 non-identity mappings) is the

  optimal regime: it yields the most viable rules (2) and the highest top fitness

  (0.0277), roughly 22x better than low density''s top score. Low density (4 pairs)

  produced zero viable rules — the rules are too sparse to sustain motion even

  transiently. High density (16 pairs) is dominated by chaos (75% chaotic), with

  nearly all remaining rules being static; only 1 viable rule emerged, with lower

  top fitness than medium density. The chaotic fraction grows monotonically with

  density (18% → 45% → 75%), while the static fraction falls (82% → 53% → 24%).

  This suggests a phase transition: low density → static order, medium density →

  edge of chaos (viable motion), high density → full chaos.

  '
