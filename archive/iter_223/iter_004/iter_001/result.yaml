experimenter_view: 'The scan of all 10 specified rule sources (champions from iter_215,
  218,

  221, 222 plus the iter_215 final and warm-start populations) yielded

  151 unique rules. None of them simultaneously supported a sub-light

  glider (v<c) AND a light-speed glider (v=1c) under the chosen criteria

  (period<=20, velocity_std<0.05, |Δbits|<=1, v<c in [0.1, 0.9], v=1c > 0.9).


  The result is meaningful: the v<c-supporting rules (iter_218 champion,

  iter_222 champion_rule_perfect) form a small, dedicated subfamily, while

  the iter_215 lineage broadly supports v=1c gliders but no rule from

  either subset crosses over. Among 49 rules in the iter_215 final

  population, all gliders found were v=1c. Among the iter_221 family,

  none of the four champion variants produced any glider under these

  criteria.


  No collision simulations were performed because the precondition (a

  rule supporting both glider types) was not met. The collision-results

  artifact was still written with an empty results list for downstream

  consumers.


  Practical implication: to find mixed-glider rules, future evolutionary

  searches should explicitly multi-objective optimize for the

  coexistence of v<c and v=1c gliders within a single rule, rather than

  re-scanning corpora evolved under single-speed regimes.

  '
