experimenter_view: "Neither rule supports BOTH a sub-light speed (v < c) glider and\
  \ a light-speed (v = 1c) glider. This reflects\nthe specialized selection pressures\
  \ of their respective evolutionary environments. \nRule A (DisplacementConsistencyFitness)\
  \ strictly penalized speeds >= 0.9c during training, resulting in physics \nthat\
  \ support exactly 4 sub-light gliders (v ~ 0.47c, period 3) with perfect bit conservation,\
  \ but no light-speed gliders. \nRule B (RecessionBiasedFitness) rewarded fast post-collision\
  \ separation, shaping a physical regime where 47 of the \n55 active seeds stabilize\
  \ into ballistic, light-speed gliders (v = 1c), with zero sub-light gliders surviving.\n"
