experimenter_view: 'Neither champion rule supports BOTH a v<c and a v=1c glider on
  the 3- and

  4-bit contiguous seed space — the two fitness regimes selected for mutually

  exclusive motion physics.


  Rule A (iter_222, DisplacementConsistencyFitness) yields exactly 4 v<c

  gliders, all with the same period-3 dynamics and speed ~0.47c (axial-

  Euclidean cells/step). Two are the canonical L-tromino in its two

  translation-distinct orientations [(0,0),(0,1),(1,1)] and

  [(0,0),(1,0),(1,1)] — exactly the seed cited as the iter_222 champion

  (which referenced L_TROMINO_3bit, [63,63],[64,63],[64,64], lex-relative

  [(0,0),(1,0),(1,1)]). Velocity std across the five 40-step windows is

  ~0.01, confirming a tight, sustained glider — the toroidal canonicalisation

  was required for period detection because the glider wraps the column

  axis around step 189. Rule A produces NO v=1c gliders at all; all other

  seeds become still lifes (12), short-period stationary oscillators (6),

  extinctions (12), or chaotic patterns (21).


  Rule B (iter_193, RecessionBiasedFitness) yields 47 v=1c gliders — almost

  the entire 55-seed sweep produces a unit-cell-per-step propagator. All

  observed speeds cluster at the diagonal hex-axial magnitude sqrt(2) ≈ 1.40

  (some 1.34 due to bit growth), meaning these are c-speed gliders moving

  along (1,-1)-like axial directions. The 8 chaotic seeds all explode to

  >100 cells — none are sub-light gliders. Rule B produces NO v<c gliders.


  This dichotomy is consistent with the optimisation pressure each fitness

  function applied: DisplacementConsistencyFitness rewards bounded,

  consistent sub-c motion (range [min_velocity=0.02, max_velocity=0.9]) and

  thereby suppresses c-speed propagation; RecessionBiasedFitness rewards

  fast separation of colliding gliders, which is best achieved by maximal

  c-speed ballistic motion of single cells. Future work seeking BOTH glider

  types in a single rule would need a multi-objective fitness combining

  these regimes.

  '
