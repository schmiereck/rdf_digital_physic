experimenter_view: 'rule_011 from iter_131 ran for 1000 steps on the canonical ash
  pattern (200x200

  grid, wrapping boundaries).  The initial 325-bit ash collapsed rapidly to a stable

  ~78-80 bit remnant composed of ~37 objects by step 20.  The displacement from the

  original COM settled immediately into a tight oscillation between 8.71 and 9.34

  units and stayed there for the entire 1000-step run — it did not grow over time.

  This means the remnant is not a translating glider but a fixed or oscillating

  structure displaced from the ash centroid.  The remnant form was stable (bit count

  within 5% from step 200 to 1000).  The sustained-motion criterion

  (disp_1000 > 4.5 × disp_200) was not met: 8.71 vs threshold 42.05.

  The iter_131 finding of "constant velocity motion" may have been observed on a

  shorter run or with a different initial condition; over 1000 steps from the

  canonical ash, no translational drift is present.

  '
