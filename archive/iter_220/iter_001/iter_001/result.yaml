experimenter_view: 'The champion rule (fitness=0.221319) was found in generation 0
  and was never

  surpassed across 20 subsequent generations — a clear early plateau of the

  best-fitness signal. The mean fitness did grow substantially (0.009 → 0.175),

  meaning the population converged toward near-champion quality, but no

  individual exceeded the gen-0 champion. This suggests the fitness landscape

  has a sharp, isolated peak that the initial random sample happened to hit; the

  swap-mutation operator (1 swap/child) with a 10-individual elite is sufficient

  to maintain the champion but insufficient to escape the plateau to a higher

  peak. Next step should either widen exploration (larger population, higher

  mutation rate, crossover) or verify whether 0.221319 genuinely represents a

  glider-like trajectory or merely a near-zero displacement particle.

  '
