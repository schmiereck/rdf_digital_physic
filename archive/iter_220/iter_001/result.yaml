experimenter_view: 'The src/ directory contains an extensive cellular automaton research
  codebase focused on discovering gliders and coherent objects in hexagonal CA rules.
  The fitness system is highly evolved across many iterations, with multiple specialized
  fitness functions designed to defeat various exploits:


  1. NetDisplacementFitness - defeats compact oscillators and puffer exploits

  2. SubLightFitness - defeats v=1c glider exploits by requiring period > 1 and velocity
  < 0.9c

  3. DisplacementConsistencyFitness - defeats "drifter" exploits by measuring velocity
  consistency across windows

  4. SparseGliderFitness - adds bit conservation gates and sparsity penalties

  5. LateWindowDisplacementFitness - defeats transient drift exploits by only measuring
  late-window motion

  6. GradedCollisionFitness - rewards partial progress in collision events

  7. Leaky fitness variants - provide continuous gradients rather than hard failures


  The codebase has evolved through at least 217+ iterations, with each iteration addressing
  specific exploit classes discovered in previous generations. The experiments/ subdirectory
  contains parallel working copies of key fitness modules.

  '
