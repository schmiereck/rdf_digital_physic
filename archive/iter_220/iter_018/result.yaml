experimenter_view: 'The breeder was able to grow to 129 active cells because DisplacementConsistencyFitness.max_bit_threshold
  defaults to None when instantiated. The guard clause `if self.max_bit_threshold
  is not None:` effectively disables all hard bit-count enforcement. The only mechanism
  penalizing cell count changes is the _compute_conservation_score() method, which
  applies a continuous fractional penalty (min/max ratio) rather than an outright
  rejection. To fix this, the breeder''s initialization needs to pass an explicit
  max_bit_threshold value (e.g., max_bit_threshold=100) to the DisplacementConsistencyFitness
  constructor.

  '
log_excerpt: '[Analysis of src/new_fitness.py]

  - max_bit_threshold defaults to None in __init__

  - Check in __call__: if self.max_bit_threshold is not None:

  - Breeder bypassed because threshold was never set

  - Only penalty is leaky conservation score (fractional, not hard-fail)

  '
metrics: {}
notes: 'Root cause identified: default None bypasses bit threshold check; fix requires
  passing explicit value to constructor'
