experimenter_view: 'The LeakySubLightFitness exploit was successfully documented.
  The champion rule

  from iter_218 achieves fitness ~84.34 despite moving the centre of mass only

  ~0.639 cells per step (below the 0.9 velocity threshold). Its net displacement

  over 200 steps equals ~84.34 cells — nearly identical to its final fitness

  because bit conservation is perfect (score = 1.0). The fitness formula

  fitness = net_displacement * total_conservation_score means that ANY persistent

  object with slow, steady drift scores almost as well as a true glider. Evolution

  can "exploit" this by finding stationary or semi-stationary patterns that drift

  slowly over time while preserving their bits, rather than discovering genuine

  glider structures. This is a fundamental flaw in the fitness landscape design:

  it conflates "movement over many steps" with "glider behaviour".

  '
