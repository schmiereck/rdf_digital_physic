experimenter_view: "The script as written had a TypeError (generate_random_c2_rule\
  \ requires an\n`rng: random.Random` argument). Applied a one-line fix: instantiated\n\
  `rng = random.Random()` and passed it. The GA then ran cleanly through\nGen 0 →\
  \ Gen 20 (100 individuals each).\n\nHowever, every individual in every generation\
  \ scored fitness=0.0. Inspection\nof the champion JSON shows a sparse LUT (mostly\
  \ identity 0→0 with a few\nscattered non-identity entries), which is the typical\
  \ signature of a\nrecombination-only crossover from initially-trivial parents: once\
  \ Gen 0 all\nscore 0, the \"elite_size=10\" elites are just an arbitrary 10 zero-fitness\n\
  rules, and crossover between them cannot escape the dead zone.\n\nRoot causes of\
  \ the flatline:\n1) The C2-symmetric rule generators produce LUTs that are dense\
  \ over a small\n   orbit set, but the crossover here works over keys \"0\"..\"127\"\
  \ as if every\n   key is independent — this breaks C2 symmetry and likely also breaks\n\
  \   reversibility/conservation properties needed for any glider to survive.\n2)\
  \ `expected_bits=3` is a hard gate: rules that don't perfectly conserve the\n  \
  \ 3-bit L-tromino over 500 steps return fitness 0. Random C2 rules almost\n   never\
  \ satisfy this. Without a softer fitness ramp (e.g. partial credit\n   for displacement\
  \ or near-conservation) the search has no gradient to climb.\n3) Default `random.Random()`\
  \ (no seed) makes runs non-reproducible.\n\nNet: the pipeline is functional but\
  \ the fitness landscape is effectively flat\nfor the chosen seed/operators. Need\
  \ a softer fitness shaping, C2-preserving\ncrossover, or a warm-start population\
  \ to make further iterations productive.\n"
