experimenter_view: 'DisplacementConsistencyFitness failed to reject the breeder because
  it only measures Centre-of-Mass (COM) velocity consistency and bit conservation.
  A breeder pattern can maintain a highly consistent COM trajectory (appearing as
  a single moving object to the COM metric) while simultaneously spawning stationary/walking
  debris. The fitness function lacks spatial coherence checks:

  1. Bounding Box: True gliders have a bounded, non-growing bounding box. Breeders
  exhibit monotonic bounding box growth as debris accumulates.

  2. Connected Components: Gliders maintain exactly 1 connected component. Breeders
  split into ≥2 components as debris separates.

  3. Initial Vacuum: The function never verifies that the original seed cells are
  vacated by the end of the simulation, allowing breeders that leave debris at the
  anchor point to pass.

  4. Per-Window Bit Trend: Conservation is scored globally/leakily, masking steady
  bit-count increases across windows that characterize debris generation.

  Improvements: Add a bounding-box area growth penalty, a connected-components count
  gate (strictly ==1), a final-step seed-cell vacuum check, and a per-window bit-count
  monotonicity test. These will create a hard wall against breeder exploits while
  preserving the valid glider signal.

  '
