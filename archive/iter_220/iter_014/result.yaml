experimenter_view: "The population consists of 100 evolved rules for the L-tromino\
  \ cellular automaton. \nEach individual encodes a rule set via a 128-bit chromosome\
  \ where each bit \ncorresponds to a specific neighborhood configuration. The decoded\
  \ rule_dict \nmaps active configurations to their resulting cell states, providing\
  \ a \nhuman-readable interpretation of the genome. Fitness ranges from 56.0 \n(2\
  \ best performers) down to 0.0 (25 zero-fitness individuals), with the \nbulk (60)\
  \ clustering around 0.667. The sparse nature of rule_dict suggests \nthat only ~15-30\
  \ of the 128 possible configurations are actively defined \nper rule, with the rest\
  \ acting as no-ops or defaults.\n"
