experimenter_view: "The codebase implements a sophisticated evolutionary search framework\
  \ for discovering v<c (sub-light) gliders in cellular automata rules. \n\nTwo fitness\
  \ architectures were identified:\n1. run_vc_search.py currently uses LeakySubLightFitness\
  \ or SubLightFitness (both from existing fitness_modules), which employ checkpoint-based\
  \ conservation with velocity reward.\n2. new_fitness.py introduces DisplacementConsistencyFitness,\
  \ a newer approach that uses windowed velocity consistency (low std_dev of per-window\
  \ velocity magnitudes) to defeat \"drifter\" exploits where objects fake displacement\
  \ via random-walk behavior.\n\nThe DisplacementConsistencyFitness fitness uses the\
  \ formula: base_fitness = mean_velocity_magnitude / (1 + std_dev_velocity_magnitudes),\
  \ multiplied by a leaky conservation score. This creates a metric that rewards coherent\
  \ directional motion while penalizing inconsistent oscillators and drifters.\n\n\
  The search configuration is modest (100 population, 10 generations, 200 simulation\
  \ steps), suggesting this is an early exploration phase. The output artifacts include\
  \ a champion JSON, evolution log CSV, and animation GIF.\n"
