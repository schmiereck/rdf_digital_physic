experimenter_view: "The script implements a Generational Evolutionary Algorithm (GGA)\
  \ to discover \nstable gliders in C2 cellular automata.\n\nKey Design Choices:\n\
  1. Representation: Rules are 128-bit vectors (LUT size).\n2. Fitness: DisplacementConsistencyFitness\
  \ measures the stability of motion \n   directionality over a 500-step window.\n\
  3. Evolution: \n   - Population: 100 individuals.\n   - Selection: Elitist (top\
  \ 10% survive to next gen).\n   - Mutation: Swap mutation with rate 0.01.\n4. Goal:\
  \ Evolve rules that transform the static L-tromino into a moving glider.\n"
log_excerpt: 'The fitness function is instantiated as a singleton at module level:

  _fitness_fn = DisplacementConsistencyFitness(num_windows=5)


  It operates on simulation histories generated by:

  - Rule: C2 Cellular Automaton (128-bit binary chromosome)

  - Seed: 3-bit L-tromino at [63,63], [64,63], [64,64]

  - Horizon: 500 steps on a 128x128 toroidal grid

  - Data: Center of Mass (COM) coordinates and cell counts per step

  '
