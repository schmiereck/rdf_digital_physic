experimenter_view: 'Iteration 220 successfully evolved a diagonal glider from an L-tromino
  seed on a 128x128 grid.

  The champion rule has 12 entries and produces a stable period-64 oscillator that
  translates

  diagonally across the grid. Fitness converged rapidly by generation 10 (best_fitness=0.457),

  with the mean fitness climbing from 0.007 to 0.420 by generation 20. However, the
  run was

  truncated at only 20 generations, suggesting early termination or a limited budget.
  The

  trajectory is perfectly periodic with a coordinate reset every 64 steps (likely
  boundary

  wrapping or coordinate tracking normalization). The glider exhibits classic Life-like
  behavior

  with active cell counts growing from 3 to 84+ as it propagates.

  '
