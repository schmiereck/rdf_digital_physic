experimenter_view: 'The SubLightFitness class (iter 216.4) is explicitly designed
  to outcompete

  v=1c gliders by combining three filters:

  1. A hard velocity threshold (v < 0.9) rejects speed-of-light movers.

  2. A strict period gate (T > 1) rejects trivial period-1 gliders.

  3. A displacement > 0 check effectively rejects stationary oscillators.

  Period detection is handled internally as a @staticmethod (_detect_period)

  rather than a separate instantiated class. It normalizes grids via CoM-relative

  frozensets and checks for repetition up to max_period (default 64).

  Fitness is scaled by a period bonus (1 - 1/T) to reward complex, slower gliders.

  '
