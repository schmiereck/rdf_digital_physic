artifacts:
- src/validate_fitness.py
experimenter_view: 'The validation confirms that DisplacementConsistencyFitness correctly

  separates true glider motion from the drifter exploit.


  The drifter (g4_rule_083, iter_218) scores exactly 0.0000. With a single

  L-tromino seed it is completely stationary (net_disp=0.00), exposing the

  "exploit" as a seed-dependent artifact — it only drifted under the specific

  multi-seed regime used in iter_218''s fitness evaluation.


  The v=1c glider (g10_rule_001, iter_179) scores 0.0805, the highest of the

  three. It is perfectly bit-conserving (3→3) and shows 12 cells of coherent

  net displacement. The consistent velocity across all 5 windows drives the

  score up despite the modest absolute displacement.


  The elastic collision rule (g10_f_rule_034_c2, iter_193) scores 0.0219.

  It is a genuine glider rule but the leaky conservation penalty dramatically

  reduces its score because the single-particle simulation causes bit growth

  (3→14): this rule was evolved for two-particle collision scenarios and

  creates secondary particles from a single seed, triggering the conservation

  multiplier. This is scientifically correct behaviour — the function penalises

  incoherent bit production.


  Key finding: the fitness ordering is g10_rule_001 > g10_f_rule_034_c2 >

  g4_rule_083, with the drifter scoring zero. The primary success criterion

  (drifter < both glider rules) is satisfied with a clean exit code 0.

  '
