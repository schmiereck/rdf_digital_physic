experimenter_view: 'The DisplacementConsistencyFitness class currently uses a "leaky"
  bit

  conservation mechanism that provides a smooth evolutionary gradient but

  never hard-fails on bit-count deviations (except when bits reach 0).

  This means particles that temporarily gain or lose cells still receive

  partial fitness, which may allow drifters or non-conserving objects to

  survive and produce offspring. Adding a strict_conservation parameter

  would enable a hard-fail mode (zero fitness on any deviation), useful

  when evolution needs a sharp selection pressure for perfect mass

  conservation rather than gradual gradient guidance.

  '
log_excerpt: "Analysis of src/new_fitness.py DisplacementConsistencyFitness completed.\n\
  \nKey findings:\n- _compute_conservation_score uses a continuous leaky penalty\n\
  - No strict_conservation parameter exists\n- Any bit count != initial_bits produces\
  \ a fractional factor\n  min(n,m)/max(n,m) instead of hard-zeroing fitness\n- Final\
  \ score = base_fitness * mean(conservation_factors)\n- Only bit_count == 0 produces\
  \ a factor of 0.0\n\nProposed fix: add strict_conservation bool to __init__ and\n\
  early-return 0.0 from _compute_conservation_score on any\ndeviation in strict mode.\n"
