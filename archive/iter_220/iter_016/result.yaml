experimenter_view: "The run_vc_search.py script implements a compact evolutionary\
  \ search for v<c gliders.\nKey design:\n1. Chromosomes are 128-bit representations\
  \ of CA rules; initial population consists of\n   C2-symmetric hexagonal rules generated\
  \ from random hex pairs.\n2. Selection is elitist: top 10% survive; new members\
  \ produced by two-point crossover\n   + per-bit mutation of elite parents.\n3. Two\
  \ fitness options: LeakySubLightFitness (soft conservation penalty via checkpoint\n\
  \   sampling) vs SubLightFitness (hard gates + period bonus). SubLightFitness explicitly\n\
  \   defeats v=c exploits via velocity threshold (<0.9) and period detection (requires\
  \ T>1,\n   with bonus = 1-1/T rewarding complex periodic gliders).\n4. Displacement\
  \ measured via wrapped centre-of-mass with minimum-image correction on a\n   toroidal\
  \ 128×128 grid.\n"
