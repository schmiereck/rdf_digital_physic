experimenter_view: 'The DisplacementConsistencyFitness function computes fitness by:

  1. Dividing the simulation history into `num_windows`.

  2. Computing per-window velocity vectors and magnitudes.

  3. Calculating the mean velocity magnitude and the standard deviation of magnitudes.

  4. Applying the formula: base_fitness = mean_velocity_magnitude / (1 + std_dev).

  5. Multiplying by a leaky bit-conservation score to penalize mass changes.

  This design effectively distinguishes coherent gliders (low std dev) from drifters
  (high std dev).

  '
