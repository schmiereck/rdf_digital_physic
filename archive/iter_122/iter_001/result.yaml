experimenter_view: 'Gen-2 dramatically outperforms Gen-1. The crossover-based breeding
  (taking

  floor(k/2) generator pairs from each of the 11 elites) and 10% mutation rate

  produced a generation where 12 rules exceeded the Gen-1 best of 0.09386,

  versus 0 such rules in Gen-1. Two rules (rule_010, rule_055) achieved fitness

  0.2396 — roughly 2.55x the prior champion — by pairing displacement of ~0.479

  with near-perfect bit/object conservation (325 bits, 71 objects; denom=2).

  The extended 400-step evaluation window (vs Gen-1''s 200) likely helped surface

  slower-developing displacements. About 30 rules remained completely inert

  (fitness=0.0), suggesting the breeding still produces many non-starters but

  the high-fitness tail is strongly enriched.

  '
