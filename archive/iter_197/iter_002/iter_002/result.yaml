experimenter_view: "The GA finished cleanly (50 gens × 100 pop in 401 s, parallel\
  \ ProcessPool of 8\nworkers), but the \"champion\" is a degenerate grid-filler,\
  \ not a v<c glider.\n\nWhat the GA found\n  Fitness 16.70 = 7 valid checkpoints\
  \ + 9.70 complexity bonus.\n  mean_bit_count = 16383.9 / 16384 -> the rule rapidly\
  \ saturates the entire\n  128×128 torus.  A saturated torus has a constant centre\
  \ of mass at (63.5,\n  63.5), so the velocity-constancy checkpoints all pass trivially\
  \ (n_valid =\n  n_checked = 7) even though speed ≈ 7e-4 cells/step (essentially\
  \ zero).\n  The complexity_bonus = log(1 + 16384) ≈ 9.70 alone is larger than the\n\
  \  maximum possible n_valid (7), so the GA's gradient pointed straight at\n  \"\
  fill the grid\", not \"find a sub-luminal mover\".\n\nDid we find any real v<c glider?\n\
  \  No.  A side-scan of 200 fresh random C2-symmetric rules with the same\n  fitness\
  \ produced 0 candidates with mean_bit_count in [5, 500] AND speed\n  in (1e-3, 0.99)\
  \ AND n_valid >= 3.  Stochastically, neither the random pool\n  nor the GA's final\
  \ population contained any plausible sub-luminal mover.\n\nImplications for next\
  \ iteration (the actual signal of value here)\n  1. Cap or normalise the complexity\
  \ bonus.  log(1+mbc) is unbounded and\n     grossly out-scales the discrete n_valid\
  \ term.  Either clip mbc to a\n     physically reasonable upper bound (e.g. mbc\
  \ <= 100) or zero-out fitness\n     when mbc > 0.5 * grid_area (saturation is not\
  \ a particle).\n  2. Add an \"is this really a particle?\" gate before measuring\
  \ velocity:\n     require connected support smaller than some fraction of the grid.\n\
  \  3. The T-tromino seed + C2-random initial population may be too narrow.\n   \
  \  Consider larger seeds or a non-symmetric initial pool.\n\nThe GIF (champion_glider.gif)\
  \ shows the saturation visually — within ~10\nsteps the grid is uniformly lit; nothing\
  \ translates.\n"
