task: 'Adapt the successful evolutionary framework to discover rules that support
  massive (v<c) gliders. This involves two main challenges:

  1. **Particle Definition:** A v<c glider needs internal state to oscillate, allowing
  for slower-than-light travel. Use a 4-bit asymmetric particle as the seed (e.g.,
  a T-tromino or a 2x2 square with one bit missing). This is a plausible next step
  up from the 3-bit L-tromino.

  2. **Fitness Function Adaptation:** The `CheckpointFitness` function must be modified
  to handle non-integer velocities. It should calculate the expected position based
  on a *measured* velocity from early checkpoints and check for continued movement
  along that vector. The goal is to find a rule that produces a particle with a stable,
  constant velocity `0 < v < 1` cells/step.

  3. **Evolutionary Search:** Launch a multi-generational evolutionary search using
  this new setup. The goal is to find at least one rule that produces a stable `v<c`
  glider. Document the new fitness function and the champion rule/particle.

