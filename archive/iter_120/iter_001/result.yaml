experimenter_view: 'The canonical ash (325 bits, 72 objects) is reproducible and stable
  under the

  cooling rule. The inert rule (A3_B14) preserves the ash almost perfectly —

  only 3 extra bits appear (325→328), all 72 objects survive, and the center of

  mass barely shifts (0.21 cells), yielding fitness=0.0524. The chaotic rule

  explodes the ash from 325 to 20,742 bits, merging all 72 objects into 1 giant

  connected component; despite a larger raw displacement (3.36 cells), the

  massive bit-count penalty collapses fitness to 0.000164. The metric correctly

  discriminates: the inert, structure-preserving rule scores ~320x higher than

  the chaotic one, validating the formula. A good evolution target would be a

  rule that moves the ash without inflating the bit count.

  '
