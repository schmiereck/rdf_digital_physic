experimenter_view: 'All three density levels produced zero viable founders under the
  local fitness

  metric (fitness > 0.001 AND bit_ratio < 3.0). However the results are not

  uniformly barren: medium_density (8 pairs) achieves the highest top fitness

  (1.238) by far, but every high-fitness rule in that tier accompanies a

  massive bit explosion (bit_ratio >> 3, often 50–150x initial). Rules with

  controlled bit counts (bit_ratio < 3) universally show zero displacement.

  This reveals a clean coupling problem: the remnant perturbation that produces

  local motion also drives chaotic growth. Medium density is the most promising

  tier because it maximises displacement before explosion, suggesting that a

  targeted search (e.g., elitism seeded from medium-density high-fitness rules

  combined with a bit-ratio penalty) may be able to decouple the two effects

  and find a true viable founder.

  '
