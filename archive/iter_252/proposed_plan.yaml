falsification_criterion: "Refuted if any of the following hold:\nF1: The 2D hex glider\
  \ does not survive embedding into the 3D FCC lattice\n    (no stable propagation\
  \ for 200+ steps from the L-tromino seed on the [111] plane).\nF2: The embedded\
  \ glider propagates but fails the Single-Bit Decomposition Test\n    (isolated constituent\
  \ bits survive independently, proving it's a non-interacting composite).\nF3: The\
  \ 13-channel factorized LUT cannot be constructed to be simultaneously\n    bijective,\
  \ bit-conserving, and compatible with the 2D hex rule on in-plane+center channels.\n\
  F4: For all tested coupling strengths (0.0 to 1.0 in 0.1 increments), either the\n\
  \    glider is destroyed (disperses within 200 steps) or no 3D binding emerges\n\
  \    (no configuration with bits on 2+ planes passes the Three-Test Coherence Protocol\n\
  \    over 500 LUT variants × 50 seed configurations).\n"
hypothesis: 'When the proven 2D hex glider rule (champion_rule_perfect from iter_222)
  is embedded

  into a [111] hex plane of the 3D FCC lattice as a factorized 13-channel LGCA

  (6 in-plane channels + 1 center channel following the 2D hex rule; 6 inter-plane

  channels following an identity mapping), the resulting system supports a genuine

  multi-bit bound glider with binding energy > 0 that propagates within the [111]

  hex plane at v ≈ 0.469c. Furthermore, introducing controlled non-factorized coupling

  between in-plane and inter-plane channels can produce 3D binding (bits spanning

  multiple planes) while preserving glider stability at coupling strengths below a

  critical threshold.

  '
