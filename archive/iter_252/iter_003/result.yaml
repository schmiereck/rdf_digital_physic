experimenter_view: 'The deterministic integer-based inter-plane coupling mechanism
  was

  implemented and tested across alpha=0..3 with 10 seed configurations

  each. At alpha=0, the embedded L-tromino glider survives perfectly

  (displacement ~5.01 over 300 steps), confirming the factorized

  embedding as an algebraic identity. For any alpha > 0, all

  configurations die immediately: the coupling siphons center bits into

  outgoing inter-plane channels the moment the hex rule produces a 1,

  breaking the synchronous in-plane neighborhood pattern and causing

  total dispersion. No 3D binding (bits spanning 2+ planes) was

  observed for alpha > 0. F4c is triggered decisively. F4a is also

  triggered at the alpha=0 baseline: multi-layer seeds decompose into

  independent per-layer gliders. The coupling hypothesis per

  pre_registration.md Section 6 is therefore REFUTED.

  '
