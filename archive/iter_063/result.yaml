experimenter_view: 'The 3-cycle rule (A=7, B=11, C=14) supports a rich set of stable
  3-bit objects —

  all 11 unique seeds are bit-conserving and reach a cycle — but none translate spatially.

  The pattern is uniformly period-2 oscillators or still lifes: the rule appears to
  be

  too symmetric or too conservative at the 3-bit scale to produce translational motion.

  A glider search at 4-bit may be more promising, as prior rules (A=11, B=14) did
  produce

  gliders at 4 bits but not 3.

  '
