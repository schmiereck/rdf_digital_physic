experimenter_view: 'The biased hybrid rule (seed=117, 6 cooling + 2 birth pairs, 32
  non-identity

  entries, 0 involution violations) is strongly expansive. The soup stabilised

  at ~9800 live cells (well above the 1000-cell resolved threshold), indicating

  the 2 birth pairs dominate even though they are outnumbered 3:1 by cooling

  pairs. All 21 motion seeds exploded past the MAX_CELLS=500 limit, so no

  glider or oscillator was detectable. This outcome mirrors iter_116''s finding

  that even a small number of birth mappings can overwhelm cooling dynamics;

  the 6:2 bias is insufficient to suppress expansion for this particular random

  draw. Next steps: (a) increase cooling bias further (e.g. 7:1 or 8:0), or

  (b) try a different seed to sample more of the rule space at the 6:2 ratio.

  '
