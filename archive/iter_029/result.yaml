experimenter_view: 'The hypothesis fails. Applying 6-fold rotational symmetry to the
  arrowhead-glider

  kernel produces 17 conflicts and a rule that does NOT support the original East-moving

  glider. The root cause is structural: state 64 (center-only, all neighbors zero)
  is

  rotationally invariant, so all 6 rotations of pair (4,64) map different "before"
  states

  (4,2,1,32,16,8) to the same target (64), while 64 can only have one inverse. The

  conflict resolution (first-write-wins) preserves rotation-0 mappings, but rotated

  variants (e.g., state 2→64, state 32→64) fire immediately on the glider''s boundary

  cells, turning them on spuriously. By t=1 the bit count jumps from 3 to 10, and
  the

  pattern expands CHAOTICALLY to 9898 bits by t=100. The 6-fold symmetric closure
  of

  this asymmetric kernel is fundamentally incompatible with it.

  '
log_excerpt: "Generating 6-fold symmetric rule from arrowhead-glider kernel...\nKernel\
