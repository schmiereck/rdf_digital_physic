  \ 64: existing=4, new=2 (rotation=60deg, pair=(4,64))\n  CONFLICT at state 64: existing=4,\
  \ new=1 (rotation=120deg, pair=(4,64))\n  CONFLICT at state 97: existing=49, new=97\
