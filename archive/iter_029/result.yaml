notes: '17 conflicts arise because the kernel pair (4,64) has a rotationally-invariant
  "after"

  state (64 = isolated center), and the identity pair (70,70) rotates into states
  already

  claimed by movement pairs. A conflict-free 6-fold symmetric rule would require a
  kernel

  designed from the start with that symmetry. The original East-moving glider requires

  breaking rotational symmetry.

  '
status: experiment_failed
