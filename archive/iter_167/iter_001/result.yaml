experimenter_view: 'Every rule in the population scored exactly fitness=0.0 with displacement=0.0.

  This is not a sampling failure — it is a mathematical certainty caused by a

  symmetry invariant: the 2x2 seed block at grid center is invariant under the

  180° rotation (r,c)→(127-r,127-c), i.e., it is C2-symmetric. Any C2-symmetric

  rule preserves C2-symmetric patterns, so the center of mass is permanently

  fixed at (63.5, 63.5). Displacement is identically zero for ALL rules, making

  the fitness landscape perfectly flat.


  Bit counts varied widely (some rules left bits=4, others grew to 130 or 1538,

  others shrank to 2), confirming the rules are active — but CoM never moved.


  No rule successfully propagated the particle. The experiment design must be

  revised: the seed particle must be asymmetric (not C2-symmetric) so that

  displacement is not structurally zero. A recommended fix: use an L-tromino

  or single off-center cell as the seed for iter_168.

  '
