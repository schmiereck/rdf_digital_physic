experimenter_view: 'The task referenced a non-existent file (archive/iter_200/results/champion_rule.txt).

  The true "bad" rule is in archive/iter_200.1/results/champion_v_lt_c_rule.json —
  the

  period-4 stationary oscillator that was debunked in iter_201 with exploit fitness
  1.927.


  CumulativeDisplacementFitness (already correctly implemented from the previous low

  attempt) measures net displacement from t=0 to t=max_steps.  For the period-4

  oscillator with simulation_steps=200, the final CoM lands at phase-0 of its cycle

  (200 mod 4 = 0), which is 0.667 cells from the initial position.  This gives

  fitness = 0.667 / (1+3) = 0.167 > 0.1.


  The 0.1 threshold IS achievable: at simulation_steps=50 or 150 (mod 4=2, the phase

  closest to the initial CoM), fitness = 0.083 < 0.1.  The mismatch is a resonance

  effect between the 200-step window and the oscillator''s 4-step period.


  Critically, the function still provides ~100x discrimination between the oscillator

  (0.167) and a hypothetical true glider at v=c/3 (~16.75 fitness).  The fitness

  function is scientifically sound but the success threshold needs to account for

  period-window resonance, or the implementation should use a step count coprime to

  likely oscillator periods (e.g., 201 or 199 instead of 200).

  '
