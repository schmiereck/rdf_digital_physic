experimenter_view: 'The run was stable and completed all 15 generations in 61.7 s
  with no errors.

  Fitness rose sharply in generation 2 (0.37 → 89.8) and plateaued for the

  remaining 13 generations; the population mean converged toward the champion

  value (~84–87 by gen 9–15), indicating strong selection pressure and low

  diversity.


  EXPLOIT DETECTED — the champion rule is an annihilating rule: it destroys

  the 3-bit L-Tromino seed within 200 steps (final_bits=0). The

  CumulativeDisplacementFitness.evaluate() calls center_of_mass() on an empty

  grid, which returns (0.0, 0.0) by convention. The initial CoM is near

  (63.67, 63.33), so the Euclidean "displacement" is ≈ 89.8 — but this is not

  real movement; it is an artifact of the empty-grid CoM sentinel. The

  denominator (1 + 0 = 1) does not penalise annihilation, so the formula

  rewards destruction as if it were displacement.


  No genuine glider was discovered. The fitness function needs a

  bit-conservation gate (similar to SparseGliderFitness) or must treat

  final_bits=0 as fitness 0.0 to close this exploit.

  '
