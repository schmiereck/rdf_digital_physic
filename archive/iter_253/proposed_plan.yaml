falsification_criterion: "The hypothesis is REFUTED if any one of the following holds:\n\
  F1: No totalistic rule in the GA search produces a propagating structure surviving\n\
  \    ≥200 steps from any seed of size 3–6 bits. (If all rules produce only static\n\
  \    oscillators, chaotic explosions, or rapidly dispersing patterns.)\nF2: The\
  \ best surviving structure passes the Single-Bit Decomposition Test — i.e.,\n  \
  \  at least one constituent bit of the seed survives and propagates independently\n\
  \    when run in isolation — proving it is a non-interacting composite with binding\n\
  \    energy = 0.\nF3: The totalistic rule space is shown to be too coarse (only\
  \ 2^14 = 16,384 rules)\n    to encode the anisotropic propagation directions needed\
  \ for directed glider\n    motion on the FCC lattice, making any surviving structure\
  \ necessarily isotropic\n    (expanding blob) or stationary (oscillator).\n"
hypothesis: 'A totalistic synchronous CA on the 3D FCC lattice (13-neighbor input
  → 1-bit center

  output, NO bit conservation constraint) can produce at least one genuine multi-bit

  bound glider with binding energy > 0. Specifically: there exists a totalistic rule

  R: {0,...,13} → {0,1} such that a small multi-bit seed (3–6 bits) on the FCC grid

  evolves into a stable, propagating structure where (a) the structure survives ≥200

  steps, (b) no individual constituent bit survives alone (Single-Bit Decomposition

  Test fails for each bit, proving cooperative survival / binding energy > 0), and

  (c) the structure propagates with a well-defined sub-light velocity (net displacement

  > 0 per period). This is motivated by the 2D hex precedent where cooperative survival

  via weight-1→0 transitions is the proven binding mechanism, and the 13-neighbor
  FCC

  totalistic CA directly generalizes this architecture to 3D.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "RE-RUN of iteration 253 with optimized totalistic_ga.py code.\n\n\
  Step 1: Verify and re-run the existing totalistic_ga.py infrastructure.\n  - Confirm\
  \ the totalistic CA engine on 3D FCC lattice is functional:\n    13 neighbors per\
  \ cell, totalistic rule R: {0,...,13} → {0,1}.\n  - Confirm O_h symmetry enforcement:\
  \ totalistic rules are automatically O_h-symmetric\n    by construction (depend\
  \ only on Hamming weight, not neighbor identity).\n  - Confirm bit conservation\
  \ is NOT enforced (matching 2D hex precedent).\n  - File: src/totalistic_ga.py (already\
  \ exists and optimized)\n\nStep 2: Execute the GA search (sub-task 253.2.3 re-run).\n\
  \  - Search space: 2^14 = 16,384 totalistic rules (compact enough for exhaustive\n\
  \    evaluation if needed, but GA preferred for fitness-guided exploration).\n \
  \ - Seed library: small multi-bit seeds (3–6 bit L-tromino-like patterns on FCC\n\
  \    [111] plane and other high-symmetry planes).\n  - Fitness function: checkpoint-based,\
  \ combining:\n    (a) Late-window net displacement (steps 150–200) > 0\n    (b)\
  \ Bit count bounded (penalize explosions: max_bit_count / initial_bit_count < 3.0)\n\
  \    (c) Velocity stability (low std dev of displacement across windows)\n    (d)\
  \ Anti-settler: must have net displacement > 0\n  - GA parameters: population=100,\
  \ generations=20, tournament selection, point\n    mutation on rule bits, crossover.\n\
  \  - Timeout safeguards: per-rule simulation capped at 200 steps; per-generation\n\
  \    evaluation capped with early termination for chaotic rules (bit count > 3×\
  \ initial).\n\nStep 3: Post-filter champion rules with Three-Test Coherence Protocol.\n\
  \  - Single-Bit Decomposition Test: remove each constituent bit of the seed and\n\
  \    re-run. ALL bits must fail to survive alone for the glider to be genuine.\n\
  \  - Collision Coherence Test: check if glider maintains structure under small\n\
  \    perturbations (1-bit latency field).\n  - O_h Covariance Test: rotate the glider\
  \ seed by all 48 O_h elements and verify\n    survival (automatic for totalistic\
  \ rules — only seed geometry matters).\n\nStep 4: Positive control — verify the\
  \ 2D hex glider rule maps correctly into the\n  totalistic framework on a 2D hex\
  \ lattice slice, confirming the GA can in principle\n  discover cooperative survival\
  \ binding.\n\nStep 5: If F2 is triggered (composite), analyze whether the totalistic\
  \ constraint\n  (ignoring neighbor identity) is the root cause by testing semi-totalistic\
  \ rules\n  that distinguish center-bit state.\n\nFiles to create/modify:\n  - src/totalistic_ga.py\
  \ (already exists, optimized — verify and execute)\n  - src/totalistic_fcc_engine.py\
  \ (may already exist as part of totalistic_ga.py)\n  - src/pre_registration.md (auto-generated\
  \ from this plan)\n"
