falsification_criterion: 'A systematic search of all unique (up to O_h rotation) initial
  configurations of bit-weight 4 <= W <= 8 within a bounding box of size 4x4x4 on
  the 3D FCC lattice under the LUT-08 rule yields zero stable sub-light gliders (0
  < |v| < c, periodic shape recurrence, constant bit-weight) that are in a different
  O_h orbit than LUT-08.

  '
hypothesis: 'The 3D FCC lattice cellular automata under the O_h symmetric rule that
  supports the LUT-08 glider admits at least one other stable, propagating sub-light
  glider species (with bit-weight 4 <= W <= 8, period P, and average velocity 0 <
  |v| < c) that belongs to an O_h symmetry orbit disjoint from that of LUT-08.

  '
pre_registration_file: src/pre_registration.md
proposed_method: '1. Implement or load the 3D FCC CA engine with the 12-channel cuboctahedron
  neighborhood and the O_h-symmetric rule from iter_224 that supports LUT-08.

  2. Implement a seed generator that creates all unique spatial configurations of
  active bits with total weight W in [4, 8] within a 4x4x4 bounding box, using the
  48-element O_h symmetry group to filter out equivalent configurations.

  3. Simulate each unique candidate seed for T = 80 steps on a 32x32x32 open-boundary
  grid.

  4. Track the active bit-count, center of mass (CoM), and spatial shape. Identify
  candidates that show a constant or periodic bit-count, non-zero net displacement,
  and perfect shape recurrence after a period P (i.e. shape is translationally invariant).

  5. Check if any discovered glider species belong to an O_h orbit disjoint from LUT-08''s
  orbit.

  6. Document the discovered gliders (their velocity, period, weight, and symmetry
  orbits) or record a clean null result if no new species exist in this search space.

  '
