experimenter_view: 'The full 72-orbit C2-symmetric evolutionary pipeline was implemented
  and

  executed end-to-end. The C2 orbit machinery is mathematically verified:

  16 fixed-point states + 56 size-2 orbits = exactly 72 orbits. Conversion

  between 72-orbit chromosomes and rule_dicts is bijective up to projection,

  yielding fully C2-symmetric LUTs by construction.


  However, the 50-generation search failed to discover any candidate with

  non-zero fitness. The warm-start population from iter_215 — which encoded

  C6-symmetric rules — collapses under C2 projection: the OR-projection

  enforces C2 symmetry but breaks the original glider dynamics, producing

  rules whose L-tromino seed either grows without bound (exceeding the

  max_bit_threshold=12 gate) or moves at speeds outside the (0.02, 0.9)

  velocity window. Random bit-flip mutations at rate 0.02/bit produced

  zero variance in fitness across all 50 generations, so selection became

  random and the GA performed a random walk in a flat zero-fitness

  landscape.


  The "champion" written to disk is essentially the first chromosome from

  the seeded population (fitness = 0). Its 500-step characterisation shows

  it grows monotonically toward 138-172 active cells (≈55× the 12-cell

  threshold) and drifts only +20 rows over 500 steps with highly

  inconsistent per-window velocities — a clear non-glider that is correctly

  filtered to 0.0 by DisplacementConsistencyFitness.


  Conclusion: the pipeline is correct; the scientific goal (find a v<c

  glider via 72-orbit C2 search) was not met from this warm start. Likely

  remedies for a follow-up iteration include (i) seeding with verified

  C2-symmetric rules rather than C2-projected C6 rules, (ii) increasing

  mutation rate (≥0.05/bit) until a non-zero fitness emerges to break the

  flat-fitness plateau, (iii) relaxing max_bit_threshold so partial gliders

  earn fractional fitness, or (iv) using a tournament-with-noise selection

  to keep diversity high during the flat phase.

  '
