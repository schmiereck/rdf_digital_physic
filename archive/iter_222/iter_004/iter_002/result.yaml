experimenter_view: 'The projection bug fix is correct: rule_dict_to_chromosome_72
  now correctly

  flips an orbit''s default center bit when any orbit member appears in rule_dict,

  producing non-zero chromosomes (37 active bits for the first warm-start rule

  vs all zeros previously). However, the warm-start rules from iter_215 do NOT

  yield non-zero fitness under DisplacementConsistencyFitness(max_bit_threshold=12)

  — even directly evaluated (without projection), they grow to 66+ bits. The

  iter_215 rules were optimized under LateWindowDisplacementFitness which has no

  bit-budget constraint, and most are not C2-symmetric, so symmetrization

  amplifies the bit explosion. The GA then explores from fitness 0 and at

  generation 48 mutation finally lands on a rule with a stable 4-bit C2-symmetric

  glider moving at v≈0.107c diagonally NE. The glider is verified stable over

  500 steps (no extinction, bit count locked at 4, period 1). Fitness (0.06)

  is well below the 1.0/2.0 target because the late discovery left only 2

  generations to refine, and per-window velocity variance is high due to a CoM

  wrap-around averaging artifact around step 192. The output is a genuine

  sub-light glider but the GA needs either better warm-start data (rules

  pre-vetted under the bit-budget) or a less strict early-fitness landscape

  to break out of the all-zero plateau sooner.

  '
