  bound particle, not a non-interacting composite. All three seed bits

  annihilate within ~10 steps when run in isolation, yet the full L-tromino

  seed evolves into a self-sustaining 4-bit propagating structure at v=0.469c.


  The binding mechanism is cooperative survival: the rule has a trivial

  weight-1 sub-table (isolated bits die, state 64 -> 0) but non-additive

