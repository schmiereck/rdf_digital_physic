experimenter_view: "An exhaustive, mathematically complete search of all 128 O_h-symmetric,\
  \ bijective, \nbit-conserving weight-2 sub-tables (with a stationary weight-1 foundation)\
  \ and 40 \nrandomized weight-3+ variants was conducted. Not a single configuration\
  \ supported \na propagating bound state. Every multi-bit seed either disintegrated\
  \ into independent \nstationary oscillators or drifted apart, triggering the F2\
  \ and F3 falsification criteria. \n\nThe 2D hexagonal glider succeeds because 2D\
  \ hex allows isolated bits to die, enforcing \ncooperative survival. In 3D FCC,\
  \ strict per-cell bit conservation prevents isolated bits \nfrom dying, and under\
  \ O_h symmetry, any cooperative propulsion mechanism is frustrated. \nThis establishes\
  \ a definitive null result for single-cell collision models, proving that \nfuture\
  \ phases must transition to multi-site interaction rules to realize stable gliders.\n"
