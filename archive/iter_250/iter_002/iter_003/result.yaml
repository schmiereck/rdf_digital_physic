experimenter_view: 'Verified the correct Cartesian antipodal transposition pairs:
  0↔3, 1↔2, 4↔7, 5↔6, 8↔11, 9↔10.

  Confirmed the additive control LUT built from these pairs is O_h-symmetric, bijective,

  and bit-conserving. Under the additive extension, each of the 4 weight-2 orbits
  maps

  to itself. Demonstrated that a non-additive equivariant orbit-target swap (e.g.,

  rep=3 -> target=48) also preserves all three properties. Identified the 4 weight-2

  orbits with stabilizers of size 4, 8, 2, 2, and confirmed 4×2×4×4=128 valid unique

  configurations. However, the execution was terminated before completing the full

  non_additive_lut_v2.py implementation, the experiment_250_nonadditive_search.py

  search script, the actual exhaustive sweep over 128×66=8448 combinations, and the

  final report generation.

  '
