experimenter_view: "The simplified 'HW(A) > HW(B)' cooling hypothesis is supported:\
  \ 4/100 rules\nresolved the soup to low-density states (325-657 cells). The key\
  \ mechanism is\na cascading death effect triggered when state 64 (isolated live\
  \ cell, the most\ncommon center=1 state at 25% density with ~941 initial occurrences)\
  \ is included\nin the rule. When HW=2 center=1 cells die, their neighbors may become\
  \ isolated;\nif state 64 also maps to dead, those isolated cells also die in subsequent\
  \ steps,\ncreating a chain reaction that reduces density from ~25% to ~3%.\n\nCrucially,\
  \ the naive random selection from all 128 states fails (all CHAOTIC) \nbecause high-HW\
  \ states (HW=4,5) dominate the source pool but are rare at 25%\ndensity. The working\
  \ implementation restricts sources to center=1, HW∈{1,2,3}\n(22 states) and targets\
  \ to center=0, HW∈{0,1} (7 states), ensuring mappings\ntarget common soup states\
  \ and actually kill live cells.\n\nRules without state 64 stabilize at ~1300-2800\
  \ cells (CHAOTIC); rules with\nstate 64→0 trigger cascades that reach 300-700 cells\
  \ (INTERESTING). State 64\nappears in ~4% of rules by chance, explaining the 4/100\
  \ success rate.\n"
log_excerpt: "Initial soup: 5665 live cells (150x150, density=0.25, seed=42)\nGenerating\
