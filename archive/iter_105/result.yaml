  \  rule_029.json: final_count=   331  [INTERESTING] <-- INTERESTING\n  rule_055.json:\
  \ final_count=   657  [INTERESTING] <-- INTERESTING\n  rule_081.json: final_count=\
  \   358  [INTERESTING] <-- INTERESTING\n=== Summary ===\n  DEAD        (< 20): \
  \   0\n  CHAOTIC     (> 1000): 96\n  INTERESTING (20-1000): 4\n"
