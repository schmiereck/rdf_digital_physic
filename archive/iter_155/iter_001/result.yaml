experimenter_view: 'The hypothesis that the 2000-step evaluation would reveal a significant
  fitness

  drop for rule_021 was NOT supported. The new composite fitness (3.557) is

  essentially identical to the original 1000-step score (3.465), a change of only

  -2.65%. The per-window displacement profile clearly confirms the transient-puffer

  character: extremely high velocity in windows 0-500 (2.40, 2.62) followed by a

  dramatic and sustained collapse in windows 500-2000 (0.85, 0.21, 0.41, 0.13, 0.22,

  0.16). However, the composite metric total_displacement / (1 + std_dev) is not

  sensitive enough to penalise this pattern: the large early-window displacements

  dominate the numerator while the std_dev penalty in the denominator remains modest.

  The key implication is that the current fitness function cannot distinguish a

  transient puffer from a sustained mover when the burst is large enough.

  A revised metric — such as scoring only the FINAL N windows, or using the minimum

  per-window velocity, or exponentially discounting early windows — would be needed

  to properly penalise transient behaviour.

  '
