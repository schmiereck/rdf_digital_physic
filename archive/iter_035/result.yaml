notes: 'The orbit-collision between A and B under rotation is the key structural

  reason for failure. Future experiments should select kernel pairs from

  distinct rotation orbits (e.g., A and B have different orbit lengths or

  do not share any orbit element). The existing arrowhead-glider kernel pairs

  from iter_024 (e.g., (4,64)) are from distinct orbits, which is why they

  produced glider behavior.

  '
status: experiment_failed
