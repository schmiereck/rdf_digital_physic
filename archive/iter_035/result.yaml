artifacts:
- src/symmetric_rule_A3_B6.json
- archive/iter_035/result.yaml
experimenter_view: 'The hypothesis is falsified. The rule from kernel (A=3, B=6) produces
  a

  FIXED_POINT: the 2-bit pattern at (49,51),(50,51) never moves or changes.

  Root cause: A=3 and B=6 are in the same 6-fold rotation orbit

  {3,33,48,24,12,6}. The last-write-wins sequential application of 6 rotation

  mappings creates a directed cycle among center=0 states only. Since all

  explicit transitions map to center=0 outputs, no ''0'' cell can turn ''1''.

  The two ''1'' cells (states 96, 68) fall under identity rules and stay ''1''.

  The bit-conservation criterion is satisfied (2 bits throughout), but the

  non-trivial-motion criterion is not. Candidate pairs in the same rotation

  orbit cannot produce dynamics with this rule-generation method.

  '
log_excerpt: "Loaded rule from symmetric_rule_A3_B6.json: 128 mappings\nInitial 2-bit\
  \ seed: [(49, 51), (50, 51)]\nNeighborhood state at (50,50): 3 ('0000011') — expected\
  \ 3 ('0000011')\n  t=  1  bits=2  pos=[(49, 51), (50, 51)]\n  t=  2  bits=2  pos=[(49,\
  \ 51), (50, 51)]\n  t= 10  bits=2  pos=[(49, 51), (50, 51)]\n  t= 50  bits=2  pos=[(49,\
  \ 51), (50, 51)]\n  t=100  bits=2  pos=[(49, 51), (50, 51)]\nbehavior_class:   \
  \ FIXED_POINT\nis_bit_conserving: True\nnet_displacement:  0.0\nall_same:      \
  \    True\nfinal_coords:      [[49, 51], [50, 51]]\nWritten: archive/iter_035/result.yaml\n"
