experimenter_view: 'Exhaustive search over all 10 one-sided tetrahex seeds (rotation-canonical,
  no reflection

  collapse) found no 4-bit glider. A critical discovery: the W=3 rule (A=7, B=14)
  does NOT

  have full dihedral (D6) symmetry — it has only 6-fold rotational (C6) symmetry.
  This means

  the original 7-free-tetrahex approach was insufficient; we correctly tested all
  10 one-sided

  tetrahexes. Of these, only 2 are stable (period-1 still lifes): the straight 4-in-a-line
  and

  a compact Y/diamond shape. All 8 remaining seeds are immediately unstable (bit count
  changes

  in the first step). The 4-bit glider hypothesis is falsified by this complete search.

  The rule seems to support only very specific symmetric still-life configurations
  at 4 bits.

  Future search could explore: (a) 5-bit seeds, (b) seeds that are non-contiguous
  composites

  of two still lifes that interact, or (c) random search over longer initial transients.

  '
