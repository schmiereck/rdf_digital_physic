task: '**Objective: Diagnose the silent crash in the `automata-lib` library.**


  This is a critical platform stability task. The sub-planner in `213.1` and the executor
  in `213.2` both failed, the former due to a silent library crash, the latter due
  to an agent error. Your task is to orchestrate a robust diagnostic process to definitively
  identify the source of the `automata-lib` crash.


  **Methodology: Orchestrated Incremental Probing**


  You will manage a sequence of sub-agents. Each sub-agent will execute one step of
  the diagnostic process.


  1.  **Sub-task 1 (Basic Import):** Launch a `low` complexity agent to create and
  run a Python script that *only* imports from `automata_lib.ca`.

  2.  **Sub-task 2 (Grid Creation):** If the first sub-task succeeds, launch another
  agent to run a script that imports and then creates a simple `HexGrid` instance.

  3.  **Sub-task 3 (Rule Loading):** If successful, launch an agent to load a known-good
  rule file (`g10_rule_001.json`).

  4.  **Sub-task 4 (Single Step):** Continue this incremental process, adding `grid.seed(...)`
  and finally `grid.step()`, until a sub-agent fails by reproducing the silent crash.


  **Your Goal:**

  Your final report must pinpoint which specific sub-task in the sequence failed.
  You must provide the exact script (`src/minimal_crash_example.py`) that reliably
  triggers the crash. This script will be the definitive artifact used to guide the
  subsequent repair task. If all sub-tasks fail for agent-related reasons, you must
  report this as the primary finding.

