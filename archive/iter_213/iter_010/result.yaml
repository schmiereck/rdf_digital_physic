analysis: 'This planner task aimed to discover a stable, `v<c` glider by leveraging
  the robust `NetDisplacementFitness` function developed in `iter_204`. The investigation
  proceeded in two phases: a full evolutionary search, followed by a rigorous characterization
  of the resulting champion.


  1.  **Evolutionary Search (213.10.1):** The search ran for 15 generations and quickly
  converged on a champion rule with a fitness of `0.1179`. The rapid convergence suggested
  the search had found a local optimum.


  2.  **Champion Characterization (213.10.2):** A 1000-step analysis of the champion
  rule definitively proved it was **not a glider**. The object is a compact oscillator
  that undergoes a small, one-time "settling" transient, shifting its center of mass
  by ~0.47 cells within the first 100 steps. For the remaining 900 steps, its net
  displacement was zero.


  **Conclusion:** The `NetDisplacementFitness` function, while robust against previous
  "puffer" and "oscillator" exploits, is vulnerable to a new, more subtle exploit:
  rewarding initial transient drift rather than sustained motion. The search successfully
  found a pattern that maximizes this exploit. The primary research goal was not achieved,
  but a critical new failure mode was identified, paving the way for a more robust
  fitness function in the future.

  '
