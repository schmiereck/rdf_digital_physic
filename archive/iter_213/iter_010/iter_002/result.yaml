experimenter_view: "The champion is definitively NOT a glider. The 1000-step long-run\
  \ reveals:\n1. NET DISPLACEMENT: Only 0.471 cells total over 1000 steps. The entire\n\
  \   CoM shift happened in the first 100 steps (drift_per_100[0]=0.471),\n   with\
  \ zero net displacement in all subsequent 100-step windows. This is\n   a transient\
  \ settling effect, not sustained locomotion.\n2. BIT OSCILLATION: The bit count\
  \ fluctuates between 3 and 4 (min=3,\n   max=4, final=3). The structure is a compact\
  \ oscillator — it breathes\n   between 3 and 4 cells but returns to 3 on each cycle.\n\
  3. VELOCITY: Average velocity of 0.00047 cells/step (~0.47 cells across\n   1000\
  \ steps) is orders of magnitude below any glider threshold. The\n   last-100-step\
  \ mean step displacement is exactly 0.0.\n4. VERDICT: The champion is a compact\
  \ oscillator with an initial transient\n   CoM shift. The fitness of 0.118 was achieved\
  \ by exploiting the\n   measurement window (initial vs. final CoM at t=250) — the\
  \ structure\n   shifted during its settling transient and then froze in place. This\
  \ is\n   a fitness function exploit, not a genuine glider. Future search should\n\
  \   use a fitness function that measures sustained motion (e.g., mean CoM\n   velocity\
  \ over a sliding window, excluding the first N settling steps).\n"
