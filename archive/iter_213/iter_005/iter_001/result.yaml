experimenter_view: 'All 5 top rules (pop indices 0-4, all fitness=2.0) exhibit perfect
  elastic

  collisions under the 500-step independent simulation. The final bit count is 6

  (matching initial) for every rule, and the final inter-glider distance

  (47.5184) equals the initial distance to floating-point precision, confirming

  the gliders fully separate after collision. Minimum distances during collision

  range from 2.24 to 2.92 (deep close approach). The 500-step result is

  consistent with the stored 400-step training metrics, indicating the elastic

  collision behavior is stable and does not degrade with longer simulation.

  The evolutionary run appears to have produced a highly robust population —

  the entire top of the fitness landscape (all at max fitness 2.0) generalizes

  correctly to the extended 500-step test. No rule exhibits fusion, bit loss,

  or partial approach failure.

  '
