experimenter_view: 'The motion produced by rule_016 is NOT sustained over the long
  run. The displacement

  in the primary fitness window (steps 400–800) was large at 40.4 grid units, confirming

  the rule scored well by the Gen-4 metric. However, the displacement in the later
  window

  (steps 1200–1600) was only 17.0 units, giving a velocity_ratio of 0.42 — well below
  the

  0.9 threshold for sustained motion.


  The bit count trajectory tells the same story: the pattern grows from 325 to a peak
  of

  ~1394 bits around t=1200, then decays sharply to 762 at t=1600 and 647 at t=2000.
  This

  decay in live-cell count, combined with the erratic COM trajectory in the later
  phase

  (the COM oscillates rather than drifting directionally), indicates the pattern is
  not a

  true glider but rather a transient expansion event whose coherent motion diminishes
  after

  the first 800 steps. The simulation was stable throughout — no infinite expansion
  or

  chaotic blow-up — but the velocity clearly decays by more than half.

  '
