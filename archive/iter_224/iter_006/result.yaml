experimenter_view: 'The time dilation simulation ran successfully. The glider particle
  (glider_2)

  remained stationary at wrapped position L=20.667 throughout all 31 simulation steps.

  In vacuum, proper time advanced linearly at 1.0 per step (30.0 total). With the

  Gaussian gravitational potential well at l=16 (sigma=3, depth=2.0), the local

  latency was constant at 1.596, since the glider''s distance from the well center

  (dist_l ≈ 4.333) was fixed. This yielded a constant time dilation factor of 1.596x.

  After 30 physical steps, the gravitational simulation accumulated 47.894 units

  of proper time vs 30.0 in vacuum — a total delay of 17.894 steps. The constant

  dilation demonstrates the model''s ability to simulate gravitational time dilation

  as a function of position in the potential well.

  '
