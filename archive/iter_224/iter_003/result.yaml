experimenter_view: 'The O_h symmetry pipeline works end-to-end. Generating 48 signed-permutation

  matrices on the 12 FCC nearest-neighbor vectors yields the 48 expected

  channel permutations, and the orbit decomposition produces 144 orbits with

  sizes that all divide 48 (orbit-stabilizer theorem ✓). The Hamming-weight

  histogram is symmetric around weight 6 as expected for a 12-bit space under

  a self-dual symmetry group.


  generate_symmetric_lut() pools orbits by (weight, size, stabilizer

  conjugacy class) and randomly matches them, then for each matched pair

  builds an equivariant bijection f(g·r) = g·t with Stab(r) = Stab(t). The

  verifier confirms bijection, bit conservation, and equivariance under all

  48 permutations on every random seed.


  The glider search swept 24 symmetric LUTs × 10 random ≤6-bit local seeds

  (240 trials total) and found 4 stable, bounded, moving particles. All four

  move at the maximum lattice speed: rank-2 is a clean (3-bit, max_ext=2)

  glider streaming along channel 3 at v=c; the other three carry a tangential

  component giving diagonal motion (e.g. [50, 0, 100] over 100 steps). Bit

  count is exactly conserved over all 100 steps in every candidate (this is

  guaranteed by the LUT construction). The extent stays ≤4, so the particles

  do not expand or decay.


  These appear to be "free-streaming" sub-configurations whose channel

  pattern lies in an orbit that the LUT happens to map back into a

  translation-compatible state — i.e. the LUT acts trivially enough on the

  particle that streaming dominates. Finding sub-light (v<c) gliders would

  likely require either richer perturbations of within-orbit matching or

  seeds that span more channels per cell so the LUT actually mixes them.

  '
