experimenter_view: 'The simulation successfully demonstrates gravitational time dilation
  along the c-axis.

  The Gaussian potential well (center c=8.0, sigma=2.0, A=2.0) creates a region of

  increased latency where the glider''s coordinate velocity drops significantly. At

  closest approach to the well center, the glider''s velocity decreases from -1.0
  (vacuum)

  to -0.336 (gravity), with a maximum local latency of 2.972 and time dilation factor

  of 2.601. The total accumulated delay after 30 simulation steps is ~18.6 steps,

  showing that proper time progresses substantially slower in the gravitational field.

  The wrapped c-coordinate unwrapping correctly handles boundary crossings at W=16.

  '
