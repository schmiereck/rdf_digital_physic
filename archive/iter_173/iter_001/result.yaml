artifacts:
- src/fitness_stable_velocity.py
- src/evaluate.py
experimenter_view: 'Created fitness_stable_velocity.py implementing StableVelocityFitness
  as

  specified: 2000-step simulation, COM recorded at 5 checkpoints (400,800,

  1200,1600,2000), velocities computed over 4 post-settling windows, final

  formula (mean_v / (1+std_v)) * (initial_bits / final_bits). The

  final_bit_count=0 edge case correctly returns fitness=0. Created evaluate.py

  as a new general-purpose CLI script supporting all three metrics

  (conservation, velocity_stability, StableVelocityFitness) via

  --fitness-metric. Both files import cleanly and produce correct outputs on

  tested rules. The L-tromino seed (3 cells at [(63,63),(64,63),(64,64)]) is

  reused from evolution.py without duplication.

  '
log_excerpt: "=== StableVelocityFitness (identity rule) ===\n  fitness: 0.0\n  mean_velocity:\
