experimenter_view: 'Evolution worked mechanically but did not reach the > 0.5 fitness
  goal in 3

  generations. Clear, monotonic improvement is visible: max fitness rose Gen0

  -> Gen1 (0.109 -> 0.274) and held in Gen2; mean climbed 0.002 -> 0.020 ->

  0.102, a ~47x increase, confirming the elite-breeding loop is moving the

  population mass in the right direction. The Gen-2 champion (g2_rule_001, a

  16-entry C2 rule built from 8 swap pairs) shows real but unstable motion:

  per-window displacements [4.57, 5.35, 14.44, 2.34] give mean_velocity=6.67

  but std_dev=4.62, so the (mean / (1 + std)) factor caps it at ~1.19, and

  growth to 13 bits drags it down by another 3/13. The rule is moving and

  surviving, just not coherently enough — StableVelocityFitness is doing

  exactly what it was designed to do: it refuses to reward incoherent drift

  even when mean velocity is high. Gen-1 and Gen-2 share the same max, which

  suggests the elite plateau is dominated by direct elitist carryover plus

  near-clones; more generations and/or higher mutation diversity will likely

  be needed to push past 0.5.

  '
