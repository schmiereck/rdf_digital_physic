  \ ===\nInitial count: 2, positions: [(25, 25), (26, 25)]\n  t=   1     2  [(26,\
  \ 24), (26, 25)]\n  t=   2     2  [(25, 25), (26, 25)]\n  t=   3     2  [(26, 24),\
  \ (26, 25)]\n  t=   4     2  [(25, 25), (26, 25)]\nFinal: count=2, positions=[(25,\
