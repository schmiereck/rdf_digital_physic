notes: Composite two-condition swap rule produces a stable period-2 oscillator from
  the two-bit seed; the hypothesis that it generates a glider is falsified. Breaking
  the restoration symmetry (e.g. using a third direction in condition 2, or a different
  sweep order) would be needed to produce net translation.
