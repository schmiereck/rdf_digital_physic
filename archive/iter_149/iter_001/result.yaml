experimenter_view: 'The velocity-stability metric was implemented in src/fitness.py
  and validated in

  src/validate_metric.py against rule_016 from iter_142 (primary paths iter_135/iter_132

  did not exist). The metric uses total COM displacement per 400-step window as the

  velocity proxy — using per-step velocity would have given std_dev ~ 0.04 and fitness
  ~

  0.96, which would have failed the criterion; the per-window measurement keeps std_dev

  on the intended discriminating scale. Rule_016 shows highly erratic motion: large
  initial

  displacement (~49 cells in window 0) that drops sharply in window 2 (~7 cells) before

  partial recovery. This produces std_dev = 16.9 and fitness = 0.056 < 0.1, confirming
  the

  hypothesis. Bit count also oscillates wildly (325 → 934 → 1186 → 1394 → 762), consistent

  with the known instability of this rule''s dynamics.

  '
