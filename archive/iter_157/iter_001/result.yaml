experimenter_view: 'Late-displacement fitness (COM Euclidean distance t=1200->t=2000)
  was applied to

  a fresh population of 100 random C2-symmetric rules (seed=157) on a 150x150 grid

  (soup density=0.25, seed=42) for 2000 steps. The majority of rules (56/100) had

  fitness=0.0, indicating the COM was fully static in the late window — these rules

  froze or annihilated by t=1200. Only 3 rules exceeded the viable threshold of 0.1:

  rule_025 (0.1429), rule_068 (0.1147), and rule_019 (0.1125). The 0.2 success

  threshold was NOT met — no rule from this random seed produced sufficient late-phase

  displacement. The late-displacement metric is highly selective: it rewards only

  rules that maintain active motion into the 1200-2000 step window, excluding

  transient puffers that exhaust themselves early. This sparse reward signal (3/100

  viable) suggests the next iteration should either use elitist breeding from these

  3 survivors or try a different initialization seed to find rules closer to the

  threshold.

  '
