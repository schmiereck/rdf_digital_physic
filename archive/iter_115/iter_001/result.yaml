experimenter_view: 'Exhaustively enumerated every canonical connected hex polyhex
  of sizes

  n=3..7 (deduplicated by translation + C2 rotation, matching the actual

  symmetry group of the iter_105 rules) and simulated each under all four

  interesting cooling rules. Cycle detection used the translate-normalised

  set of live cells as a hash; centre-of-mass displacement over one cycle

  period distinguishes oscillators (disp=0) from gliders (disp>0).


  Result: glider_found = false across all 9676 seeds. Every non-extinct

  trajectory settled into a period-1 still life with zero displacement.

  Crucially, an audit of the rule files confirms this is not just an

  empirical finding but a mathematical certainty: each of the four rules

  contains only death mappings (15, 15, 15, 14 respectively) and ZERO

  birth mappings. Under such a rule the live-cell count is monotonically

  non-increasing, so no pattern can sustain the alternation between

  death and birth required by a glider. The "cooling" trajectories of

  iter_105 (final live-cell counts of 20-1000 from a 25%-density soup)

  end exclusively in still-life ash, never in moving structures.


  This is the definitive validation that the iter_110 glider claim was

  spurious: the rules themselves preclude gliders by construction.

  '
