experimenter_view: 'DisplacementOverBoundingBoxFitness successfully defends against
  the puffer

  exploit: the champion rule maintained a max bounding-box diagonal of only

  2.828 (a 2x2 cell footprint), meaning the search never found a rule that

  inflated its bounding box to boost fitness.


  However, the function fell into a different local optimum: a compact

  oscillator. The champion achieves a cumulative CoM displacement of 148.99

  over 200 steps (averaging ~0.75/step) while its bounding box stays tiny.

  But the net displacement over 512 steps is only 0.333 — the pattern oscillates

  in place, accumulating cumulative_displacement through tiny wobbles rather

  than coherent translational motion. This is the phase-sampling exploit

  (iter_201) in disguise: instead of moving once then stopping, the rule moves

  back and forth continuously, accumulating step-by-step displacement with

  near-zero net translation.


  Fitness plateaued at gen 1 (38.917) and the population rapidly converged

  there (mean rose from 0.15 → 35 by gen 6), indicating a strong, easily

  discovered attractor. No rule with genuine glider-like translation was found.


  Root cause: the formula rewards cumulative (step-by-step) displacement, not

  net displacement. A compact oscillator maximises the ratio because it keeps

  the denominator small (tight bounding box) and accumulates a large numerator

  (many tiny oscillatory steps). Replacing cumulative_displacement with

  net_displacement (start-to-end CoM distance) would close this loophole while

  retaining the puffer defence.

  '
