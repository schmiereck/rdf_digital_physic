experimenter_view: 'Fitness improved 41× over 3 generations (950 → 39084). The jump
  from

  Gen 0→1 (5.5×) and Gen 1→2 (7.2×) was rapid; Gen 2→3 plateaued (1.03×),

  suggesting the population may be converging near a local optimum.


  The dominant evolved phenotype is not a "moving particle" in the glider

  sense — it is an explosive growth rule: the L-tromino seed expands to

  thousands of bits (3 → 5279) while the centre of mass drifts 22 cells.

  The conservation-aware fitness formula rewards bit growth equally with

  displacement, so the search found a high-fitness attractor by maximising

  both. This reveals a tension in the fitness formula: rules that grow the

  CA state unboundedly will outcompete true particle movers.


  Breeding (elitism + mutation + crossover) worked cleanly: all C2-symmetry

  constraints were maintained throughout, and all 400 rule evaluations

  completed without errors.

  '
