experimenter_view: 'The Gen-3 top rule (g3_rule_021, fitness=39084) does NOT produce
  a glider.

  Instead, it triggers an asymmetric explosive growth: the 3-bit L-tromino

  expands to 5279 bits within ~200 steps, shifting the center-of-mass ~22 cells

  off the starting position. After this transient, the pattern reaches a static

  fixed-point and is completely frozen for the remaining 800 steps (bit count

  constant at 5279, displacement change < 0.005). The motion is a one-time

  displacement event, not sustained travel. The fitness metric rewards

  displacement × bit_ratio, so evolution found a "big-bang" rule — maximum

  surviving structure + maximum asymmetric expansion — rather than a compact

  travelling particle. For future iterations, a velocity-based fitness

  (sustained COM drift over time) would be needed to select for true glider

  behaviour.

  '
