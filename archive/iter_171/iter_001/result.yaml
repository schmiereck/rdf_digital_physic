experimenter_view: 'The conservation-aware fitness metric (displacement * final_bit_count
  /

  initial_bit_count) produces a well-distributed, non-degenerate population.

  30 of 100 random C2-symmetric rules score above 0.01. The metric cleanly

  gives 0 to the ~70 rules whose L-tromino stays frozen (displacement=0). No

  annihilating rules (final_bit_count=0) appeared in this sample; if they had,

  the ratio term would collapse their fitness to ≈0 regardless of displacement.

  The top rules (rule_048, rule_056, rule_093) score ~950 by combining

  large displacement (≈15 cells) with significant bit growth (191-192 bits),

  indicating they expand the seed. This is a different selection pressure than

  a "clean glider" metric but it correctly filters out the annihilation exploit

  that rewarded the old formula''s (1 + final_bit_count) denominator.

  '
