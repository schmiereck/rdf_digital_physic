experimenter_view: "The framework is built and runs end-to-end. CollisionFitness on\
  \ the\nidentity rule yields 1.0 (gliders stay put -> 6 bits, 2 objects) which\n\
  validates the formula plumbing. The GA also runs cleanly: population\ninitialisation\
  \ with 8-pair C2 rules, top-10% elitism, two-point crossover,\nper-bit mutation,\
  \ parallel evaluation, JSON dump.\n\nHowever, the fitness formula provided in the\
  \ task is mathematically\nunbounded above 1.0 and is maximised by ANNIHILATION,\
  \ not by elastic\ncollision. With (initial/final) * (2/objects), shrinking to (1\
  \ bit,\n1 object) scores (6/1)*(2/1)=12.0 — twelve times the \"ideal\" elastic\n\
  score the task labels as 1.0. The GA immediately discovered this\ndegenerate optimum\
  \ by generation 1, and the population converged on\nrules that collapse the gliders\
  \ into a single live cell. To actually\nreward elastic dynamics, the next iteration\
  \ should switch to a\nsymmetric / clipped form such as\n  min(init/final, final/init)\
  \ * min(2/objs, objs/2)\nor equivalent, so the score truly peaks at 1.0.\n"
