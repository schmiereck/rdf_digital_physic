experimenter_view: 'The pre-registered hypothesis was refuted. Opposite-chirality
  (particle-

  antiparticle) collisions under LUT-08 do NOT annihilate; instead, all 5

  tested impact parameters produced perfectly elastic scattering with both

  4-bit gliders emerging intact. Surprisingly, same-chirality collisions

  (the control) were destructive (Partial or Chaotic), which is the

  opposite of the expected elastic particle-particle behavior. The O_h

  covariance test also failed: rotating the head-on setup through a proper

  O_h element changed the outcome from Elastic to Chaotic, confirming the

  collision dynamics are lattice-axis artifacts rather than robust physical

  effects. The P-reflected glider''s solo stability is constructionally

  guaranteed by O_h symmetry and was verified empirically.

  '
