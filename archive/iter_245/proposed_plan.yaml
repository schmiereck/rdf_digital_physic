falsification_criterion: "The hypothesis is refuted if ANY of the following hold:\n\
  1. The CPT-conjugate glider is not bit-conserving during solo propagation\n   over\
  \ ≥80 steps (bit count deviates from 4 at any step).\n2. In ≥3 out of 5 head-on\
  \ particle-antiparticle collision configurations,\n   the residual non-propagating\
  \ bit count exceeds 2 after the interaction\n   completes (i.e., annihilation is\
  \ not \"clean\").\n3. Particle-antiparticle collisions show the same elastic-scattering\
  \ outcome\n   as particle-particle collisions (no qualitative matter-antimatter\n\
  \   distinction), with both gliders emerging intact post-collision.\n4. The collision\
  \ outcome is not O_h-covariant: rotating the collision axis\n   through one O_h\
  \ symmetry element changes the outcome from annihilation\n   to elastic scattering,\
  \ indicating a lattice-axis artifact rather than\n   genuine physics.\n"
hypothesis: 'The CPT-conjugate of the LUT-08 sub-light glider (obtained by spatial
  reflection

  of its 4-bit pattern, yielding opposite chirality and reversed velocity) is a

  stable, bit-conserving sub-light glider under the forward LUT-08 rule. When a

  LUT-08 particle and its CPT-antiparticle undergo head-on collision, they

  annihilate cleanly (≤2 residual non-propagating bits, total bit count conserved

  at 8), producing exclusively v=1c single-bit propagating states. This outcome

  qualitatively differs from same-chirality particle-particle collisions, which

  scatter elastically (as established in iter_242).

  '
pre_registration_file: src/pre_registration.md
proposed_method: "Step 1: Construct CPT-antiparticle pattern.\n  - Load the LUT-08\
  \ glider JSON from iter_224 archive.\n  - Apply spatial reflection (invert one Cartesian\
  \ coordinate) to obtain\n    the enantiomeric 4-bit pattern. This is the CPT-conjugate\
  \ seed.\n  - Place it with velocity directed toward the original glider's approach\
  \ path.\n\nStep 2: Verify CPT-conjugate solo stability (CONTROL A).\n  - Run the\
  \ reflected glider alone on a 32³ FCC grid for 80 steps under\n    the forward LUT-08\
  \ rule.\n  - Measure: bit count at each step, center-of-mass velocity, chirality\n\
  \    sequence. Must be 4 bits throughout, sub-light velocity, opposite\n    chirality\
  \ to the original.\n\nStep 3: Run particle-particle elastic collision (CONTROL B\
  \ — replicate iter_242).\n  - Place two SAME-chirality LUT-08 gliders on head-on\
  \ collision course.\n  - Run for 80+ steps. Confirm elastic scattering (both gliders\
  \ emerge\n    intact). This validates the platform against known results.\n\nStep\
  \ 4: Run particle-antiparticle head-on collisions (EXPERIMENT).\n  - 5 collision\
  \ configurations with different impact parameters (offset\n    distances 0, 1, 2,\
  \ 3, 4 lattice units perpendicular to collision axis).\n  - For each: place LUT-08\
  \ particle and CPT-antiparticle on head-on course\n    on a 32³ grid. Run for 80+\
  \ steps.\n  - Measure at each step: total bit count, chirality sum, number of\n\
  \    propagating v=1c single-bit states, number of residual non-propagating\n  \
  \  bits, sub-lattice occupancy.\n\nStep 5: O_h covariance test.\n  - Take the collision\
  \ configuration that shows the strongest annihilation\n    signal (if any). Rotate\
  \ the collision axis through one non-trivial\n    O_h element (e.g., swap two Cartesian\
  \ axes). Re-run.\n  - If the outcome changes qualitatively (annihilation → elastic),\
  \ the\n    effect is a lattice-axis artifact and the hypothesis is refuted.\n\n\
  Step 6: Analyze and report.\n  - Compare particle-antiparticle outcomes against\
  \ particle-particle control.\n  - If annihilation is observed: characterize products\
  \ (bit count, velocity,\n    chirality of products). Check total chirality = 0 (particle+antiparticle\n\
  \    have equal and opposite chirality, so sum should be 0 before and after).\n\
  \  - If no annihilation (elastic scattering): document as null result. The\n   \
  \ enantiomeric glider is still an \"antiparticle\" in the CPT sense, but\n    annihilation\
  \ is not among its physical consequences on this lattice.\n\nFiles to create/modify:\n\
  - src/phase7_3_antiparticle.py: main experiment script (construct CPT-conjugate,\n\
  \  run solo stability, run collisions, run O_h test)\n- src/pre_registration.md:\
  \ this plan document\n- src/phase7_3_analysis.py: post-processing and comparison\
  \ against controls\n\nKey parameters (declared in advance):\n- Grid: 32³ FCC (sufficient\
  \ per iter_232 Cavendish test precedent)\n- Steps: 80 per run\n- Impact parameters:\
  \ 0, 1, 2, 3, 4 lattice units\n- Clean annihilation threshold: ≤2 residual non-propagating\
  \ bits\n- O_h test: one non-trivial rotation (axis swap)\n"
