experimenter_view: 'First-class null result for N-body binding at the Phase 5.3 envelope.

  The closed-loop coordinate-latency field (eta=2.0, sigma=2.5, gamma=0.9,

  threshold=0.045, alpha=2.0, LUT-08 glider) does NOT extend the 2-body

  bound-state behaviour observed in iter_235 to 3- or 4-body

  configurations. Across all four (config x perm) active runs, the

  time-averaged torus-correct max pair distance is 2.67 to 6.75 lattice

  units LARGER than the matched vacuum control — i.e. the latency field

  is dispersive, not binding, for N >= 3 at this envelope.


  The only run that achieved a *Captured* verdict (mean max pair dist

  <= L/3 = 10.67) was 3-body Permutation 10 with eta=0 (vacuum control).

  Because there is no latency field in that case, the localization must

  be attributed to ballistic alignment of the rotated glider''s

  lattice-direction velocities on the torus — an orientation-dependent

  recurrence effect, not coordinate-latency binding. This suggests the

  iter_235 2-body "bound state" was most parsimoniously the same

  ballistic-recurrence artefact rather than emergent gravitational-like

  binding.


  All 14 simulations preserved bit count (4*N) at every step;

  falsification criteria F1 (bit drift) and F3 (coalescence singularity)

  were not triggered. Criterion F2 (dispersion exceeds vacuum control) is

  triggered in a qualitative sense for all four active configurations:

  the active runs are *more* dispersive than their vacuum baselines,

  though we cannot fit a 1-sigma noise band without repeated trials.


  The escape-velocity probe (third_offset = 4..14, Perm 0, eta=2.0) shows

  monotonically growing mean max pair distance with no sharp transition;

  there is no extractable binding-energy-like threshold at this envelope.


  Recommendation for next iteration: either (a) widen the parameter

  envelope (this is explicitly prohibited by the Manager''s note absent an

  a priori physical justification), or (b) treat the iter_235 result as

  an orientation-dependent ballistic recurrence rather than a

  gravitational-like binding, and design Phase 5.5 around that

  re-interpretation.

  '
