rationale: The experiment was a direct test of the new fitness function with a previously
  successful evolutionary strategy. The result was a complete failure across all 11
  generations, with every individual scoring a fitness of 0. This strongly indicates
  a fundamental problem with the fitness landscape created by the function, rather
  than a need for more search time. The next logical step is to address the fitness
  function itself.
state_update: 'Phase: Focused Exploration


  ## Goal

  Discover a stable, bit-conserving `v<c` (sub-light speed) glider.


  ## Confirmed

  - The `SubLightFitness` function correctly identifies and rejects `v=c` gliders
  and stationary patterns (iter_216).


  ## Refuted

  - An evolutionary search using the `SubLightFitness` function and a warm-start population
  of `v=c` gliders is **not** sufficient to find a `v<c` glider. The resulting fitness
  landscape is flat (all-zero fitness), providing no gradient for the search (iter_217).


  ## Current Best

  - No `v<c` glider has been found.


  ## Open Questions

  - Can a fitness function that rewards partial success (e.g., near bit-conservation)
  create a searchable gradient?

  - Is there a different starting population that would be more effective for finding
  v<c gliders?

  - Are there fundamental reasons why small, simple rules struggle to produce stable
  v<c gliders?

  '
