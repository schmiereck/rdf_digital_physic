analysis: 'The evolutionary search using the `SubLightFitness` function and a warm-start
  population from `iter_215` failed to find a sub-light speed glider. The experiment
  ran for 11 generations, and every individual in the population scored a fitness
  of 0. The fitness function, while correctly rejecting `v=c` gliders and stationary
  patterns, provided no gradient for the evolutionary algorithm to optimize. The search
  space appears to be flat from the perspective of the current fitness function. The
  primary failure modes were violations of bit conservation (50-69%) and lack of displacement
  (31-50%), indicating that the rules tested were either unstable or produced stationary
  patterns. The warm-start population, which was successful for finding `v=c` gliders,
  seems to be in a region of the search space that is distant from any `v<c` solutions,
  and the fitness function provides no path to get there.

  '
