  gradient for the evolutionary algorithm to climb, resulting in zero progress.

  '
chosen_direction: Report the failure and re-evaluate the fitness function design.
  The current function is too punitive and provides no gradient for the search.
experimenter_view: 'The evolutionary search ran for 11 generations with population
  size 100,

  starting from a warm-start of 100 individuals loaded from iter_215.

  Every individual scored fitness=0 across all generations.

  Main failure modes: bit_conservation_failed (50–69%) and no_displacement (31–50%).

  A tiny fraction (1 individual/gen) reached velocity_at_or_above_threshold

  but still didn''t produce a valid glider.

  The rule space may need rebalancing or a different fitness landscape.

  '
hypothesis: 'CONVERGED: The `SubLightFitness` function, when combined with a warm-start
  population of known v=c gliders and their mutants, is insufficient to discover a
  v<c glider because it creates a fitness landscape with no gradient.'
