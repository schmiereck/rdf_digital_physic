experimenter_view: 'Script created at src/run_iter_217_sublight_search.py.

  It combines the warm-start population from archive/iter_215/results/warm_start_population.json

  (100 individuals: iter_213/176/153 champions + per-bit mutants) with SubLightFitness

  from src/fitness_functions.py (vel<0.9 gate + period>1 gate strictly enforced).

  The GA runs for up to 10 generations with elite_fraction=0.10, crossover_rate=0.80,

  mutation_rate=0.01. Halts early if fitness>0. Smoke tests confirm imports work and

  the fitness gates fire correctly on warm-start seeds (no_displacement / bit_conservation_failed).

  Champion artifacts saved to archive/iter_217/results/ on success;

  best_failure.json saved if no glider found. Final YAML printed to stdout.

  '
