experimenter_view: 'The final grid at t=2000 is a completely diffuse, salt-and-pepper
  pattern of

  roughly 4265 live cells scattered quasi-randomly across the entire 128x128

  domain. There is no compact object, no moving structure, no coherent region

  of activity — only uniform chaotic ash. The center of mass moved only ~0.066

  grid units between t=1200 and t=2000, indicating the rule has settled into a

  spatially-frozen random steady state with no net drift.


  The composite metric (late_displacement / (1 + final_bit_count)) correctly

  penalizes this behavior: the denominator 4266 reduces the already-tiny

  displacement score by three orders of magnitude, yielding composite_fitness =

  0.0000155. A genuine glider would have a small final_bit_count (e.g., <20)

  and a large displacement, giving a score orders of magnitude higher.


  Conclusion: the composite metric successfully identifies rule_058 as a

  non-compact, non-moving rule and assigns it a near-zero fitness score.

  '
