experimenter_view: 'Gen-2 evolution using the composite metric total_displacement
  / (1 + std_dev)

  produced a clear fitness improvement over the Gen-1 random baseline. Selecting

  the top 10% (10 rules) of Gen-1 as elite parents and breeding 100 offspring via

  C2-symmetric kernel crossover and mutation raised the mean population fitness from

  0.4517 to 0.6094 (+34.9%). The two carried elites (rule_001, rule_002) retained

  their Gen-1 scores (1.179, 1.030). The highest new offspring was rule_025 at

  1.3200 composite fitness (total_displacement=3.081, std_dev=1.334), surpassing

  the previous generation''s best of 1.179. The median rose from 0.425 to 0.584,

  indicating the improvement is broad across the population, not just at the

  extremes. The evolutionary pressure is working as expected: offspring from

  high-displacement parents tend to have higher displacements themselves, while

  the std_dev penalty still filters out erratic rules.

  '
