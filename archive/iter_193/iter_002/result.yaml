experimenter_view: 'RecessionBiasedFitness produced a decisive result: the champion
  reached the

  theoretical maximum fitness of 2.0, meaning approach + full recession to the

  original separation + perfect bit conservation (bit_error=0). The fusion

  baseline (1.0 / (1 + bit_error) ≈ 1.0 for a 0-error fusion) is exceeded by

  100%; the rule cleanly bounces the two 3-bit L-trominos rather than merging

  them. The continuous recession_score gradient appears to be the key

  improvement over StagedCollisionFitness: the first non-zero generation

  reached 0.4 (partial recession with no bit error), then mutation discovered

  full recession at gen 6, after which the elite quickly proliferated — 41/100

  individuals score 2.0 by gen 10. To enable RecessionBiasedFitness via the

  main script, run_evolution.py was extended with --fitness_class and

  --final_population_path CLI args; the warm-start population (iter_191) was

  loaded unchanged. The two-glider seed is implicit in the fitness class''s

  _make_staged_grid (the task''s seeds/collision_6bit.json reference is a

  semantic label — the file is not on disk and is not loaded directly).

  '
