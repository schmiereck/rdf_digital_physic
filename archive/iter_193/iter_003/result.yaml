experimenter_view: 'The champion rule from iter_193.2 fully reproduces its perfect
  fitness=2.0

  score over 500 steps. The two 3-bit L-trominos approach (min_distance=2.24,

  within ~1 cell), interact, and then fully recede to exactly their initial

  separation distance (47.518), with zero bit error throughout. The step-100

  distance (47.52) equals the initial, confirming the gliders are still moving

  apart periodically at step 100; at step 200 they have overshot to 81.30 (the

  far side of the toroidal grid) and return symmetrically to 47.52 by step 400.

  The GIF visually confirms a clean elastic collision: two compact gliders

  approach, momentarily merge to a single near-contact cluster, then re-emerge

  as identical independent objects moving in opposite directions.

  '
