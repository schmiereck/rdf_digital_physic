experimenter_view: 'The two-stage pipeline produced no gliders or oscillators. Stage
  1 (rule_023)

  resolved the 25%-density soup to a stable ash of 325 live cells (72 connected

  components) in under 200 steps. Stage 2 (symmetric_rule_nonconserving_A3_B14)

  caused only 3 births and no deaths, then froze: the ash shapes are

  simultaneously still-lifes under both rules, so switching rules did not trigger

  any dynamic behaviour. The hypothesis — that the glider-friendly rule would

  animate the structured ash — is falsified for this particular rule pair and

  initial condition. A follow-up could try: (a) adding small random perturbations

  to the ash before switching rules, or (b) seeding the ash grid with known

  glider seeds for the motion rule at the locations of isolated ash objects.

  '
