experimenter_view: 'A valid non-conserving kernel pair (A,B) with popcount(A)=2, popcount(B)=3
  exists and was

  found immediately (4th pair checked). The key insight is that because rotations
  preserve

  Hamming weight, orbits of W=2 and W=3 states are automatically disjoint; the binding

  constraint is that both states must have orbit size exactly 6 (no rotational symmetry)
  to

  achieve a 12-element joint closure. The found pair A=3 (center+E) and B=14 (E+SE+SW)
  are

  the simplest contiguous representatives of their respective orbit classes.

  '
