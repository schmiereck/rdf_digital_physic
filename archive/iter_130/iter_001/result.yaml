experimenter_view: 'The evolutionary breeding worked decisively. Gen-2 produced 2
  rules that

  beat the Gen-1 top score (rule_034 at 0.03804293 and rule_010 at 0.02839845),

  representing a +37.3% improvement in peak fitness. Viable rule count jumped

  from 2 to 22 out of 100, a 10x increase, suggesting the crossover is

  producing a rich neighbourhood around the elite parents. Many rules appear

  to be near-clones of elite1 (rule_088, fitness=0.02771506 appears 7 times

  identically), indicating the crossover occasionally selects k=8 pairs

  all from elite1 — this is expected uniform crossover behaviour. The top

  rule (rule_034) is a genuine novel variant that outperforms both parents,

  confirming the hypothesis that Gen-2 breeding yields fitness improvement.

  '
