experimenter_view: "The W=3 rule (A=7, B=14) does support a stable, bit-conserving,\
  \ non-trivial\n3-bit object: a straight-line trihex (3 cells in a row, NE direction).\n\
  \nThe object is a STILL_LIFE (period 1). Analytical explanation:\n- A-rotations\
  \ (which would flip a live cell to 0) require center=1 plus 2\n  *consecutive* hex\
  \ neighbors both being 1. In a straight line, the middle\n  cell's two live neighbors\
  \ are in opposite positions (not consecutive), and\n  end cells have only 1 live\
  \ neighbor — so no live cell fires.\n- B-rotations (which would create a new live\
  \ cell) require center=0 plus 3\n  *consecutive* hex neighbors all being 1. With\
  \ only 3 total live cells in\n  a line, no empty cell can ever see 3 consecutive\
  \ live neighbors — so no\n  new cell is born.\nThis makes the straight-line a structurally\
  \ guaranteed still life.\nThe search also confirms that out of 11 unique trihex\
  \ topologies, at least\n1 (and likely more) are stable objects.\n"
log_excerpt: 'Loaded rule: 128 entries

