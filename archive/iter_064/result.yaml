experimenter_view: "The 3-cycle rule (A=7,B=11,C=14) does not appear to support 4-bit\
  \ gliders.\nAn exhaustive search of 16,715 unique 4-bit seed patterns (all contiguous\n\
  tetrahexes, all radius-3 non-contiguous, all new radius-4 patterns) with\nup to\
  \ 600 steps per seed found zero translating objects.\n\nKey observations:\n- 5 of\
  \ the 10 contiguous tetrahex seeds are bit-non-conserving (unstable).\n- The remaining\
  \ stable patterns all settle to period-1 or period-2 cycles.\n- No period-3 objects\
  \ were detected, despite the rule's fundamental period-3 kernel.\n- The 3-cycle\
  \ non-trivial dynamics (7→70→69→7, etc.) require very specific\n  neighbor configurations\
  \ that appear too tightly constrained at 4-bit scale\n  to produce net spatial translation.\n\
  - The rule's conservation is so strong that 88 period-2 oscillators form,\n  but\
  \ none translate — oscillation and translation appear decoupled.\n\nThe 4-bit glider\
  \ hypothesis is rejected. Larger patterns (5+ bits) may be\nneeded for gliders in\
  \ this rule.\n"
