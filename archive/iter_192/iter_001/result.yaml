experimenter_view: 'Strategy A succeeded in its primary goal: the leaky fitness function
  created a

  viable gradient where the hard StagedCollisionFitness had none. The warm-start

  population (all scoring 0 under strict conservation) rapidly evolved non-zero

  fitness; 84/100 individuals scored non-zero by generation 10.


  The population converged firmly at fitness=0.3333 (= 1.0 / (1+2)), corresponding

  to staged_score=1.0 (approach achieved) with bit_error=2. The particles close

  dramatically (d: 47.5 → 3.5) but then remain merged rather than separating,

  and the collision gains 2 bits. The d_mid == d_final suggests the objects fuse

  at midpoint and stay fused.


  The plateau indicates the population has optimized approach but is stuck on two

  sub-problems simultaneously: recession (staged_score=1 → 2) and bit conservation

  (bit_error=2 → 0). Next steps could explore: longer horizons to allow post-fusion

  separation, higher mutation rate to escape the plateau, or a two-stage fitness

  that first rewards recession regardless of conservation.

  '
