experimenter_view: 'Pre-screen found 3268 conserving rules out of 10,000 tested (32.68%
  pass rate),

  a surprisingly high fraction. The explanation lies in the sparse C2 rule structure:

  density=8 overrides at most ~32 of 128 LUT entries (4 per pair due to C2 symmetry),

  leaving the majority as near-identity. Near-identity rules conserve bits trivially

  because the grid barely changes. This is confirmed by the distance telemetry:

  d_initial = d_mid = d_final = 47.518 exactly — the two L-trominos do not move at
  all.


  Consequently, StagedCollisionFitness scores every conserving rule at 0 because

  approach_score = 0 (no motion detected). Evolution in 10 generations finds no

  improvement: all 100 sampled individuals start frozen and remain frozen. Crossover

  and mutation between frozen near-identity chromosomes cannot spontaneously produce

  the long-range dynamic interactions needed for approach behavior.


  Key insight: conservation and motion are orthogonal in the sparse-C2 rule space.

  Conservation is achieved by "doing nothing" (near-identity), while motion requires

  active state transitions that are inherently more likely to violate bit conservation.

  Strategy B (conservation-first) therefore fails for the same reason as Strategy
  A''s

  hard-conservation mode in iter_190: the constraint is too strict to permit the dynamics

  needed for scoring. The leaky approach (iter_192 iter_001, fitness=0.333) remains
  the

  only method that has produced a non-zero score by relaxing the conservation requirement.

  '
