experimenter_view: 'The motion of rule_049 is NOT coherent glider-like motion — it
  is a

  transient expansion into a large stable periodic attractor.


  During steps 0-400, the bit count grows explosively from 325 to a peak of

  ~1092 (step 300), then contracts to a stable value of ~934-935. During this

  transient, the global COM drifts by ~26 units from its initial position,

  accounting for the high fitness scores measured over short windows (100-200

  steps). The high fitness score of 6.55 from iter_140 was a measurement

  artifact of sampling this fast transient drift.


  After step ~400 the system locks into a periodic limit cycle: the bit count

  oscillates between 934 and 935, and the COM cycles among just three very

  close values ((93.68,55.91), (93.70,55.89), (93.71,55.90)), corresponding

  to a spatial oscillation of amplitude <0.05 units. This is a stable

  many-body oscillator, NOT a glider.


  The velocity_decay_ratio of 0.00132 (<<< 0.8 threshold) is unambiguous:

  late-time velocity is 760× slower than early-time, confirming complete

  cessation of net motion. The final bit count (935, ratio 2.88x) is just

  under the 3x explosion threshold, but this represents permanent structural

  growth, not a conserved glider. The text frame at t=1000 shows a dense

  cluster of structures shifted ~9 units in q and ~19 units in r from the

  initial target COM — evidence of a one-time displacement, not ongoing travel.

  '
