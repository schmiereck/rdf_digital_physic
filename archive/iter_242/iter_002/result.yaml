experimenter_view: "The LUT-08 glider's geometric structure carries two independent\
  \ dynamical\ninvariants under FCC sub-lattice analysis:\n(1) chirality chi(t) is\
  \ NOT step-invariant — it alternates between -4 (even\n    steps) and +2 (odd steps),\
  \ revealing a phase-translation symmetry of\n    period 2. The unsigned spectrum\
  \ {|-4|, |+2|} is an O_h-invariant of\n    the glider's orbit.\n(2) The sub-lattice\
  \ charge vector q(t) is also period-2, transitioning by\n    a permutation M = sigma(3,2,1,0)\
  \ that swaps L_0<->L_3 and L_1<->L_2.\n    This involutive permutation (M^2 = I)\
  \ belongs to the Klein 4-group\n    acting on the four FCC sub-lattices.\n(3) Spatial\
  \ reflection (x -> -x) produces a stable mirror-glider whose\n    chirality is exactly\
  \ -chi(t) at every step, confirming chi as a true\n    pseudo-scalar under improper\
  \ rotations. The reflected glider is itself\n    a stable 4-bit FCC glider, so the\
  \ LUT-08 orbit contains both chiral\n    enantiomers. This is the first explicit\
  \ demonstration that the LUT-08\n    glider class carries a Z_2 chirality charge.\n"
