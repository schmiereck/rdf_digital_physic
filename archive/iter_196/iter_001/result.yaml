experimenter_view: 'New src/engine.py introduces BITS_PER_CELL (default 1), HexagonalGrid
  wrapping

  a (H, W, bits_per_cell) numpy array, build_lut() producing a 2^(7N) cell-output

  table, and a generalised step_grid() that packs N bits per cell into a 7N-bit

  neighbourhood index. For N=1 the math collapses byte-for-byte onto the legacy

  fast path (state evolution verified bytewise identical to evolution.step_grid).


  src/rule.py: Rule gains bits_per_cell, caches .lut, exposes neighborhood_key()

  and lookup() that accept either integer cell values or per-cell bit iterables

  ("array or tuple of bit values" requirement).


  src/simulator.py: Particle and Simulator accept bits_per_cell (default 1).

  Multi-bit mode delegates to engine.step_grid; 1-bit mode preserves the legacy

  2D fast path so all 28+ legacy callers remain unaffected.


  src/fitness.py: bits_per_cell kwarg added to every fitness class. Bit

  conservation uses int(grid.sum()) which sums across the new cell dimension

  naturally. Connected-component labelling routes through _occupancy_2d() which

  collapses the bit dim, generalising COM tracking transparently.


  Backward-compatibility validation (BITS_PER_CELL=1, iter_193 champion rule,

  head-on collision at offset=0, 400 steps): all 14 checks pass. The three

  independent code paths (engine HexagonalGrid, legacy evolution.step_grid,

  RecessionBiasedFitness) produce bit-identical bit-count series and

  floating-point-identical distance measurements (delta < 1e-14). The

  physics signature matches iter_195 exactly: initial bits 6, final bits 6,

  min distance sqrt(5) ~ 2.236, perfect elastic recession (|final - initial|

  = 7.11e-15), fitness 2.0, recession_score 1.0.


  An independent bits_per_cell=2 smoke test confirms: HexagonalGrid stores

  per-cell values 0..3 in (H, W, 2) shape; bit_count sums set bits across

  both spatial and bit dimensions; LUT size is 2^14 = 16384; the identity

  (empty) rule preserves the grid through a step; Rule.neighborhood_key

  correctly packs mixed int/iterable inputs into the 7N-bit lookup key.


  The pipeline is now ready for 2-bit/cell experiments aimed at v<c gliders

  with internal oscillation. No existing call site needed updating.

  '
