task: "## Task: Run Full 13-Channel Cooperative Trapping Search and Analysis\n\nYou\
  \ are executing the experimental phase of iteration 251. The infrastructure is already\
  \ built:\n- src/fcc_engine_13ch.py: 13-channel engine (pack/unpack/stream/collide/verify\
