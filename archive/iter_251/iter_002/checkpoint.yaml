  \n#### Step 6: Candidate Analysis\nFor any (LUT, seed) pair that:\n- Survives ≥200\
  \ steps (F1 not triggered for that pair)\n- Has displacement_norm > 1.0 (net motion)\n\
  - Has bit_stability = 1 (bit conservation maintained)\n\nRun extended analysis:\n\
  a) Single-bit decomposition test (T1): Remove each constituent bit individually.\
  \ If removing any bit changes the propagation trajectory or speed, binding energy\
  \ > 0.\nb) O_h covariance test (T3): Run the same seed under all 48 O_h rotations\
