  \ orbit pairing)\n- 500 valid LUT variants generated, all passing bijection/bit-conservation/O_h\
  \ symmetry audits\n\n### CRITICAL MATHEMATICAL FINDING (from sub-goal 251.1)\nCross-orbit\
  \ weight-2 mappings (C↔E, B↔D) are **mathematically impossible** under O_h symmetry\
  \ because the stabilizer subgroups of orbits C and E (and B and D) are non-conjugate.\
  \ This is a theorem — two transitive G-sets are isomorphic iff their stabilizers\
  \ are conjugate. Therefore:\n- ALL 500 LUT variants use weight-2 self-maps only\n\
  - Active channel mixing (F5) must occur through weight-3+ orbit pairings that involve\
  \ the rest channel\n- Update src/pre_registration.md Step 4 to reflect this — remove\
  \ the C↔E requirement and note F5 compliance comes from weight-3+ dynamics\n\n###\
  \ Read Pre-Registration First\nRead src/pre_registration.md and adhere to ALL pre-registered\
  \ hypotheses and falsification criteria (F1–F5).\n\n### Experimental Pipeline (execute\
