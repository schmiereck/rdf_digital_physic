  \ to remove the impossible C↔E requirement. Replace with:\n\"Weight-2 orbit mappings\
  \ are self-maps only (cross-orbit C↔E and B↔D mappings are mathematically impossible\
  \ under O_h due to non-conjugate stabilizer subgroups). F5 compliance must be achieved\
  \ through weight-3+ orbit pairings where rest-channel states map to non-rest-channel\
  \ states and vice versa.\"\n\n#### Step 2: Positive Control (2D Hex)\nRun the known\
  \ 2D hex v=0.469c glider rule for 500 steps and confirm:\n- Binding energy > 0 (single-bit\
  \ decomposition kills all constituent bits)\n- Cooperative survival active (weight-1→0)\n\
  This validates the search methodology. Use src/experiment_250_hex_decomposition.py\
  \ as reference.\n\n#### Step 3: Build Search Script (src/search_13ch.py)\nCreate\
  \ a search script that:\n1. Loads the 500 LUT variants from src/cooperative_lut_13ch.py\
  \ (regenerate them using generate_all_lut_variants)\n2. Defines 30 diverse seeds\
  \ for the 13-channel system:\n   - 5 seeds with 2 adjacent bits including 1 rest\
  \ bit (e.g., cell (12,12,12) with ch0+ch12)\n   - 5 seeds with 2 adjacent bits both\
  \ prop (e.g., cell (12,12,12) with ch0+ch4)\n   - 5 seeds with 3 adjacent bits including\
  \ rest (e.g., ch0+ch4+ch12)\n   - 5 seeds with 3 adjacent bits all prop (e.g., ch0+ch4+ch7)\n\
  \   - 5 seeds with 2-3 bits at non-adjacent cells (separate cells with 1-2 bits\
  \ each)\n   - 5 seeds with 4-5 bits in asymmetric arrangements\n3. For each (LUT,\
  \ seed) pair, runs 300 steps on L=24 FCC toroidal grid\n4. Tracks: unwrapped center-of-mass\
  \ displacement, bit count stability, bounding extent, rest channel occupancy\n5.\
  \ Scores each run by: displacement_norm * bit_stability (where bit_stability = 1\
  \ if final_bits == initial_bits, 0 otherwise)\n6. Records rest channel activity\
  \ (how often ch12 is occupied vs empty across time steps)\n\n#### Step 4: Run 12-Channel\
  \ Control (F4 test)\nCreate and run src/search_12ch_control.py that:\n1. Uses the\
  \ SAME 12-channel O_h-equivariant LUTs (from src/non_additive_lut_v2.py's build_additive_lut\
  \ or generate_symmetric_lut with Cartesian weight-1)\n2. Tests the same prop-only\
  \ seeds (seeds without ch12, adapted to 12 channels)\n3. Uses the same scoring and\
  \ tracking\n4. This tests whether the rest channel specifically enables binding\n\
  \nNote: The 12-channel control uses the same weight-1 mechanism (Cartesian transposition)\
  \ but no rest channel. If 13-channel finds gliders but 12-channel doesn't, the rest\
  \ channel is the enabling factor (F4 not triggered).\n\n#### Step 5: Parametric\
  \ Search Execution\nRun the search. For computational efficiency:\n- Use numpy vectorized\
  \ operations where possible\n- Target: complete all 500 LUTs × 30 seeds × 300 steps\
  \ within 10 minutes\n- If this is too slow, reduce: use 100 LUT variants × 30 seeds\
