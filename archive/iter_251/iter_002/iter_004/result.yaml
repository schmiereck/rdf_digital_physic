experimenter_view: "The 13-channel search completed successfully with highly optimized\
  \ sparse operations.\nSparse circular-mean COM and sparse torus bounding box implementations\
  \ are working correctly\nand providing massive speedups compared to dense alternatives.\n\
  \nKey findings:\n- 97.1% of all runs (2428/2500) produced propagating structures\
  \ with stable bit counts.\n- The top propagating structure (LUT=0, seed=nonadjacent_s1)\
  \ achieved a displacement of\n  323.6 over 300 steps (~1.08 cells/step) with perfect\
  \ bit conservation (2 bits).\n- Cooperative trapping LUTs are highly effective at\
  \ sustaining motion on the FCC lattice.\n- The 12-channel control search still needs\
  \ to be executed, and the JSON serialization\n  error (int64 not serializable) needs\
  \ a trivial fix (default=str or custom encoder).\n- Extended analysis (T1, T3, F5)\
  \ and experiment_report.json synthesis are pending the\n  successful JSON save and\
  \ 12ch control run.\n"
