falsification_criterion: "F1: No multi-bit configuration survives ≥200 steps under\
  \ any tested 13-channel cooperative\n    survival rule variant (sweeping ~500 variants\
  \ × 30 seeds × 300 steps) → cooperative\n    survival infeasible in 3D FCC even\
  \ with rest channel.\nF2: All surviving propagating configurations fail the single-bit\
  \ decomposition test (removing\n    any single bit does not alter the propagation\
  \ trajectory or speed) → survivors are\n    non-interacting composites, rest channel\
  \ insufficient for genuine binding.\nF3: Any discovered glider fails O_h covariance\
  \ under all 48 cuboctahedron rotations →\n    glider is an axis-aligned lattice\
  \ artifact, not a physical particle.\nF4: The 12-channel cooperative survival control\
  \ (weight-1→0, no rest channel) produces\n    genuine multi-bit gliders at the same\
  \ rate as the 13-channel system → rest channel\n    is not the enabling factor for\
  \ binding.\nAny one of F1–F4 being triggered refutes the hypothesis.\n"
hypothesis: 'A 3D FCC LGCA with 13 channels (12 propagation + 1 rest-mass channel)
  and a cooperative

  survival collision rule — where weight-1 states map to 0 (isolated bits die, forcing
  co-location

  for survival) and weight-2+ states have non-additive mappings that can create and
  destroy

  rest-mass bits — produces at least one genuine, dynamically-bound multi-bit glider
  with

  binding energy > 0. The rest channel provides the persistent local interaction that
  was

  structurally absent in the 12-channel system (where every bit must propagate away
  each step,

  making all interactions transient). By allowing bits to remain at a cell across
  multiple time

  steps, the rest channel enables the neighborhood-overlap binding mechanism that
  is confirmed

  to produce the genuine 2D hex v=0.469c glider. The 5 distinct O_h orbit types of
  weight-2

  states (antiparallel, obtuse, perpendicular, acute, rest+prop) provide sufficient
  parametric

  freedom for the cooperative survival dynamics to produce stable propagating bound
  states.

  '
pre_registration_file: src/pre_registration.md
proposed_method: 'Step 1 — Positive Control: Run the known 2D hex v=0.469c glider
  rule and seed for 500 steps.

  Verify glider survival with binding energy > 0 and cooperative survival (weight-1→0)
  active.

  This validates the search methodology against a known positive result.


  Step 2 — FCC-13 Engine: Extend src/fcc_engine.py (or equivalent) from 12 to 13 channels.

  Channel 13 is a rest-mass channel: invariant under O_h rotations, does not shift
  during

  propagation. Collision maps 13-bit states to 13-bit states per cell. Create

  src/fcc_engine_13ch.py.


  Step 3 — O_h Orbit Classification: Classify all weight-2 states of the 13-channel
  system

  into 5 O_h orbit types: (1) antiparallel prop pair, 6 states; (2) obtuse prop pair,
  24

  states; (3) perpendicular prop pair, 12 states; (4) acute prop pair, 24 states;
  (5) rest+prop

  pair, 12 states. Create src/cooperative_lut_13ch.py.


  Step 4 — LUT Parametrization: Fix weight-0→0 and weight-1→0 (cooperative survival).
  For

  each of the 5 weight-2 orbit types, assign one of ~4 output options: Destroy (→weight-0),

  Scatter (→weight-2 same orbit), Create-rest (→weight-2 or 3 including rest channel),

  Swap-to-rest (→weight-2 rest+prop orbit). Filter: require ≥1 Create-rest AND ≥1
  Destroy

  mapping. Weight-3+ uses simplified rules. Yields ~500 viable rule variants.


  Step 5 — Parametric Search: For each rule variant, test 30 diverse seeds (2–5 bits,

  adjacent and non-adjacent, multiple O_h directions) on L=24 FCC toroidal grid. Run
  300 steps.

  Score by sustained_displacement × bit_stability. Create src/search_13ch.py.


  Step 6 — Coherence Protocol: Top 10 candidates → extended 1000-step run on L=32.
  Apply

  Three-Test Coherence Protocol: (T1) single-bit decomposition test, (T2) interaction

  coherence under latency perturbation, (T3) O_h covariance under all 48 rotations.
  Create

  src/coherence_test_13ch.py.


  Step 7 — Control Experiment: Repeat the search on 12-channel FCC with weight-1→0
  (no rest

  channel) using identical seeds and scoring. Compare genuine glider counts with FCC-13
  to

  isolate the effect of the rest channel.

  '
