experimenter_view: 'The 13-channel engine and LUT infrastructure were successfully
  implemented.

  All 500 generated LUTs pass the three mandatory audits (bijection, bit

  conservation, O_h symmetry). However, a rigorous stabilizer analysis proves

  that cross-orbit equivariant bijections between C↔E and B↔D are impossible:

  their stabilizer subgroups are non-conjugate in O_h (e.g., Stab(C) contains

  coordinate-plane reflections while Stab(E) contains diagonal-plane reflections,

  which belong to different conjugacy classes). This is not a code bug but a

  theorem in group theory—two transitive G-sets are isomorphic iff their

  stabilizers are conjugate. Therefore, the C↔E weight-2 swap required by the

  task specification cannot exist under full O_h equivariance. F5 compliance

  must be achieved through weight-3+ orbit pairings that involve the rest

  channel, not through weight-2 cross-orbit mappings.

  '
