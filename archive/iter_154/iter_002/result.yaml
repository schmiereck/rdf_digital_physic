experimenter_view: 'rule_021 exhibits PUFFER dynamics. Starting from a 150x150 random
  soup (density=0.25,

  seed=21) with 5508 live cells, the automaton undergoes rapid initial expansion (reaching

  ~8800 bits by step 100) while its center-of-mass drifts coherently — ~2.4–2.6 cells
  per

  250-step window in the first half of the run. This combination of net translation
  and

  growing cell count is the hallmark of a puffer: the evolving pattern has a "head"
  that

  moves forward and a growing "tail" of debris left behind.


  In the second half (steps 500–1000) the COM motion decelerates sharply to 0.85 then

  0.21 per window, while the live-cell count stabilises near 10000 (1.83× the initial).

  This deceleration is consistent with the fitness profile velocities=2.33;2.30;1.20;0.41

  recorded during the iter_153 evolutionary evaluation on the SOUP_SEED=42 grid. The

  pattern is not a clean glider (bit count is not conserved) nor is it explosively
  growing

  (3× threshold not reached); it is a transient puffer whose coherent motion persists
  for

  roughly 500 steps before being dominated by the expanding debris field.


  The exceptionally high composite fitness (3.465, vs. a Gen-3 mean of ~0.78) arises

  because the first two 400-step windows of the standard evaluation captured the high-

  velocity phase (~2.3 displacement/window), giving a large total_displacement (6.25)

  with only moderate std_dev (0.80), yielding 6.25 / 1.80 ≈ 3.47.

  '
