experimenter_view: "All 3,227 unique canonical non-contiguous 4-bit seeds within hex-radius\
  \ 3 (37\ncells) were tested for up to 500 steps. No gliders were found. The 3,139\
  \ stable\nobjects were all period-1 still lives; the remaining 88 seeds decayed\
  \ to 0 bits.\n\nA complete theoretical analysis explains why 4-bit non-contiguous\
  \ gliders cannot\nexist under rule (A=3, B=14):\n\nThe five possible connected-component\
  \ topologies of a 4-bit non-contiguous seed\nare: (1) four isolated bits, (2) one\
  \ 2-bit cluster + two isolated bits, (3) two\nseparate 2-bit clusters, (4) one 3-bit\
  \ triangle + one isolated bit, (5) one 3-bit\nchain + one isolated bit.\n\nUnder\
  \ the rule: isolated cells survive (neighborhood 64 = identity); cells with\nexactly\
  \ 1 live neighbor die (neighborhoods 65, 66, 68, 72, 80, 96); dead cells\nwith 3\
  \ consecutive live neighbors are born (patterns 7, 14, 28, 35, 49, 56).\n\n- Types\
  \ (1) and (4): Isolated bits and hex triangles are inert still lives. The\n  triangle\
  \ cannot generate birth at any adjacent dead cell (no dead cell can be\n  adjacent\
  \ to all 3 triangle vertices in 3 consecutive directions), and isolated\n  bits\
  \ contribute no dynamics. Result: permanent still life.\n- Type (3): Both 2-cell\
  \ clusters decay simultaneously (each cell has 1 live\n  neighbor → dies). No birth\
  \ occurs because non-adjacent clusters cannot place\n  3 consecutive live neighbors\
  \ at any dead cell without being connected. Result:\n  full decay to 0 bits.\n-\
  \ Type (2): The 2-cell cluster decays, leaving 2 isolated bits → 2-bit still life.\n\
  - Type (5): The chain A-B-C creates birth at dead cell D (adjacent to A,B,C in\n\
  \  3-consecutive directions). End cells A,C die (1 neighbor each); middle B\n  survives;\
  \ D is born. After step 1: {D,B,X}. In step 2, D and B each see the\n  other as\
  \ their sole live neighbor → both die. Only X remains. The X cell cannot\n  prevent\
  \ this because any X placement that would create a step-2 birth event\n  requires\
  \ X to be adjacent to A, B, or C (making the original seed contiguous).\n  Result:\
  \ decay to 1 isolated bit → still life.\n\nThis exhaustive case analysis proves\
  \ that 4-bit non-contiguous seeds cannot\nsustain oscillatory dynamics and thus\
  \ cannot produce gliders under rule A=3,B=14.\nThe hypothesis is refuted. In agreement\
  \ with iter_079 (2-bit) and iter_080 (3-bit),\nsparse non-contiguous seeds of any\
  \ size ≤4 fail to produce gliders under this rule.\n"
