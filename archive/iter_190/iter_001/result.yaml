experimenter_view: "StagedCollisionFitness has been implemented in src/fitness.py\
  \ as specified.\n\nDesign:\n- Two 3-bit L-trominos on a 128x128 toroidal grid (_STAGED_OBJECT_A\
  \ at (60,40)+(61,40)+(60,41),\n  _STAGED_OBJECT_B at (67,87)+(68,87)+(67,88)), matching\
  \ the iter_190 grid layout.\n- Simulation runs for `horizon` (default 400) steps;\
  \ snapshots captured at step 0\n  (t_initial), step `midpoint` (default 200, t_mid),\
  \ and step `horizon` (t_final).\n- Bit conservation is checked at both t_mid and\
  \ t_final against t_initial; any\n  violation causes an immediate return of fitness=0.0.\n\
  - Object detection uses the two largest connected components (8-connectivity) at\
  \ each\n  checkpoint to compute inter-CoM Euclidean distances d_initial, d_mid,\
  \ d_final.\n- MARGIN = 1.0 grid unit prevents floating-point exploits on the binary\
  \ thresholds.\n- approach_score = 1.0 if d_mid < d_initial - MARGIN else 0.0\n-\
  \ recession_score = 1.0 if d_final > d_mid + MARGIN else 0.0\n- fitness = approach_score\
  \ + recession_score (range: {0.0, 1.0, 2.0})\n- Smoke test with identity rule confirms:\
  \ bits conserved=True, fitness=0.0 (objects\n  stationary at identical distances\
  \ throughout), validating the threshold logic.\n"
