artifacts:
- src/fitness_g190.py
- src/run_g190_evolution.py
experimenter_view: 'Both files are implemented and import cleanly.

  fitness_g190.py provides: graded_collision_fitness() (pure function taking three

  grid snapshots) and GradedCollisionFitness class (runs simulation internally,

  snapshots at step 0 / midpoint / final, delegates to the pure function).

  _two_largest_coms() sorts all connected components by cell count and picks the

  top two, satisfying the "two largest objects" requirement even when fragments exist.

  The fitness formula conservation_score * (interaction_score + total_displacement)

  is continuous: a random rule that moves particles but doesn''t collide already

  scores 0.67 vs the flat 0.0 from MarginalDynamicCollisionFitness, confirming the

  gradient exists to guide evolution.

  run_g190_evolution.py mirrors the iter_189 evolution script structure but uses

  GradedCollisionFitness, runs 20 generations (no binary early-stop since scores

  are continuous), and saves the best rule unconditionally; a GIF is rendered only

  when approach + recede + conservation > 0.9 are all satisfied.

  '
