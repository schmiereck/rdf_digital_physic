experimenter_view: 'The swap rule new[q,r] = old[q+1, r] (new center = East neighbor
  b1) is

  algebraically a uniform West-translation of the entire grid by 1 cell per step.

  With a 50-wide periodic grid the single ''1'' orbits back to its start position

  after exactly 50 steps, giving a spatial period of 50, not 2.

  The behavior class is GLIDER (v = -1, 0 in axial coords), not STATIONARY_OSCILLATOR.

  The hypothesis was incorrect: a neighbor-copy rule cannot produce a period-2

  oscillator on a large periodic grid — it requires a reflective or self-inverse

  local rule such that a bit at site A reads from B and B simultaneously reads

  from A, which uniform CA semantics cannot achieve with a simple copy.

  '
log_excerpt: "Grid:          50x50 (axial coords, periodic)\nRule:          Swap Center\
  \ with Neighbor 1 (new center = East neighbor)\nInitial cell:  (25, 25)\nInitial\
  \ count: 1\n  t=   1  count=   1  pos=[(24, 25)]\n  t=   2  count=   1  pos=[(23,\
  \ 25)]\n  t=  10  count=   1  pos=[(15, 25)]\n  t=  20  count=   1  pos=[(5, 25)]\n\
  \  t=  30  count=   1  pos=[(45, 25)]\n  t=  50  count=   1  pos=[(25, 25)]\nis_bit_conserving:\
  \   True\nbehavior_class:      GLIDER\nfinal_bit_count:     1\noscillation_period:\
  \  50\nglider_velocity:     (-1, 0)\n"
metrics:
  final_bit_count: 1
  glider_velocity_q: -1
  glider_velocity_r: 0
  is_bit_conserving: true
  oscillation_period: 50
notes: 'The swap rule is bit-conserving and reversible as predicted, but the dynamics
  are translational (GLIDER, period=50) rather than oscillatory (period=2). A period-2
  stationary oscillator would require either a 2-cell grid or a fundamentally different
  rule structure (e.g., XOR-based or state-dependent).

  '
status: experiment_failed
