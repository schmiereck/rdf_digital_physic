experimenter_view: 'The 5-bit composite glider is confirmed to travel at exactly v=1c
  (1 cell/step

  in the +row/East direction), identical to the original 3-bit L-tromino glider.

  It formed at step 1 because LUT[4]=1 causes the isolated target bit to

  immediately spawn a neighbor before the L-tromino reaches it — the collision

  is effectively instantaneous. The composite remained at exactly 5 bits for

  the entire 850-step run (zero variance in bit count post-formation).


  The com_col is fixed at 64.20 throughout, confirming pure row-direction

  motion with no lateral drift. Apparent CoM anomalies at steps 200, 350, 450,

  600, 850 are explained by exactly 2 of the 5 cells crossing the toroidal

  row boundary, deflecting the naive CoM by 2×128/5=51.2 cells. After applying

  the n_bits-aware boundary correction, every single step-to-step delta equals

  exactly 1.000 cells, giving R²=1.000 and σ=0.000 — a perfectly uniform

  velocity with no jitter whatsoever.


  The 5-bit composite is thus a true v=1c glider: same speed as its parent

  3-bit glider, heavier (+2 bits), and equally stable. This suggests v=1c is

  a dynamical attractor in this rule''s phase space — glider fusion produces a

  heavier glider at the same characteristic velocity.

  '
