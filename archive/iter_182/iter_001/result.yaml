experimenter_view: 'The source .npy file was absent; the 5-bit composite was reconstructed
  by

  running the iter_181.3 collision experiment (L-tromino + single target bit

  on 128x128) for 100 warmup steps, yielding exactly 5 bits.  The two-cluster

  structure of the particle (cells near rows 115-116 and 146-147 after centering)

  produces large apparent CoM jumps in the raw time series, but after applying

  N_BITS-aware toroidal boundary correction every per-step delta equals exactly

  1.000, confirming a perfectly uniform velocity.


  On the 256x256 grid the com_col is fixed at 128.2 for all 800 steps — zero

  lateral drift.  The displacement at each 100-step checkpoint equals exactly

  the step count (100, 200, …, 800), consistent with v = 1.000 cells/step.

  R² = 1.000 and σ = 0.000 confirm there is no jitter whatsoever.


  Conclusion: the 5-bit composite particle is a confirmed stable glider with

  constant velocity v = 1c, identical to its parent 3-bit L-tromino glider.

  The result replicates on the larger 256x256 grid, ruling out any finite-size

  artefact from the original 128x128 run.

  '
