experimenter_view: "Both L-tromino gliders travel East (+row) on parallel tracks separated\
  \ by 54\ncolumns. The bit count is exactly 6 at every step with zero deviation —\
  \ the\ngliders are completely non-interacting at this impact parameter. The CoM\
  \ row\nadvances at precisely 1.000 cell/step, confirming v=1c independent motion,\
  \ and\nthe CoM column remains locked at 127.333 throughout all 300 steps (including\n\
  one full toroidal wrap at step ~128 and a second at step ~256).\n\nThe interaction\
  \ range of g10_rule_001 gliders is strictly ≤1 cell (immediate\nhex neighborhood).\
  \ At 54 cells of lateral separation, the gliders are transparent\nto each other\
  \ — no repulsion, no fusion, no new particles.\n\nContrast:\n  - Head-on (iter_180):\
  \ catastrophic outcome, bits deviate\n  - Constructive fusion (iter_181): glider\
  \ + lone bit → stable 5-bit composite\n  - This experiment: total isolation; the\
  \ \"glancing\" distance is simply too large\n    for the contact-only hex CA rule\
  \ to mediate any interaction.\n\nFor a true glancing interaction, future experiments\
  \ should reduce the column\nseparation to 1–3 cells, or use opposite-direction gliders\
  \ with a small row offset.\n"
