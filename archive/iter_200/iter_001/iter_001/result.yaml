experimenter_view: 'No sustained v<c glider was found in this 15-generation run. The
  champion

  rule (fitness ≈ 0.4714) passes the bit-conservation gate at all 5 checkpoints

  (mean_sparsity = 1.0, final_bits = 3 = initial_bits), but its displacement

  profile is [0.471, 0.0, 0.0, 0.0, 0.0]: the 3-bit L-tromino moves approximately

  0.47 cells during the first 50 steps, then freezes into a still life or

  low-period oscillator for the remaining 200 steps. This is not a v<c glider —

  it is a transient-motion pattern. The fitness plateau (champion constant at

  0.4714 from gen 1 onward, population mean converging to ~0.43) indicates the

  search converged prematurely to a local optimum. A true v<c glider would need

  non-zero displacement at multiple checkpoints. The animation confirms the

  particle settles quickly and shows no translational motion after step ~50.

  Recommended next steps: (1) increase population size and generations, (2) add

  a multi-checkpoint displacement bonus to break the plateau, or (3) use a

  diversity-preserving selection strategy.

  '
