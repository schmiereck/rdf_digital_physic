experimenter_view: 'The fitness improved in clear jumps across the 15 generations:
  a base

  level ~0.47 was found in generation 1 (only 4/100 rules non-zero initially),

  improving to 0.667 in generation 4, then nearly tripling to 1.927 in

  generation 8. After generation 8 the champion fitness plateaued, suggesting

  the search converged to a local optimum within the 15-generation budget.

  The mean fitness rose steadily (0.016 → 0.451), indicating the elite rules

  were effectively propagating motile behaviour through the population.

  The non-zero count peaked around generation 8 (~48/100), then slowly

  declined in later generations as elites dominated, consistent with

  premature convergence. The champion rule is a compact C2-symmetric rule

  with 16 non-identity mappings (8 bidirectional swaps). With SparseGliderFitness

  = displacement × mean_sparsity ≈ 1.927, this implies meaningful centre-of-mass

  displacement of the 3-bit L-tromino that is also preserved compactly (non-

  diffuse). Whether this constitutes a strict periodic glider requires further

  trajectory analysis; the bit-conservation gate passed all checkpoints.

  '
