falsification_criterion: "The hypothesis is REFUTED if, on the L=64 grid with collision\
  \ center at (32,32,32),\nthe O_h-rotated opposite-chirality collision produces a\
  \ qualitatively different\noutcome (Chaotic or Partial) from the unrotated collision\
  \ (Elastic). Specifically:\n\nF1: If the rotated collision outcome classification\
  \ differs from the unrotated\n    classification (using the same Elastic/Partial/Chaotic\
  \ taxonomy as iter_245),\n    the non-covariance is genuine bulk physics, not a\
  \ boundary artifact.\n\nF2: If the unrotated collision itself changes outcome on\
  \ L=64 (i.e., the L=32\n    Elastic result was itself a boundary artifact), then\
  \ the entire iter_245\n    collision catalog is unreliable on L=32 and must be re-characterized.\n\
  \nF3: If the solo stability of either glider variant fails on L=64 (the rotated\n\
  \    glider is not a valid LUT-08 on the larger grid), the comparison is invalid\n\
  \    and the experiment must be re-designed.\n\nA result where both unrotated and\
  \ rotated collisions produce Elastic outcomes\non L=64 would NOT REFUTE the hypothesis,\
  \ and would constitute evidence that\nthe iter_245 non-covariance was a boundary\
  \ artifact.\n"
hypothesis: 'The O_h non-covariance of LUT-08 opposite-chirality collision outcomes
  observed

  on the L=32 toroidal grid in iter_245 (where rotating the collision setup through

  an O_h proper rotation changed the outcome from Elastic to Chaotic) is caused by

  interaction of glider trajectories and collision debris with the periodic boundary.

  On an L=64 FCC grid with collision center at (32,32,32) — ensuring that debris

  cannot reach any boundary within 80 simulation steps — the same O_h-rotated

  opposite-chirality collision will produce the same qualitative outcome (Elastic)

  as the unrotated collision, confirming O_h covariance of collision dynamics in

  the bulk lattice.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "Step-by-step experimental protocol:\n\n1. CREATE src/experiment_246_oh_covariance_64.py\
  \ extending the collision\n   experiment framework from iter_245 (112-line script).\n\
  \n2. CONFIGURE L=64 FCC grid with toroidal boundaries. The collision center\n  \
  \ is at (32,32,32). The LUT-08 glider velocity is sub-light (v < 1 cell/step),\n\
  \   so over 80 steps the maximum displacement is < 80 cells. With center at\n  \
  \ grid center, debris cannot wrap around within the simulation window.\n\n3. IDENTIFY\
  \ the exact O_h rotation used in iter_245 that produced the\n   Chaotic outcome.\
  \ The script must apply the SAME rotation matrix to\n   both glider positions and\
  \ internal bit patterns.\n\n4. RUN three collision configurations on L=64:\n   (a)\
  \ Unrotated opposite-chirality collision: LUT-08 (particle) approaching\n      \
  \ P-reflected LUT-08 (antiparticle) — expected Elastic (reproduces iter_245)\n \
  \  (b) O_h-rotated opposite-chirality collision: same setup rotated through\n  \
  \     the O_h element from iter_245 — was Chaotic on L=32, predicted Elastic on\
  \ L=64\n   (c) Second O_h rotation (e.g., 90° about a different axis): additional\n\
  \       probe for thoroughness — predicted Elastic\n\n5. RUN solo stability controls\
  \ for each glider variant (unrotated particle,\n   unrotated antiparticle, rotated\
  \ particle, rotated antiparticle) on L=64\n   for 80 steps. Verify each propagates\
  \ stably.\n\n6. CLASSIFY outcomes using the same taxonomy as iter_245:\n   - Elastic:\
  \ both gliders emerge intact with 0 residual debris bits\n   - Partial: some glider\
  \ structure survives with residual debris\n   - Chaotic: no recognizable glider\
  \ survives, bit count grows or disperses\n\n7. COMPARE outcomes: if (a) and (b)\
  \ both produce Elastic, O_h covariance\n   is confirmed in the bulk and the iter_245\
  \ non-covariance was a boundary\n   artifact. If they differ, non-covariance is\
  \ genuine.\n\n8. SECONDARY ANALYSIS (no separate hypothesis — data collection only):\n\
  \   Run the same-chirality destructive collisions on L=64 and characterize\n   the\
  \ debris. Specifically:\n   - Count debris bits at each timestep\n   - Check if\
  \ debris stabilizes into recognizable patterns after 80 steps\n   - If stable patterns\
  \ are found, compare against the glider catalog from\n     iter_241 to identify\
  \ whether new particle species are produced\n   This data will inform the Phase\
  \ 7.4 hypothesis but does not constitute\n   a standalone claim in this iteration.\n\
  \nFILES TO CREATE/MODIFY:\n- src/experiment_246_oh_covariance_64.py (new, main experiment)\n\
  - src/pre_registration.md (updated with this plan)\n\nPARAMETERS (declared in advance):\n\
  - Grid: L=64 FCC, toroidal boundaries\n- Collision center: (32, 32, 32)\n- Initial\
  \ separation: ~10 cells along approach axis\n- Simulation steps: 80\n- Glider: LUT-08\
  \ (4-bit sub-light, from iter_224)\n- Antiparticle: P-reflected LUT-08 (from iter_245)\n\
  - O_h rotation: same as iter_245 (to be identified from iter_245 archive code)\n\
  \nCONTROL: \n- Vacuum run (no gliders) on L=64 for 80 steps (verify grid stays empty)\n\
  - Solo runs for each glider variant (verify stability)\n- Original L=32 result from\
  \ iter_245 serves as the \"prior observation\"\n  being tested — no need to re-run\
  \ on L=32\n"
