experimenter_view: "The L=64 experiment REPRODUCES the O_h non-covariance observed\
  \ on L=32:\nthe unrotated opposite-chirality collision remains Elastic, while both\n\
  tested proper O_h rotations produce Chaotic outcomes. This refutes F1\nand demonstrates\
  \ that the non-covariance is NOT a boundary artifact.\n\nThe coordinate-rounding\
  \ diagnostic (F4-enhanced) reveals significant\ndifferences between rotated and\
  \ unrotated configurations:\n- Rotation 1: max rounding error = 1.0 lattice unit,\
  \ sub-lattice phase\n  mismatch, and minimum separation increased from 25.5 to 31.2.\n\
  - Rotation 2: zero rounding error but sub-lattice phases are swapped\n  between\
  \ the two gliders, and minimum separation drops to 18.0.\n\nBoth rotations place\
  \ some glider bits on invalid FCC sub-lattice\nparities (sub=-1), indicating the\
  \ discrete lattice cannot faithfully\nrepresent the rotated configuration. Per the\
  \ pre-registered F4-enhanced\ncriterion, the non-covariance is classified as a DEFINITIONAL\
  \ ALIGNMENT\nMISMATCH — a coordinate-rounding artifact of the lattice representation,\n\
  rather than a failure of dynamic O_h covariance in the CA rule itself.\n\nF5 is\
  \ NOT confirmed because neither alternative proper rotation\nrecovers the Elastic\
  \ outcome.\n\nAll six solo stability controls pass, confirming the rotated gliders\n\
  remain valid LUT-08 particles on L=64 (F3 not refuted).\n"
