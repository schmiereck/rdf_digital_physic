experimenter_view: 'The remnant contains 37 objects: 33 still-lifes and 4 oscillators
  (2× period-3,

  2× period-4). The core research question is whether the oscillators are spatially

  clustered.


  **Answer: No — the oscillators are NOT globally clustered, but one tight local

  pair exists.**


  The mean pairwise distance among the 4 oscillators is 70.10, compared to 70.68

  for all 37 objects combined (ratio = 0.992). A ratio near 1.0 means the

  oscillators are spread across the grid at roughly the same density as everything

  else — no significant global clustering.


  However, the pairwise distance matrix reveals one striking outlier: objects 2

  (p4, 4-bit, COM 26.2/39.0) and 3 (p3, 6-bit, COM 25.3/42.3) are only 3.46

  units apart — far closer than any other oscillator pair (next closest: obj5–obj9

  at 50.86). These two live in the same corner of the grid and may interact via a

  shared bath of single-bit still-lifes that also cluster in q≈25–50, r≈21–56.

  Objects 5 and 9 are isolated from each other (66.49 and 116.80 units from the

  pair, respectively).


  Spatially the oscillators occupy a compressed r-band (39–67, range 28) versus all

  objects (21–143, range 122), while spanning nearly the full q-extent (25–140 vs

  9–147). This suggests the oscillators lie along a roughly horizontal stripe in

  (q, r) space, with still-lifes scattered above and below them in the r-direction.


  Conclusion: distribution is broadly intermingled rather than core-vs-periphery,

  but there is one local oscillator cluster (obj2/obj3) and one wider still-life

  zone at high r (obj12 at r=143). The topology matches a remnant that froze in

  place from a random-walk decay rather than a structured collapse.

  '
