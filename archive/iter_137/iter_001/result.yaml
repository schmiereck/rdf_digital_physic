experimenter_view: 'The quadratic penalty (dividing by 1 + (bit_ratio-1)^2) heavily
  suppresses rules

  with high bit-ratios compared to the original linear penalty, reshuffling the

  leaderboard dramatically. The top two rules (rule_061, rule_012) both have large

  displacement (6.8 and 6.9) but bit_ratios of 5.5 and 6.0 respectively — they

  survive as top scorers because their displacements are so large that even the

  quadratic denominator (~21.25 and ~26) cannot drive the score to zero.

  However, both fail the bit_ratio < 3.0 viability gate. The highest-ranked rules

  passing the quadratic fitness > 0.001 threshold are rule_061, rule_012, rule_015,

  rule_071, rule_021, and rule_093, but none have bit_ratio < 3.0. The medium-density

  population from iter_136 contains no viable founder under the new stricter criteria.

  A targeted search in a different density regime or with explicit bit_ratio

  constraints during generation would be needed to find a viable founder.

  '
