experimenter_view: '11 of 100 randomly-generated C2-symmetric rules beat the inert
  baseline

  (0.0524) on the ash-based fitness metric. The top rule (rule_030) achieved

  fitness 0.0939, nearly 1.8x the baseline, while changing only 1 bit from

  the initial 325 (final_bits=326) and maintaining the same 72 objects. This

  suggests the displacement-fitness metric is working as intended: it rewards

  net center-of-mass motion while penalising structural changes. The majority

  of inert rules (fitness=0.0, displacement=0.0) left the ash pattern

  completely unchanged, confirming most C2 rules do not touch the ash. A

  handful of chaotic rules expanded to 5k–10k bits with large displacement,

  but were heavily penalised by the bit-count difference term, yielding near-

  zero fitness despite large raw displacements.

  '
