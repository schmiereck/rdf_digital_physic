notes: 'The classifier required a two-stage approach: (1) isolated-bit window check
  for ELASTIC, (2) adjacent-pair window check for moving-bound-state FUSION. A naive
  period-detection pass missed the FUSION cases because a v=c glider has no fixed-position
  period.

  '
