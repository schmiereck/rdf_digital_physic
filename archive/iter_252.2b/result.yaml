experimenter_view: 'All 5 tests passed successfully. The hybrid engine flawlessly
  projects the 2D hex glider onto the [111] plane of the 3D FCC lattice. Key findings:

  1. F3 is TRIGGERED: Pure LGCA cannot embed this hex rule because the hex CA is not
  bit-conserving on its 7-bit subspace. A 13-bit bijective LUT cannot reconcile the
  mismatch when inter-plane bits are zero.

  2. Embedded glider SURVIVES: Starts with 3 bits, stabilizes at 4 bits over 300 steps.

  3. Decomposition test PASSES: Each of the 3 seed bits individually annihilates to
  0, confirming the glider is a bound state.

  4. Positive control MATCHES EXACTLY: The 3D hybrid bit counts are algebraically
  identical to the 2D standalone simulation at every timestep, proving correctness
  of the embedding construction.

  '
