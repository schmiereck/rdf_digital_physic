experimenter_view: 'The champion rule is strikingly robust: all three vertical offsets
  (1, 2, 3)

  produce perfect Elastic Scattering with zero bit error and recession_score=1.0.

  The minimum approach distance is identical (2.236 ≈ √5) across all offsets,

  indicating the collision interaction region is the same size regardless of impact

  parameter. The distance time-series reveals a second collision cycle completing

  within 600 steps on the toroidal grid (distance returns to ~initial at step 400),

  explaining the final_components=4 — the measurement is post-second-collision.

  Scattering angles vary systematically with offset: the left component deflects

  ~1° more steeply per unit offset (-158.5° to -160.4°), while the right component

  shifts ~1° toward horizontal (-116.3° to -115.1°), demonstrating coherent

  impact-parameter dependence.

  '
