experimenter_view: 'The hypothesis that Gen-2 mean fitness would be ≥100% higher than
  Gen-1 mean is

  FALSIFIED. Gen-2 mean (0.04573) is 85.4% LOWER than Gen-1 mean (0.31260). The

  reason is clear from the distribution: 79 of 100 Gen-2 rules collapsed to zero

  fitness (still-death or chaotic explosion), whereas all 3 Gen-1 founders were

  viable by construction (pre-screened in iter_138).


  However, the top individual result tells a different story: 5 Gen-2 rules

  surpassed the Gen-1 top score of 0.36059, with the champion rule_033 achieving

  fitness=0.73078 — a 102.6% improvement over the Gen-1 champion. Both top Gen-2

  rules (rule_033, rule_052) come from crossover of rule_051 × rule_024, not the

  highest-fitness parent (rule_002), suggesting complementary traits in those two

  parents. The fitness landscape is highly rugged: breeding explores widely but

  most combinations are inviable, with rare exceptional offspring far exceeding

  their parents.

  '
