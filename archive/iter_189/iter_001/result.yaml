experimenter_view: 'The micro-jitter exploit is starkly visible in the distance profile:
  the

  midpoint distance (23.194827) and final distance (23.194827) are essentially

  identical to the initial distance (23.1948). The objects shift by only ~2.7e-5

  units over the full 100-step simulation — far below the margin=1.0 threshold.


  With the old DynamicCollisionFitness (bare inequalities), this rule scored 1.0

  because midpoint_d > initial_d and final_d > midpoint_d both held by a tiny

  floating-point epsilon. MarginalDynamicCollisionFitness eliminates this

  by requiring each transition to exceed the margin. Both approach and recession

  are False, so fitness = 0.0 as required.


  Rule loaded from dynamic_champion_rule.json (fallback path) since

  champion_rule.json did not exist; the fallback logic in the script handles this.

  '
