experimenter_view: 'The evolutionary search using the binary `MarginalDynamicCollisionFitness`
  function failed to find any rule that produces a dynamic collision. Over 10 generations,
  every single one of the ~1100 candidate rules scored a fitness of 0.0. The fitness
  landscape is completely flat and provides no gradient for the genetic algorithm
  to optimize. The strict, all-or-nothing criteria (approach, recession, bit conservation,
  object conservation) are too difficult to satisfy simultaneously through random
  mutation and crossover alone. The search did not even find rules that satisfied
  one of the criteria, like getting the particles to move towards each other. This
  indicates that a more nuanced, continuous fitness function that rewards partial
  progress is required to make evolutionary search viable for this problem.

  '
metrics:
  best_fitness: 0.0
  champion_found: false
  generations_ran: 10
notes: The experiment executed correctly, but the hypothesis that a simple GA with
  a binary fitness function could find a collision rule was refuted. The fitness function
  itself is the problem.
status: experiment_failed
