experimenter_view: 'No champion rule emerged in 10 generations of the C2-symmetric
  GA (100

  individuals, density-8 random init) under MarginalDynamicCollisionFitness

  on the 128x128 hex torus with horizon=400, midpoint=200, margin=1.0. Every

  one of the ~1100 evaluations scored 0.0 — the binary all-or-nothing fitness

  proved too sparse to give the GA any gradient to climb. The "best" recorded

  individual decayed each L-tromino from 3 to 2 cells very early (final

  bit_count=4 vs required 6) and then the two remnants sat completely still:

  initial / midpoint / final inter-object distances were all identical to 4

  decimal places (47.5184), so neither approach nor recession was satisfied

  and bit-conservation also failed. The 128x128 grid with a 47-cell starting

  separation plus the 400-step horizon makes this a much harder target than

  the 64x64 / horizon=100 setting in iter_188; without a smoothed proxy

  fitness, random C2 rules essentially never satisfy all four collision

  conditions simultaneously. No champion_rule.json or collision.gif were

  written since no rule met fitness == 1.0.

  '
