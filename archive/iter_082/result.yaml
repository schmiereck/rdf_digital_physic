experimenter_view: "The fitness metric (mean_last100 × stddev_all) clearly discriminates\
  \ between\nrule types across three distinct behavioral classes:\n\n1. STATIC (6/20\
  \ rules, fitness=0): The grid freezes completely within the first\n   few steps.\
  \ stddev=0 because the bit count never changes after fixation.\n   Example: rules\
  \ 01, 03, 09, 10, 12, 19. This is the CA analogue of a \"dead\"\n   phase transition\
  \ where the rule annihilates all transient structure.\n\n2. LOW_DYNAMIC (11/20 rules,\
  \ fitness=10K–186K): The grid reaches a near-stable\n   state with small, slow fluctuations\
  \ (stddev 2–41). These rules support\n   persistent but low-complexity activity\
  \ — structures that drift or flicker\n   without dramatic population swings.\n\n\
  3. HIGH_DYNAMIC (3/20 rules, fitness=260K–604K): Rules 05, 06, and 11 show\n   large,\
  \ sustained population variance (stddev 51–187). Rule 06 is the most\n   interesting:\
  \ final bit count of 3222 (vs initial ~5000) with stddev=187,\n   suggesting the\
  \ rule actively destroys bits while maintaining complex\n   transient structure.\
  \ This non-conserving, active regime is exactly the\n   type of dynamic complexity\
  \ the project seeks.\n\nThe fitness score variance (24.26 billion >> 1.0) confirms\
  \ the metric has\nhigh discriminating power. The metric correctly assigns low scores\
  \ to trivial\nbehaviors (frozen or static) and high scores to rules with sustained,\n\
  heterogeneous dynamics.\n"
