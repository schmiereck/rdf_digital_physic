notes: 'Rule generation uses MSB encoding (center=bit6) consistent with the established
  codebase. Simulation uses vectorized numpy roll on a toroidal 100×100 grid. Classification
  thresholds (stddev=0 for static, <50 for low_dynamic) were chosen empirically from
  the observed distribution. The random seed (42) is fixed for reproducibility of
  both rule generation and grid initialization.

  '
