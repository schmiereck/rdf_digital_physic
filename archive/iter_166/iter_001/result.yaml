experimenter_view: 'A fresh population of 100 random C2-symmetric rules (seed=166)
  was generated

  and evaluated with the composite fitness metric on a 128x128 grid (25% density,

  seed=42, 2000 steps). The vast majority of rules (96/100) produced zero CoM

  displacement between t=1200 and t=2000, indicating the dynamics froze into

  symmetric, non-moving configurations. Only 4 rules showed any motion:

  rule_048 (disp=0.100, 5087 bits, fitness=1.96e-5), rule_020 (disp=0.035),

  rule_022 (disp=0.017), rule_071 (disp=0.009), and rule_096 (disp=0.0005).

  The champion rule_048 achieves the highest composite fitness but with very

  low absolute displacement. C2-symmetric rules appear much harder to evolve

  movement from than the C6-symmetric non-conserving rules used in iter_159/163.

  The low fitness values suggest the C2 symmetry constraint is more restrictive,

  but rule_048 provides a valid founder for further evolutionary work if desired.

  '
