experimenter_view: 'Baseline over 100 random C2-symmetric rules with 8 kernel pairs
  each.

  Soup: 150x150, 25% density. Evaluation: 1600 steps (4 windows x 400).

  Annihilation_count=0: all rules preserved some initial COM motion; none erased the
  soup entirely.

  Dominant pattern is a large window-1 burst that decays to near-zero by window-2
  onward,

  which the std_dev term penalizes. The metric correctly scores these low-to-mid (0.62–0.98).

  High-fitness outliers (rule_024, rule_086 ≈ 0.981) show very small, flat velocity
  profiles

  — the metric rewards both sustained motion AND rapid-settling rules. Evolution target:

  rules with sustained, non-zero velocity across all 4 windows (true gliders).

  Mean=0.824 and std=0.090 establish the random-population floor for comparison.

  '
