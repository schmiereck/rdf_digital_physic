experimenter_view: 'The Dijkstra pathfinding on the discrete D4 spacetime lattice
  successfully models both

  Shapiro time delay and gravitational deflection of light. In the presence of a central
  mass

  (modeled as a local increase in discrete transition step cost U_v proportional to
  1/r),

  light rays exhibit a time delay of ~1.69 units. The path bending angle can be calculated

  by examining the tangent vectors of the geodesics before and after the central potential.

  As predicted by coordinate-time dilation in a flat spatial coordinate system, the
  ray bends

  away from the potential well, matching the behavior of a diverging lens in coordinate
  space.

  '
