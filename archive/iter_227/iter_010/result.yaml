experimenter_view: 'Fermat''s principle of least coordinate time dictates that the
  shortest path in coordinate time must avoid regions of higher potential U > 0 (where
  local coordinate velocity is slower). Consequently, the geodesics bend away from
  the origin in coordinate space, acting as a diverging lens in coordinates.

  The Shapiro time delay scales linearly with the potential amplitude A_grav and decays
  exponentially with the impact parameter b, reflecting the underlying Gaussian profile.
  Deflection angles in the discrete D4 space exhibit step-like quantization due to
  the lattice''s coordinate constraints, commonly locking into 45 or 56.31 degrees.

  '
