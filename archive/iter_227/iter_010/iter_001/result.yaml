experimenter_view: 'The 3x3 sweep cleanly exposes the two D4 lensing trends predicted
  by the

  Fermat-geodesic / coordinate-time formulation. Shapiro delay scales nearly

  linearly with A_grav at fixed b (e.g., for b=2: 0.88 -> 2.64 -> 4.40 as

  A_grav goes 1 -> 3 -> 5) and decays sharply with b at fixed A_grav, since

  the Gaussian potential''s exp(-r^2 / 2 sigma^2) factor suppresses U away

  from the well center. Net deflection is heavily quantized by the six

  light-like D4 edge directions: most runs lock onto the discrete value of

  exactly 45 degrees, while the weakest interactions (A_grav=1, b>=4) yield

  56.31 degrees because the geodesic only commits to a single lateral step

  near closest approach. All paths bend AWAY from the well in coordinate

  space, confirming that a positive U acts as a diverging lens in coordinate

  units (since U raises edge cost, Fermat''s principle pushes geodesics

  outward). The vacuum reference T_vac = 44 for every b confirms the

  tie-breaker properly resolves degeneracy without inflating the physical

  cost.

  '
