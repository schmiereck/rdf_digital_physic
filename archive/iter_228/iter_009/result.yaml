experimenter_view: "The analysis reveals key properties of the D4 18-channel LUT:\n\
  - 17.50% of all states scatter (change to a different state), indicating significant\
  \ collision dynamics.\n- 33 two-bit states have zero total momentum (head-on configurations).\n\
  - Transitions between transverse-transverse (TT) and scalar-scalar (SS) types occur:\n\
  \  6 TT→TT transitions (momentum-conserving within TT sector)\n  3 TT→SS transitions\
  \ (transverse to scalar conversion, net momentum zero)\n  24 SS→SS transitions (scalar-scalar\
  \ scattering)\n  0 SS→TT transitions (no scalar-to-transverse conversion observed)\n\
  This asymmetry (TT can produce SS but not vice versa in head-on config) suggests\n\
  an interesting feature of the symmetric LUT design.\n"
