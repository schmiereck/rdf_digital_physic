experimenter_view: 'The Gen-4 evolution under the stringent 400-800 step metric yielded
  surprising results.

  The top Gen-4 rule (rule_016) achieves fitness=6.479 with displacement=8.694 over
  steps

  400-800 and bit_ratio=1.585 — nearly as high as the Gen-3 champion''s 200-step fitness

  (6.55). This is remarkable given that iter_141 showed Gen-3 parents score near-zero
  on

  this same metric. The breeding process successfully generated offspring that maintain

  motion well past step 400. 80 of 100 rules are viable (fitness > 0.01, bit_ratio
  < 3.0),

  indicating strong heritability. The top two rules (rule_016, rule_092) are tied
  at

  fitness=6.479 suggesting they may be genetically identical or very similar clones.

  The mean fitness of 1.041 vs. the near-zero Gen-3 score on this metric demonstrates

  that the evolutionary pressure successfully shifted the population toward sustained
  motion.

  '
