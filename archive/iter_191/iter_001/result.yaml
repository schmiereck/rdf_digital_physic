- archive/iter_191/results/warm_start_population.json
experimenter_view: 'The warm-start population was successfully generated from g10_rule_001
  (iter_179 champion,

  fitness=56.0, chromosome length=128). Each of the 100 members is a mutated clone
  with 1 swap

  applied (mutation_rate=0.01 * 128 = 1.28, rounded to 1). Since the chromosome is
  binary (60

  zeros, 68 ones), ~50% of random swaps involve two identical values and produce no
  effective

  change — 53 members are identical to the parent, 47 have exactly 2 positions different.
  This

  is expected behavior per spec. The population provides a meaningful warm start:
  all members

  begin near a known glider-producing rule, avoiding the bootstrap problem of random

  initialization where motion-inducing rules are extremely rare.

  '
log_excerpt: 'Parent rule: g10_rule_001

  Chromosome length: 128

