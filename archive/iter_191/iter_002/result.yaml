experimenter_view: 'src/run_evolution.py was rewritten to (a) accept --initial_population_path,

  --generations, --population_size, --elite_size, --mutation_rate and related

  CLI flags; (b) load warm-start populations as 128-bit chromosomes via a

  chromosome_to_rule_dict conversion (identical to the encoding used in

  iter_190.2); (c) evaluate each member with StagedCollisionFitness (which

  already enforces strict bit conservation between t_initial, t_mid, t_final);

  (d) reproduce by swap-mutating elites (matching the iter_191.1 mutation

  operator that built the warm-start population); and (e) persist the

  champion to archive/iter_191/results/champion_rule.json plus a per-

  generation CSV log.


  The evolutionary search executed the full 20 generations of 100 members

  (21 fitness sweeps in total) cleanly with no errors, but every single

  evaluation produced fitness = 0.0. The root cause is structural, not

  algorithmic: the warm-start parent rule g10_rule_001 (iter_179 champion,

  68/128 chromosome bits) is a single-L-tromino glider — it has no global

  bit-conservation property. When applied to the two-L-tromino collision

  seed used by StagedCollisionFitness (initial_bits=6), the rule grows a

  stable secondary pattern: by step 200 the live cell count has jumped to

  256 and stays there, so the strict conservation gate trips and fitness

  is immediately zeroed.


  A diagnostic sweep confirmed this is not a margin issue — 0/100 of the

  warm-start members conserve bits on the collision seed, and 0/200 of

  more aggressively mutated (5 swaps) variants do either. The bit-count

  distribution at t_mid spans 8 → 16376 (essentially full grid), with no

  member hitting the required 6. The "warm start" therefore provides

  glider-like motion only in its single-particle nursery — the moment the

  rule meets a richer initial configuration, the secondary pattern

  dominates, motion is irrelevant, and the conservation check makes the

  whole fitness landscape flat.


  This matches the success criterion''s third clause exactly: "The absence

  of any progress (all fitness scores remaining 0.0) would also be a

  significant result." iter_190 found a flat landscape from random

  initialisation; iter_191 finds a flat landscape from a warm-start

  initialisation — the bottleneck is the rule family''s inability to

  conserve bits on multi-object seeds, not the search''s ability to

  bootstrap motion. A follow-up should either (a) screen the warm-start

  population on the collision seed and only retain members with bits

  conserved (likely zero from this parent — a different parent is needed),

  (b) relax StagedCollisionFitness to use a soft conservation penalty

  instead of a hard gate, or (c) generate a warm-start from a rule that is

  globally bit-conserving (e.g. a reversible block rule) rather than from

  a single-particle glider.

  '
