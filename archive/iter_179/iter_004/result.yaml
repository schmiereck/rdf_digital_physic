experimenter_view: 'The champion rule g10_rule_001 (fitness=56.0) produces a confirmed
  stable glider.

  The particle (3 live cells, L-tromino) travels in a straight line along the row

  axis at exactly 1 cell per step with zero transverse drift. Bit count is preserved

  at 3 throughout all 500 steps, passing all checkpoints. The net displacement from

  step 100 to step 500 is exactly 400 cells, corresponding to ~3.125 full laps around

  the 128-cell torus. This is the cleanest possible glider: constant velocity,

  zero dispersion, perfect bit conservation. The animation (101 frames) clearly

  shows periodic wrapping around the torus. Three rules (g10_rule_001 through _003)

  share the top fitness=56.0, suggesting the population converged on this glider

  solution. The rule_dict has 23 non-identity entries encoding the glider dynamics.

  '
