experimenter_view: 'The CheckpointFitness-guided GA decisively succeeded — primary
  goal (any

  rule with fitness > 0) was achieved already in generation 0 (3 lucky hits)

  and grew steadily under selection. A dramatic phase transition occurred at

  gen 7: max fitness jumped from 0.667 to 56.0 (an ~84x leap), suggesting

  the GA discovered a fundamentally new motion regime where the L-tromino

  maintains exactly 3 bits while travelling far across the 128x128 torus.

  By gen 10, 74/100 rules satisfy the bit-stability constraint at all four

  checkpoints, and the population mean has risen from 0.011 to 2.15 — a

  ~190x improvement, showing strong selective pressure under this robust

  metric. The chromosome was encoded as the 128-bit center-output LUT

  (matching how the simulator consumes rules); C2-symmetry was a property

  of the initial population only, and standard two-point crossover / per-bit

  mutation were applied on the flat 128-bit string.

  '
