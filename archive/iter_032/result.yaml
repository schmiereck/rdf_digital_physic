notes: 'The last-write-wins rotation loop causes A (period-3 under this rotation)

  to have its mappings overwritten at rot=3,4,5, breaking involution.

  The rule remains locally bit-conserving (all mappings preserve popcount),

  which guarantees the global bit count is invariant throughout the simulation.

  A seed with ≥2 bits would be needed to trigger any non-trivial dynamics.

  '
