experimenter_view: "The new fitness metric (1 / (1 + final_bit_count)) is extremely\
  \ effective at\ndiscriminating between chaotic and stabilizing rules. From a single\
  \ 4-bit T-shape\nseed on a 150x150 toroidal grid after 500 steps:\n- Both chaotic\
  \ rules explode dramatically (6913 and 20869 bits), yielding near-zero\n  fitness\
  \ scores (~0.000048 and ~0.000145).\n- The stabilizing rule (A3-B14) returns the\
  \ exact 4-bit seed unchanged, yielding the\n  perfect near-maximum score of 0.2\
  \ (= 1/(1+4)).\n- The discrimination ratios are 4174x and 1383x — far exceeding\
  \ the 10x threshold.\nThe metric is not merely discriminating; it is decisively\
  \ separating. The stabilizing\nrule's behavior (preserving the seed exactly) suggests\
  \ it maps every still-life\nneighborhood to itself, a robust property. This metric\
  \ would make a strong fitness\nfunction for evolving stabilizing rules.\n"
