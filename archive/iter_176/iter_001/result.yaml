experimenter_view: 'The champion rule g7_rule_076 produces a striking period-64 oscillator
  from the

  L-tromino seed. Starting at 3 bits, the pattern explodes to a maximum of 129 bits

  at step 63, then collapses back to 6 bits at step 64. This explosion-collapse cycle

  repeats with almost machine-like regularity every 64 steps throughout all 2000 steps:

  the bit count hits 129 at steps 63, 127, 191, 255, ..., 1983 (31 total peaks).

  Between peaks the bit count cycles through values drawn from a fixed set

  [3, 6, 9, 15, 18, 24, 33, 39, 42, 51, 66, 69, 84, 96, 129], giving a tail

  mean of 32.2 bits. The behavior is best described as a rapid initial explosion

  to 129 bits followed by a persistent, deeply intermittent period-64 oscillation

  that alternates between near-seed states (3-6 bits) and the full 129-bit expansion,

  consistent with the period-64 attractor noted in the iter_174 analysis.

  '
