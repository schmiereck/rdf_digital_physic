  \ 1: max=0.000119 (random initialisation, almost all rules static)\n- Gen 2: max=0.000332\
  \ (early mutation finds slightly better rules)\n- Gen 3: max=0.049621 — a 150x jump;\
  \ mutation found a rule with real displacement\n- Gen 4: max unchanged at 0.049621;\
  \ population mean still rising from 0.003 to 0.020\n- Gen 5: max=0.088793 — new\
  \ champion; mean jumps to 0.020\n- Gen 6–10: champion fitness plateaus at 0.08879282;\
  \ population mean continues to\n  rise from 0.042 to 0.055, indicating the elite\
  \ neighbourhood is being explored but\n  a better rule was not found within 10 generations.\n\
  \nThe champion rule (generation 5) has 5 bidirectional C2-symmetric pair mappings\n\
  (10 entries in the rule dict). When simulated with SimpleMotionFitness on a 64x64\n\
  grid for 200 steps, it achieves consistent displacement across all four 40-step\n\
  evaluation windows (low velocity std-dev) while keeping peak bit count low,\nresulting\
  \ in fitness=0.08879282. The pattern shows directed motion of the L-tromino\nseed\
  \ without explosive growth — consistent with a glider-like behaviour at this\nshort\
  \ timescale.\n"
