experimenter_view: "Ground truth established: the iter_218 \"champion v<c glider\"\
  \ GIF does NOT show a translating glider.\n- The visualization is a matplotlib figure\
  \ (480x480) of a 128x128 cellular-automaton grid,\n  title \"iter_218 LeakySubLightFitness\
  \ champion (v<c search)\", with step labels 0..200 in steps of 5.\n- Only 41 animation\
  \ frames exist (requested frames 50/100/150 do not exist; reported frames 0 and\
  \ 40 instead).\n- The \"background\" detected from frame-0 palette is (10,0,0) (the\
  \ dark plot interior, 58.9%). The second-largest\n  cluster is white (39.2%) — that\
  \ is matplotlib chrome (title, ticks, margins), not the CA.\n- \"Non-background\"\
  \ pixel count is dominated by chrome and is essentially constant across all 41 frames\n\
  \  (94785..94847, variation only 62 px out of 230400) — proving the live cell count\
  \ is nearly invariant.\n- Centroid of non-background pixels moves by (-0.08, -0.11)\
  \ image pixels over the whole animation,\n  which is ~0.03 grid cells. Zero coherent\
  \ translation.\n- Visual inspection of frames 0, 10, 20, 30, 40 confirms: a tiny\
  \ cluster of 2-4 white cells around\n  grid position (col=64, row=64), stuck in\
  \ place. No glider, no propagation, no streak.\n- Inter-frame diffs (~200-300 px)\
  \ are anti-aliasing flicker around the static cluster; the diff bbox\n  spans the\
  \ entire plot area, which is consistent with scattered chrome noise rather than\
  \ a moving object.\n- Verdict: not a 10-bit glider, not a 3-bit glider. It is a\
  \ near-stationary micro-pattern\n  (still life or low-amplitude oscillator) of ~2-4\
  \ active cells. The iter_218 v<c fitness signal\n  was a false positive on a static\
  \ blob, which explains why later attempts to \"reproduce the glider\"\n  have all\
  \ failed -- there is no propagating object to reproduce.\n"
