  \  stable=True  bits_ok=True\n  mass= 25.0  y_start=20  Y_vac=19.7500  Y_dyn=19.7500\
  \  dY=+0.0000  attracted=False  stable=True  bits_ok=True\n  mass= 35.0  y_start=12\
  \  Y_vac=11.7500  Y_dyn=12.2500  dY=+0.5000  attracted=True  stable=True  bits_ok=True\n\
  \  mass= 35.0  y_start=20  Y_vac=19.7500  Y_dyn=19.5000  dY=-0.2500  attracted=True\
  \  stable=True  bits_ok=True\n[SUCCESS] EMERGENT GRAVITATIONAL ATTRACTION DEMONSTRATED.\n\
  \  mass_value= 35.0: y_start=12 deflected UPWARDS  by +0.5000 ; y_start=20 deflected\
  \ DOWNWARDS by -0.2500.\nGlobal bit conservation across ALL runs: True\n"
