experimenter_view: 'The experiment attempted a glancing collision between two "opposing"
  3-bit L-tromino

  gliders (East vs West orientation) with a 2-cell lateral offset. Critical discovery:

  the 180-rotated "West" orientation [(0,0),(0,1),(1,1)] is NOT a stable glider under

  g10_rule_001 — it immediately explodes to 5 bits at step 1 and grows continuously

  at ~1.5 bits/step (reaching 303 bits by step 200).


  The East-moving glider (Glider A) demonstrated remarkable robustness: it maintained

  exactly 3 bits throughout all 200 steps, traveling through the expanding wavefront

  of the unstable West-seed. The interaction between the stable glider and the wavefront

  was negligible: -1 bit total.


  Rule g10_rule_001 is strictly directional — only one stable 3-bit glider orientation

  exists (+row / East). All other L-tromino orientations tested are immediately unstable.

  This means a "head-on collision" between two 3-bit v=1c gliders is physically impossible

  under this rule; genuine opposing gliders do not exist. The outcome classification

  "Passing Through" reflects that the stable East glider traversed the entire grid

  unaffected.

  '
log_excerpt: 'Glider A (East) after 200 steps: bits=3, cells=[(8, 128), (9, 128),
