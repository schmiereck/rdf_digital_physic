artifacts:
- src/test_glider_velocities.py
experimenter_view: 'We began by running and analyzing `src/glider_annihilation_analysis.py`
  to check the clean annihilation of the LUT-08 sub-light glider and its antiparticle
  on a 32^3 grid. The initial run failed to find a clean annihilation.

  By implementing `src/test_glider_velocities.py`, we analyzed the velocities of all
  4 stable rotated particles under O_h transformations and discovered they all propagate
  with the same velocity as the original glider ([-0.3, 0.0, 0.2]).

  This demonstrates that none of the pure spatial rotation/reflection configurations
  in the default stable particle set acts as the time-reversed antiparticle (which
  must propagate in the opposite direction, i.e., [+0.3, 0.0, -0.2]). Under standard
  time-reversal, the velocity channels themselves must be reversed (representing the
  CPT conjugate), but simply rotating/reflecting the coordinates without reversing
  the direction of propagation in the state-space does not automatically yield the
  opposite velocity under the forward rule. This explains why the search sweep returned
  zero clean annihilations.

  '
