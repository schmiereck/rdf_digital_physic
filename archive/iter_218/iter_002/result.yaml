experimenter_view: "The LeakySubLightFitness function proved highly effective for\
  \ the v<c glider search.\nKey observations:\n1. The fitness landscape is highly\
  \ searchable — champion improved from 42.3 to 84.3 in just 4 generations.\n2. By\
  \ Gen 10, 93% of the population had non-zero fitness, showing the leaky approach\
  \ creates a rich\n   continuous gradient (vs hard gates that eliminate most of the\
  \ population).\n3. The champion achieved perfect bit conservation (conservation\
  \ score = 1.0) with strong displacement\n   (net displacement = 84.3 cells over\
  \ 200 steps), yielding a fitness of 84.34.\n4. The average velocity of 0.639 cells/step\
  \ indicates the glider moves well below the sub-light\n   threshold of 0.9, confirming\
  \ valid v<c behavior.\n5. The evolutionary pressure from the leaky conservation\
  \ penalty successfully steered the population\n   toward rules that both move and\
  \ conserve bits simultaneously.\n6. Population mean fitness grew from 2.14 to 61.3,\
  \ showing broad improvement across the entire population,\n   not just the elite.\n"
