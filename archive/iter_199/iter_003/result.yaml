experimenter_view: "The iter_197.2 champion rule was a grid-filling exploit: starting\
  \ from a 4-cell\nT-tromino, it exploded to 2,699 bits by step 50 and saturated the\
  \ entire 128x128\ngrid (~16,384 cells) by step 150. Under the old scheme this scored\
  \ 16.70 because\nthe centre-of-mass barely moved (exploiting the displacement metric\
  \ with a\nnear-symmetric explosion).\n\nSparseGliderFitness rejects this pattern\
  \ via its hard bit-conservation gate: the\nfirst checkpoint at step 50 detects that\
  \ bits have grown from 4 to 2,699 and\nimmediately returns fitness = 0.0. The sparsity\
  \ term (bit_count / bounding_box_area)\nwould provide a secondary defence against\
  \ diffuse-but-conserving patterns, but in\nthis case it is never even reached.\n\
  \nThe new fitness function is structured as:\n  final_fitness = total_displacement\
  \ * mean_sparsity\nwhere sparsity = bit_count / bounding_box_area at each checkpoint.\
  \ True compact\ngliders (few bits, tight bounding box) score sparsity close to 1.0,\
  \ while\ndiffuse patterns score near 0.0. Combined with the hard bit-conservation\
  \ gate,\nthis dual defence makes the function significantly more exploit-resistant.\n\
  \nBoth fitness_v2.py (already existed with correct implementation) and\nvalidate_fitness.py\
  \ (rewritten to target the iter_197.2 champion) are confirmed\nworking.\n"
