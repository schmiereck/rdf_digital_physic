  Final: count=1, positions=[(25, 25)]\n=== Sim 2 – Test (two bits: center + East)\
  \ ===\nInitial count: 2, positions: [(25, 25), (26, 25)]\n  t=  1: [(24, 26), (26,\
  \ 25)]\n  t=  2: [(25, 25), (26, 25)]\n  t=  3: [(24, 26), (26, 25)]\n  t=  4: [(25,\
  \ 25), (26, 25)]\nFinal: count=2, positions=[(25, 25), (26, 25)]\n=== Classification\
  \ ===\nis_bit_conserving:     True\ncontrol_behavior:      STATIONARY\ntest_behavior:\
