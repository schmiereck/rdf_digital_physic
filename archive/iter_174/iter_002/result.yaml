experimenter_view: 'Champion rule g7_rule_076 (fitness=0.674) starts as a 3-cell L-tromino
  and

  undergoes a dramatic transient expansion to 129 live cells, before settling

  into a period-64 oscillation in the tail (steps 1600-2000, mean ~32 cells,

  std ~26). The net displacement over 2000 steps is only ~3.8 cells, but the

  per-window velocity is highly variable (CV=0.58): the 1200→1600 window sees

  12.6 cells of displacement while the flanking windows see only 3.8 cells.

  This pattern is consistent with an intermittent or phase-shifting glider

  rather than a stable periodic glider — the particle alternates between

  compact, fast-moving phases and diffuse, slow phases. The period-64 bit-count

  oscillation in the tail confirms the system reaches a periodic attractor,

  but the attractor is large and irregular. The fitness formula penalises the

  bit-count growth (initial 3 → final 6, factor ×0.5), so the true glider

  speed is higher; the rule is among the most mobile in the population despite

  the instability penalty.

  '
