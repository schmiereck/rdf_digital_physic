experimenter_view: 'The iter_200.1 champion rule (fitness=1.927, 16 mappings) produces
  a clean

  period-4 stationary oscillator from the standard 3-bit L-tromino seed on a

  128×128 toroidal grid. All four phases are distinct L-tromino orientations

  (related by rotation/reflection), and bit conservation is perfect (3 bits

  at every step). The oscillator''s center-of-mass drifts by ≤0.67 cells in

  any direction but has zero net displacement per cycle.


  The GIF is zoomed to a 10×10-cell window (rows 60–70, cols 60–70) centered

  on the oscillating region, making the shape changes clearly visible at 4 fps

  over 16 steps (four full cycles). Frame 0 and frame 16 show the identical

  starting state, confirming the period-4 cycle is complete.


  Note: The rule file is at iter_200.1 (not iter_200); the task path

  `champion_v_lt_c_rule.json` was found at the iter_200.1 subdirectory.

  The iter_200 file `champion_vc_rule.json` (fitness=0.471) produces only a

  period-1 still life and was correctly bypassed by the candidate search.

  '
