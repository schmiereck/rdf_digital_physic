  SparseGliderFitness checkpoints are at steps 50, 100, 150, 200 --

  none of which are multiples of the oscillation period. The evaluator

  therefore samples the CoM at different oscillation phases and mistakes

  the phase-to-phase shift for genuine translational motion.

  '
