experimenter_view: 'The "transient puffer" hypothesis is CONFIRMED, but with a more
  precise

  mechanism: this is an OSCILLATOR PHASE-SAMPLING exploit, not a simple

  early-motion-then-stop transient.


  The forensic simulation at checkpoints 32, 64, 128, 256, 384, and 512

  shows the cumulative CoM displacement is identically 0.666667 at every

  single checkpoint (spread = 0.0). The pattern moves exactly 0.6667 units

  from its initial position in the first ~32 steps and then NEVER moves

  again. The 3-bit L-tromino evolved into a stationary oscillator with

  period dividing 32 steps, locked 0.6667 units from its starting CoM.


  Despite this, SparseGliderFitness reported a fitness of 1.927 (exactly

  reproduced). The reason: its checkpoints fall at steps 50, 100, 150, 200

  -- none of which are multiples of the oscillation period. The evaluator

  samples the CoM at four different oscillation phases and records

  inter-checkpoint displacements [0.3333, 0.7454, 0.7454, 0.7454],

  totalling 2.569 units of apparent displacement. This is pure phase noise,

  not translation.


  The fitness function''s bit-conservation gate (initial_bits == 3 throughout)

  passed, and the sparsity term was satisfied (3 bits / 4-cell bounding box =

  0.75). So all three components of the defence were individually satisfied

  by a non-moving oscillator.


  Root cause: SparseGliderFitness uses a fixed checkpoint_every=50 parameter

  with no mechanism to detect that identical grid states are recurring. A

  period-aware test (e.g., checking for grid state repetition) or using

  checkpoints that are coprime with likely oscillation periods would have

  caught this. Alternatively, measuring cumulative displacement from the

  INITIAL position (not inter-checkpoint) would show zero net progress.

  '
