experimenter_view: "The champion rule from iter_200.1 (fitness=1.927, 16 explicit\
  \ mappings) was\nsimulated for 1024 steps on the standard 3-bit L-tromino seed in\
  \ a 128x128\ntoroidal grid. The particle shows ZERO net translational velocity:\
  \ the\nunwrapped CoM remains stationary at (col≈63.33, row≈63.67) throughout all\n\
  1024 steps, confirmed by identical CoM values at every 128-step checkpoint.\n\n\
  The CSV data reveals a clean period-4 oscillation with four distinct states:\n \
  \ step 0 (mod 4): CoM=(63.33, 63.67), hash=34ed349a...\n  step 1 (mod 4): CoM=(63.33,\
  \ 64.00), hash=a2aed0ec...\n  step 2 (mod 4): CoM=(63.67, 63.67), hash=44d3ed4d...\n\
  \  step 3 (mod 4): CoM=(63.67, 64.00), hash=f067db67...\nThe CoM oscillates within\
  \ a ±0.33 cell range but has no net drift.\n\nBit conservation is perfect: bit count\
  \ stays exactly 3 for all 1024 steps.\n\nConclusion: Under standard conditions (L-tromino\
  \ + 128x128), the iter_200.1\nchampion rule produces a period-4 stationary oscillator\
  \ (blinker), not a\ntranslating glider. This is consistent with the iter_200 commit\
  \ note that\n\"platform instability prevents full quantitative characterization\"\
  \ — the\nglider may require a specific perturbation or different initial conditions\n\
  to exhibit translational motion, or the fitness function rewarded displacement\n\
  in a transient early phase that doesn't persist.\n"
