[roles]
planner_model    = "gemini-2.5-pro"
planner_adapter  = "gemini"
executor_adapter = "claude-code"

# --- NEU: Flexible Agenten-Konfiguration ---

# Der günstige Executor über OpenRouter (wird für 'low' Komplexität genutzt)
[agents.executor.low]
adapter = "OpenRouterExecutorAdapter"
model   = "qwen/qwen3.6-35b-a3b"

# Claude über den Pro Plan (Login), wird für 'medium' Komplexität genutzt
[agents.executor.medium]
adapter = "ClaudeCodeExecutorAdapter"
model   = "claude-sonnet-4-6"

# Hier könnten wir auch den 'high' Executor explizit definieren
[agents.executor.high]
adapter = "ClaudeCodeExecutorAdapter"
model   = "claude-opus-4-7"

[claude_code]
allowed_tools = "Read,Write,Edit,Bash"
# Bei true wird permission_mode="bypassPermissions" gesetzt (Claude Agent SDK).
# User ist immer in der Loop und kann Strg+C drücken.
dangerously_skip_permissions = false

[limits]
max_iterations = 100
max_state_tokens = 8000           # Hard-Limit für current_state.md (Tokens)
planner_timeout_sec = 180
executor_timeout_sec = 14400    # 4 h; null = unlimited
max_retries_on_parse_fail = 2
max_retries_on_state_too_long = 2

[agent_routing]
default_complexity = "medium"
max_depth = 4

[cache]
ttl_hours = 6
min_cache_tokens = 32768

[git]
auto_commit = true
auto_push = true

[ui]
verbose = true

