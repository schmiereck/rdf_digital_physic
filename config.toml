[roles]
planner_model    = 'gemini-3.5-flash'
planner_adapter  = 'gemini'
executor_adapter = 'claude-code'

# --- NEU: Flexible Agenten-Konfiguration ---

# Der guenstige Executor ueber OpenRouter (wird fuer 'low' Komplexitaet genutzt)
[agents.executor.low]
adapter = 'OpenRouterExecutorAdapter'
model   = 'qwen/qwen3.6-35b-a3b'

# Claude ueber den Pro Plan (Login), wird fuer 'medium' Komplexitaet genutzt
[agents.executor.medium]
adapter = 'ClaudeCodeExecutorAdapter'
model   = 'claude-sonnet-4-6'

# Hier koennten wir auch den 'high' Executor explizit definieren
[agents.executor.high]
adapter = 'ClaudeCodeExecutorAdapter'
model   = 'claude-opus-4-7'

[claude_code]
allowed_tools = 'Read,Write,Edit,Bash'
dangerously_skip_permissions = false

[limits]
max_iterations = 100
max_state_tokens = 8000
planner_timeout_sec = 180
executor_timeout_sec = 14400

[agent_routing]
default_complexity = 'medium'
max_depth = 4

[cache]
ttl_hours = 6
min_cache_tokens = 32768

[git]
auto_commit = true
auto_push = false

[ui]
verbose = true
